<script>
/* ============ CONFIGURACIÓN DE HOJAS ============ */
const SHEET_ID = '1Zi2cBd0WGUTks-S0XCxR0hoGpB9KZGuqisFhzdtJl4s';

const SHEETS_CONFIG = [
  { name: 'ACUMULADO J',   key: 'acumuladoJ'   },
  { name: 'PROMEDIOS J',   key: 'promediosJ'   },
  { name: 'ACUMULADO E',   key: 'equipo'       },
  { name: 'PROMEDIOS E',   key: 'promediosE'   },
  { name: 'Base Datos J',  key: 'baseDatosJ'   },
  { name: 'Base Datos E',  key: 'baseDatosE'   },
  { name: '4 FACTORES',    key: '4factores'    },
  { name: 'PROMEDIOS 4F',  key: 'promedios4f'  },
  { name: 'ACUMULADO 4F',  key: 'acumulado4f'  },
  { name: 'RANKINGS J',    key: 'rankingsJ'    },
  { name: 'RANKINGS E',    key: 'rankingsE'    },
];

const VALID_SECTIONS = ['principal', 'equipos', 'jugadores', 'factores', 'scouting', 'diagnostico'];

/* ============ ESTADO GLOBAL ============ */
let DATA = {};
let lastUpdated = null;
let lastErrors = [];
let sidebarOpen = false;
let currentSection = 'principal';

const tabState = {
  equipos: 'acumulado',
  jugadores: 'acumulado',
  factores: 'partido',
  scouting: 'jugadores',
};

const tableState = {};
const factorSelection = {
  scoutingPlayers: [null, null],
  scoutingTeams: [null, null],
};

const chartInstances = {};
let equipoDestacado = -1;   // indice del equipo resaltado en el scatter ORTG/DRTG

/* Breakpoints en JS. Chart.js congela las opciones al crear el grafico, asi que
   lo que dependa del ancho se lee de aca y se re-renderiza al cruzar un corte. */
const BP = {
  movil:   () => (window.innerWidth || 1024) < 640,
  tablet:  () => (window.innerWidth || 1024) < 1024,
  bucket:  () => ((window.innerWidth || 1024) < 640 ? 0 : (window.innerWidth || 1024) < 1024 ? 1 : 2),
};

/* ============ UTILIDADES ============ */
function normalizeText(s) {
  return (s === null || s === undefined ? '' : String(s))
    .normalize('NFD').replace(/[\u0300-\u036f]/g, '')
    .trim().toUpperCase();
}

function escapeHtml(str) {
  return String(str === null || str === undefined ? '' : str).replace(/[&<>"']/g, (m) => (
    { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[m]
  ));
}
function escapeAttr(str) { return escapeHtml(str).replace(/`/g, '&#96;'); }

function toNumber(v) {
  if (v === null || v === undefined || v === '') return null;
  if (typeof v === 'number') return Number.isFinite(v) ? v : null;
  const n = parseFloat(String(v).replace(',', '.'));
  return Number.isFinite(n) ? n : null;
}

function findColumnLabel(cols, candidates) {
  if (!cols || !cols.length) return null;
  const normalized = cols.map((c) => ({ label: c.label, norm: normalizeText(c.label) }));
  for (const cand of candidates) {
    const nc = normalizeText(cand);
    const hit = normalized.find((c) => c.norm === nc);
    if (hit) return hit.label;
  }
  for (const cand of candidates) {
    const nc = normalizeText(cand);
    const hit = normalized.find((c) => c.norm.includes(nc));
    if (hit) return hit.label;
  }
  return null;
}

function countDistinct(rows, label) {
  if (!label) return rows.length;
  const set = new Set(rows.map((r) => normalizeText(r.formatted[label])).filter((v) => v !== ''));
  return set.size;
}

function sortRows(rows, label, dir) {
  if (!label) return rows;
  const sample = rows.find((r) => r.values[label] !== null && r.values[label] !== undefined && r.values[label] !== '');
  const isNumeric = sample ? toNumber(sample.values[label]) !== null : false;
  const sorted = [...rows].sort((a, b) => {
    if (isNumeric) {
      const na = toNumber(a.values[label]);
      const nb = toNumber(b.values[label]);
      if (na === null && nb === null) return 0;
      if (na === null) return 1;
      if (nb === null) return -1;
      return na - nb;
    }
    const sa = (a.formatted[label] ?? '').toString();
    const sb = (b.formatted[label] ?? '').toString();
    return sa.localeCompare(sb, 'es');
  });
  return dir === 'desc' ? sorted.reverse() : sorted;
}

function isEquipoTipo(row) {
  return Object.values(row.formatted).some(v => normalizeText(v) === 'EQUIPO TIPO');
}

function filterRows(rows, term) {
  let filtered = rows.filter(r => !isEquipoTipo(r));
  if (!term) return filtered;
  const t = normalizeText(term);
  return filtered.filter((r) => Object.values(r.formatted).some((v) => normalizeText(v).includes(t)));
}

function sheet(key) {
  return DATA[key] || { cols: [], rows: [], error: 'Sin datos' };
}

function cleanName(name) {
  if (!name) return '';
  return String(name).replace(/\s*-\s*MM/g, '').trim();
}

/* ============ MÓDULO LOGOS (hosting estático) ============ */
/*
  CONTEXTO: la app corre en GitHub Pages. No hay backend. `google.script.run`
  NO EXISTE fuera del sandbox de HtmlService, así que todo el approach de
  base64-desde-Drive es inaplicable acá. Este módulo resuelve logos por HTTP.

  Cascada de proveedores, primero que responde gana:
    0) CFG.overrides       -> mapa manual nombre -> URL (casos raros)
    1) CFG.jsonpUrl        -> Apps Script publicado como API JSONP (opcional,
                              mantiene el workflow "tiro el PNG en Drive")
    2) CFG.basePath        -> archivos del propio repo por convención de slug
                              (RECOMENDADO: mismo origen, cachea el browser,
                               no ensucia el canvas, cero latencia de Drive)
    3) null                -> el plugin dibuja el fallback de iniciales

  Agregar un equipo nuevo = subir `logos/<slug>.png` al repo. Nada más.
*/
const LOGOS = (function () {

  const CFG = {
    basePath: 'logos/',
    extensiones: ['png', 'webp', 'jpg', 'jpeg', 'jfif', 'avif', 'svg', 'gif'],
    // Dejalo en '' para desactivar. Si lo usás: URL /exec del Web App.
    jsonpUrl: '',
    jsonpTimeout: 8000,
    overrides: {
      // "NAUTICO ENSENADA": "logos/nautico.png",
    },
  };

  const DEFAULT_LOGO = "data:image/svg+xml;charset=utf-8,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 24 24%22 fill=%22%239CA3AF%22%3E%3Cpath d=%22M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5%22%3E%3C/path%3E%3C/svg%3E";

  const cache = new Map();      // CLAVE -> { img: HTMLImageElement|null, url: string|null }
  const enVuelo = new Map();    // CLAVE -> Promise
  let mapaRemoto = null;        // CLAVE -> URL (del JSONP)
  let promesaRemota = null;

  /* ---------- normalización y slugs ---------- */

  function normalizar(s) {
    return String(s === null || s === undefined ? '' : s)
      .normalize('NFD').replace(/[\u0300-\u036f]/g, '')
      .toUpperCase()
      .replace(/\s*-\s*MM\b/g, '')
      .replace(/[^A-Z0-9]+/g, ' ')
      .trim();
  }

  function slug(s) {
    return normalizar(s).toLowerCase().replace(/\s+/g, '-');
  }

  /*
    Candidatos de nombre de archivo, de más específico a más laxo.
    "ESTUDIANTES DE LA PLATA 'A'" ->
      estudiantes-de-la-plata-a / estudiantes_de_la_plata_a / estudiantesdelaplataa
      + primeras 2 palabras: estudiantes-de / estudiantes
  */
  function nombresArchivo(nombreEquipo) {
    const base = slug(nombreEquipo);
    if (!base) return [];
    const partes = base.split('-').filter(Boolean);
    const out = [base, base.replace(/-/g, '_'), base.replace(/-/g, '')];

    // Sin las iniciales sueltas: "C F GONNET" -> "gonnet", "CLUB A BANFIELD" -> "club-banfield"
    const largas = partes.filter(t => t.length > 1);
    if (largas.length && largas.length < partes.length) {
      out.push(largas.join('-'), largas.join(''));
    }

    // Recortes por delante y por detras: el nombre distintivo puede estar
    // en cualquier punta ("NAUTICO ensenada" vs "c f GONNET").
    if (partes.length > 2) out.push(partes.slice(0, 2).join('-'), partes.slice(-2).join('-'));
    if (partes.length > 1) out.push(partes[0], partes[partes.length - 1]);
    if (largas.length > 1) out.push(largas[largas.length - 1], largas[0]);

    return out.filter(v => v && v.length > 1).filter((v, i, a) => a.indexOf(v) === i);
  }

  function candidatos(nombreEquipo) {
    const urls = [];
    const clave = normalizar(nombreEquipo);

    // 0) override manual
    const ovKey = Object.keys(CFG.overrides).find(k => normalizar(k) === clave);
    if (ovKey) urls.push(CFG.overrides[ovKey]);

    // 1) mapa remoto (JSONP) — match exacto y después contención
    if (mapaRemoto) {
      if (mapaRemoto[clave]) {
        urls.push(mapaRemoto[clave]);
      } else {
        let mejor = null, len = 0;
        Object.keys(mapaRemoto).forEach((k) => {
          if ((clave.indexOf(k) !== -1 || k.indexOf(clave) !== -1) && k.length > len) {
            mejor = k; len = k.length;
          }
        });
        if (mejor) urls.push(mapaRemoto[mejor]);
      }
    }

    // 2) archivos del repo por convención.
    //    Tanda 1 = nombre exacto (acierta el 90% de las veces).
    //    Tanda 2 = variantes y recortes, solo si la 1 no dio nada.
    const nombres = nombresArchivo(nombreEquipo);
    const tanda1 = [], tanda2 = [];
    nombres.forEach((n, i) => {
      CFG.extensiones.forEach((ext) => {
        (i === 0 ? tanda1 : tanda2).push(CFG.basePath + n + '.' + ext);
      });
    });

    return [urls.concat(tanda1), tanda2];
  }

  /* Prueba un lote de URLs EN PARALELO y devuelve la de menor indice que cargo. */
  async function primeraQueCargue(urls) {
    if (!urls.length) return null;
    const res = await Promise.all(urls.map(u =>
      cargarImagen(u).then(img => ({ img: img, url: u })).catch(() => null)
    ));
    return res.find(Boolean) || null;
  }

  /* ---------- carga ---------- */

  function cargarImagen(url) {
    return new Promise((resolve, reject) => {
      const img = new Image();
      // Sin crossOrigin: los assets del repo son mismo-origen y Drive no manda
      // CORS. Si algún día exportás el canvas a PNG, pasá TODO a assets locales.
      img.onload = () => (img.naturalWidth > 0 ? resolve(img) : reject(new Error('vacía')));
      img.onerror = () => reject(new Error('404 ' + url));
      img.src = url;
    });
  }

  function cargarJsonp(url) {
    return new Promise((resolve, reject) => {
      const cb = '__logosCb_' + Math.random().toString(36).slice(2);
      const script = document.createElement('script');
      const limpiar = () => { delete window[cb]; script.remove(); };
      const guarda = setTimeout(() => { limpiar(); reject(new Error('JSONP timeout')); }, CFG.jsonpTimeout);

      window[cb] = (data) => { clearTimeout(guarda); limpiar(); resolve(data); };
      script.onerror = () => { clearTimeout(guarda); limpiar(); reject(new Error('JSONP error')); };
      script.src = url + (url.indexOf('?') === -1 ? '?' : '&') + 'callback=' + cb;
      document.head.appendChild(script);
    });
  }

  function asegurarMapaRemoto() {
    if (!CFG.jsonpUrl) return Promise.resolve(null);
    if (promesaRemota) return promesaRemota;

    promesaRemota = cargarJsonp(CFG.jsonpUrl)
      .then((resp) => {
        const dict = (resp && resp.logos) ? resp.logos : (resp || {});
        mapaRemoto = {};
        Object.keys(dict).forEach((k) => { mapaRemoto[normalizar(k)] = dict[k]; });
        console.log('[LOGOS] mapa remoto:', Object.keys(mapaRemoto).length, 'equipos');
        return mapaRemoto;
      })
      .catch((e) => {
        console.warn('[LOGOS] sin mapa remoto (' + e.message + '), voy con archivos locales');
        mapaRemoto = null;
        return null;
      });

    return promesaRemota;
  }

  async function resolverUno(nombreEquipo) {
    const clave = normalizar(nombreEquipo);
    if (!clave) return { img: null, url: null };
    if (cache.has(clave)) return cache.get(clave);
    if (enVuelo.has(clave)) return enVuelo.get(clave);

    const tarea = (async () => {
      await asegurarMapaRemoto();
      const tandas = candidatos(nombreEquipo);
      for (let i = 0; i < tandas.length; i++) {
        const hit = await primeraQueCargue(tandas[i]);
        if (hit) { cache.set(clave, hit); return hit; }
      }
      const r = { img: null, url: null };
      cache.set(clave, r);
      return r;
    })();

    enVuelo.set(clave, tarea);
    tarea.finally(() => enVuelo.delete(clave));
    return tarea;
  }

  /**
   * Resuelve un lote de equipos. Devuelve Promise<{encontrados, faltantes[]}>.
   * Llamalo con los nombres que salen de la planilla, no antes.
   */
  async function resolver(nombres) {
    const unicos = Array.from(new Set((nombres || []).map(n => String(n || '')).filter(Boolean)));
    const res = await Promise.all(unicos.map(resolverUno));
    const faltantes = unicos.filter((n, i) => !res[i].img);
    if (faltantes.length) {
      console.warn('[LOGOS] sin archivo (' + faltantes.length + '/' + unicos.length + '):', faltantes);
      console.warn('[LOGOS] esperaba, por ejemplo:', CFG.basePath + slug(faltantes[0]) + '.png');
    } else if (unicos.length) {
      console.log('[LOGOS] ' + unicos.length + '/' + unicos.length + ' logos OK');
    }
    return { encontrados: unicos.length - faltantes.length, total: unicos.length, faltantes: faltantes };
  }

  /* ---------- lectura sincrónica (para el render loop) ---------- */

  function getImage(nombreEquipo) {
    const r = cache.get(normalizar(nombreEquipo));
    return (r && r.img && r.img.complete && r.img.naturalWidth > 0) ? r.img : null;
  }

  function getUrl(nombreEquipo) {
    const r = cache.get(normalizar(nombreEquipo));
    return (r && r.url) ? r.url : null;
  }

  function iniciales(nombre) {
    return String(nombre || '?')
      .split(/\s+/).filter(Boolean).slice(0, 2)
      .map(p => p.charAt(0).toUpperCase()).join('');
  }

  return {
    CFG, DEFAULT_LOGO,
    resolver, getImage, getUrl, iniciales,
    normalizar, slug,
    // Diagnóstico: LOGOS.debug() en la consola
    debug: () => {
      const filas = [];
      cache.forEach((v, k) => filas.push({ equipo: k, archivo: v.url || '— FALTA —' }));
      console.table(filas);
      return { resueltos: cache.size, jsonp: CFG.jsonpUrl || '(desactivado)', basePath: CFG.basePath };
    },
  };
})();

/* ============ CAPA DE DATOS (GViz) ============ */
async function fetchSheet(sheetName) {
  const url = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:json&sheet=${encodeURIComponent(sheetName)}`;
  const res = await fetch(url);
  if (!res.ok) throw new Error(`HTTP ${res.status}`);
  const text = await res.text();
  const match = text.match(/google\.visualization\.Query\.setResponse\(([\s\S]*)\);?\s*$/);
  if (!match) throw new Error('Formato de respuesta no reconocido');
  let json;
  try {
    json = JSON.parse(match[1]);
  } catch (e) {
    throw new Error('No se pudo interpretar el JSON de la hoja');
  }
  if (json.status === 'error') {
    const detail = json.errors && json.errors[0]
      ? (json.errors[0].detailed_message || json.errors[0].message)
      : 'Error desconocido de GViz';
    throw new Error(detail);
  }
  const table = json.table || { cols: [], rows: [] };
  const cols = (table.cols || []).map((c, i) => ({
    id: c.id || `c${i}`,
    label: (c.label && String(c.label).trim()) ? String(c.label).trim() : (c.id || `Columna ${i + 1}`),
    type: c.type || 'string',
  }));
  const rows = (table.rows || []).map((r) => {
    const values = {};
    const formatted = {};
    const cells = r.c || [];
    cols.forEach((col, i) => {
      const cell = cells[i];
      const rawVal = cell && cell.v !== undefined ? cell.v : null;
      const fmtVal = cell && cell.f !== undefined && cell.f !== null ? cell.f : rawVal;
      values[col.label] = rawVal;
      formatted[col.label] = fmtVal === null || fmtVal === undefined ? '' : fmtVal;
    });
    return { values, formatted };
  });
  return { cols, rows };
}

async function fetchAllData() {
  const results = await Promise.all(SHEETS_CONFIG.map(async (cfg) => {
    try {
      const data = await fetchSheet(cfg.name);
      return { key: cfg.key, name: cfg.name, ok: true, data };
    } catch (err) {
      return { key: cfg.key, name: cfg.name, ok: false, error: (err && err.message) || String(err) };
    }
  }));
  const nextData = {};
  const errors = [];
  results.forEach((r) => {
    if (r.ok) {
      nextData[r.key] = r.data;
    } else {
      nextData[r.key] = { cols: [], rows: [], error: r.error };
      errors.push(r);
    }
  });
  DATA = nextData;
  lastUpdated = new Date();
  return errors;
}

}
function renderModernCard(title, value, subtitle, iconSvg) {

      ? 'bg-accent text-black border-accent'
      : 'border-hairline text-muted hover:text-ink hover:border-ink/30';

}
function buildSelect(id, options, selected, onchange) {
  const opts = options.map((o) => `<option value="${escapeAttr(o)}" ${o === selected ? 'selected' : ''}>${escapeHtml(o)}</option>`).join('');
  return `<select id="${id}" onchange="${onchange}" class="w-full bg-surface2 border border-hairline rounded-md px-3 py-2 text-sm focus:border-accent outline-none">${opts}</select>`;

/* ============ TABLA GENÉRICA ============ */
function renderTable(tableId, sheetKey, opts = {}) {
  const data = sheet(sheetKey);
  if (data.error) return renderErrorCard(`${sheetKey}: ${data.error}`);
  if (!data.cols.length) return renderEmptyCard('Esta hoja no tiene columnas.');
  if (!data.rows.length) return renderEmptyCard('No hay filas para mostrar todavía.');

  const st = tableState[tableId] || (tableState[tableId] = { sortLabel: null, sortDir: 'asc', search: '' });
  let rows = filterRows(data.rows, st.search);
  if (st.sortLabel) rows = sortRows(rows, st.sortLabel, st.sortDir);
  const limit = opts.limit;
  const shownRows = limit ? rows.slice(0, limit) : rows;
  const cols = data.cols;

  const searchBox = opts.searchable === false ? '' : `
    <div class="mb-3">
      <input type="text" placeholder="Buscar…" value="${escapeAttr(st.search)}"
        oninput="onTableSearch('${tableId}', this.value)"
        data-focus-id="search-${tableId}"
        class="w-full md:w-72 bg-surface2 border border-hairline rounded-md px-3 py-2 text-sm placeholder:text-muted focus:border-accent outline-none" />
    </div>`;

  const theadCells = cols.map((c) => {
    const active = st.sortLabel === c.label;
    const arrow = active ? (st.sortDir === 'asc' ? '↑' : '↓') : '';
    const clickable = opts.sortable === false ? '' : `onclick="onTableSort('${tableId}','${escapeAttr(c.label)}')" class="cursor-pointer select-none hover:text-accent transition-colors"`;
    
    return `<th ${clickable} class="px-4 py-3 text-left text-[11px] uppercase tracking-wider text-muted whitespace-nowrap font-display font-semibold border-b border-hairline bg-surface2/50 backdrop-blur">${escapeHtml(c.label)} <span class="text-accent ml-1">${arrow}</span></th>`;
  }).join('');

  const tbodyRows = shownRows.map((r) => {
    const tds = cols.map((c) => {
      const val = r.values[c.label];
      const fmt = r.formatted[c.label] ?? '';
      
      let cellStyle = "px-4 py-3 whitespace-nowrap text-sm border-b border-hairline/40 text-ink/90";
      
      if (typeof val === 'number') {
        cellStyle += " font-mono tabular-nums";
        if (val > 0 && !c.label.toLowerCase().includes('nombre') && !c.label.toLowerCase().includes('equipo')) {
          cellStyle += " text-accent font-medium"; 
        }
      }
      
      return `<td class="${cellStyle}">${escapeHtml(fmt)}</td>`;
    }).join('');
    return `<tr class="hover:bg-surface2/40 transition-colors cursor-default">${tds}</tr>`;
  }).join('');

  const countLabel = `<p class="text-xs text-muted mb-2">${rows.length} fila${rows.length === 1 ? '' : 's'}${limit && rows.length > limit ? ` · mostrando ${limit}` : ''}</p>`;

  return `
    <div class="bg-surface border border-hairline rounded-xl shadow-sm p-5">
      ${searchBox}
      ${countLabel}
      <div class="scrollbox rounded-lg border border-hairline/50 overflow-hidden">
        <table class="w-full border-collapse text-left">
          <thead><tr>${theadCells}</tr></thead>
          <tbody>${tbodyRows || `<tr><td class="px-4 py-5 text-sm text-muted text-center" colspan="${cols.length}">Sin resultados.</td></tr>`}</tbody>
        </table>
      </div>
    </div>`;
}

function onTableSearch(tableId, value) {
  const st = tableState[tableId] || (tableState[tableId] = { sortLabel: null, sortDir: 'asc', search: '' });
  st.search = value;
  rerenderCurrentSection({ focusId: `search-${tableId}` });
}
function onTableSort(tableId, label) {
  const st = tableState[tableId] || (tableState[tableId] = { sortLabel: null, sortDir: 'asc', search: '' });
  if (st.sortLabel === label) st.sortDir = st.sortDir === 'asc' ? 'desc' : 'asc';
  else { st.sortLabel = label; st.sortDir = 'asc'; }
  rerenderCurrentSection();
}
function onTabChange(section, tabId) {
  tabState[section] = tabId;
  rerenderCurrentSection();
}

function rerenderCurrentSection(opts = {}) {
  renderSection(currentSection);
  if (opts.focusId) {
    const el = document.querySelector(`[data-focus-id="${opts.focusId}"]`);
    if (el) {
      el.focus();
      const v = el.value;
      el.selectionStart = el.selectionEnd = v.length;
    }
  }
}

/* ============ TABLAS DE POSICIONES (FORMATO 0.00 Y 0.00%) ============ */
function renderStandingsTable(limit) {
  const data = sheet('baseDatosE');
  if (data.error) return renderErrorCard(`BASE DATOS E: ${data.error}`);
  if (!data.rows.length) return renderEmptyCard('Sin datos para la tabla de posiciones.');

  const colEquipo = findColumnLabel(data.cols, ['EQUIPO']);
  const colRes = findColumnLabel(data.cols, ['RESULTADO']);
  const colPts = findColumnLabel(data.cols, ['PTS']);
  const colPtsOpp = findColumnLabel(data.cols, ['PTSopp', 'PTSOPP', 'PUNTOS EN CONTRA', 'PTSC']);

  const stats = {};
  
  data.rows.forEach(r => {
    const equipo = r.formatted[colEquipo];
    if (!equipo || isEquipoTipo(r)) return; 

    if (!stats[equipo]) {
      stats[equipo] = { pg: 0, pp: 0, pj: 0, ptsF: 0, ptsC: 0 };
    }

    const res = normalizeText(r.formatted[colRes]);
    const pts = toNumber(r.values[colPts]) || 0;
    const ptsOpp = toNumber(r.values[colPtsOpp]) || 0;

    stats[equipo].pj += 1;
    if (res.includes('GANADO')) stats[equipo].pg += 1;
    else if (res.includes('PERDIDO')) stats[equipo].pp += 1;
    
    stats[equipo].ptsF += pts;
    stats[equipo].ptsC += ptsOpp;
  });

  let processedRows = Object.keys(stats).map(key => {
    const s = stats[key];
    const pct = s.pj > 0 ? (s.pg / s.pj) : 0;
    return {
      nombre: key,
      pj: s.pj,
      pg: s.pg,
      pp: s.pp,
      pct: pct,
      dif: (s.ptsF - s.ptsC),
      avgPtsF: s.pj > 0 ? (s.ptsF / s.pj) : 0,
      avgPtsC: s.pj > 0 ? (s.ptsC / s.pj) : 0
    };
  });

  processedRows.sort((a, b) => b.pct - a.pct);
  if (limit) processedRows = processedRows.slice(0, limit);

  const thClass = "px-4 py-3 text-left text-[11px] uppercase tracking-wider text-muted whitespace-nowrap font-display font-semibold border-b border-hairline bg-surface2/50 backdrop-blur";
  const cellClass = "px-4 py-3 whitespace-nowrap text-sm border-b border-hairline/40 text-ink/90 font-mono tabular-nums";

  const tbody = processedRows.map((row, i) => {
    const pos = i + 1;
    let borderClass = '!border-l-4'; 
    let colorClass = '';
    
    if (pos <= 8) colorClass = '!border-green-500';
    else if (pos <= 10) colorClass = '!border-yellow-500';
    else colorClass = '!border-red-500';

    return `<tr class="hover:bg-surface2/40 transition-colors cursor-default">
      <td class="${cellClass} ${borderClass} ${colorClass} text-ink font-bold">${pos}</td>
      <td class="${cellClass.replace('font-mono tabular-nums', 'font-body font-medium')} text-ink">${escapeHtml(cleanName(row.nombre))}</td>
      <td class="${cellClass}">${row.pj}</td>
      <td class="${cellClass}">${row.pg}</td>
      <td class="${row.pp > 0 ? cellClass + ' text-red-400' : cellClass}">${row.pp}</td>
      <td class="${cellClass}">${(row.pct * 100).toFixed(2)}%</td>
      <td class="${cellClass}">${row.dif > 0 ? '+' : ''}${row.dif}</td>
      <td class="${cellClass}">${row.avgPtsF.toFixed(2)}</td>
      <td class="${cellClass}">${row.avgPtsC.toFixed(2)}</td>
    </tr>`;
  }).join('');

  return `
    <div class="bg-surface border border-hairline rounded-xl shadow-sm p-5">
      <div class="scrollbox rounded-lg border border-hairline/50 overflow-hidden">
        <table class="w-full border-collapse text-left">
          <thead>
            <tr>
              ${['Pos', 'Equipo', 'PJ', 'PG', 'PP', 'PCT%', 'Dif', 'PTS+/P', 'PTS-/P'].map(h => `<th class="${thClass}">${h}</th>`).join('')}
            </tr>
          </thead>
          <tbody>${tbody || `<tr><td colspan="9" class="text-center text-muted p-4">Sin resultados</td></tr>`}</tbody>
        </table>
      </div>
    </div>
  `;
}

/* ============ SECCIÓN: 4 FACTORES ============ */
function detectNumericColumns(data, nameCol) {
  return data.cols.filter((c) => {
    if (nameCol && c.label === nameCol) return false;
    const vals = data.rows.map((r) => r.values[c.label]);
    if (!vals.length) return false;
    const numCount = vals.filter((v) => toNumber(v) !== null).length;
    return numCount / vals.length >= 0.6;
  }).map((c) => c.label);
}

function buildFactores() {
  const tabs = [
    { id: 'partido', label: 'Partido a Partido' },
    { id: 'promedios', label: 'Promedios' },
    { id: 'acumulado', label: 'Acumulado' },
  ];
  const keyMap = { partido: '4factores', promedios: 'promedios4f', acumulado: 'acumulado4f' };
  const active = tabState.factores;
  const key = keyMap[active];
  const data = sheet(key);
  const tabsHtml = `<div class="flex flex-wrap gap-2">${buildTabs('factores', tabs)}</div>`;

  if (data.error) return `<section class="space-y-4">${tabsHtml}${renderErrorCard(`${key}: ${data.error}`)}</section>`;
  if (!data.rows.length) return `<section class="space-y-4">${tabsHtml}${renderEmptyCard('No hay datos en esta hoja.')}</section>`;

  const nameCol = findColumnLabel(data.cols, ['EQUIPO', 'NOMBRE', 'JUGADOR', 'RIVAL', 'TEAM']);
  const factorCols = detectNumericColumns(data, nameCol);

  if (!nameCol || factorCols.length < 2) {
    return `<section class="space-y-4">${tabsHtml}
      ${renderEmptyCard('No se detectaron suficientes columnas numéricas para graficar. Se muestra la tabla completa.')}
      ${renderTable(`factores-${active}`, key)}
    </section>`;
  }

  const selKey = `factores-${active}`;
  if (!factorSelection[selKey]) {
    factorSelection[selKey] = new Set(data.rows.slice(0, Math.min(4, data.rows.length)).map((r) => r.formatted[nameCol]));
  }
  const selection = factorSelection[selKey];

  const checkboxes = data.rows.map((r) => {
    const label = r.formatted[nameCol];
    const checked = selection.has(label);
    return `
      <label class="flex items-center gap-2 text-sm px-3 py-2 rounded-md border ${checked ? 'border-accent text-ink' : 'border-hairline text-muted'} cursor-pointer">
        <input type="checkbox" ${checked ? 'checked' : ''} onchange="onFactorToggle('${escapeAttr(selKey)}','${escapeAttr(label)}', this.checked)" class="accent-orange-500" />
        ${escapeHtml(label)}
      </label>`;
  }).join('');

  return `
    <section class="space-y-4">
      ${tabsHtml}
      <div class="card rounded-lg p-5">
        <p class="font-display uppercase text-sm tracking-wide text-muted mb-3">Seleccioná hasta 4 para comparar</p>
        <div class="flex flex-wrap gap-2">${checkboxes}</div>
      </div>
      <div class="card rounded-lg p-5">
        <div class="chart-box is-md">
          <canvas id="factoresChart"></canvas>
        </div>
      </div>
      <div>
        <h2 class="font-display uppercase tracking-wide text-sm text-muted mb-3">Detalle</h2>
        ${renderTable(`factores-${active}`, key)}
      </div>
    </section>`;
}

function onFactorToggle(selKey, label, checked) {
  const set = factorSelection[selKey] || (factorSelection[selKey] = new Set());
  if (checked) {
    if (set.size >= 4) {
      alert('Podés comparar hasta 4 elementos a la vez. Desmarcá uno para agregar otro.');
      rerenderCurrentSection();
      return;
    }
    set.add(label);
  } else {
    set.delete(label);
  }
  rerenderCurrentSection();
}

/* Recibe [{name, x, y}] desde SGADD. Antes leia la hoja por su cuenta. */
function drawOrtgDrtgChart(datos) {
  const canvas = document.getElementById('ortgDrtgChart');
  if (!canvas || typeof Chart === 'undefined') return;

  const chartData = (datos || []).filter(d => d && d.x !== null && d.y !== null);
  if (!chartData.length) return;

  const avgX = chartData.reduce((a, d) => a + d.x, 0) / chartData.length;
  const avgY = chartData.reduce((a, d) => a + d.y, 0) / chartData.length;

  /* Margen extra en los ejes: los logos y los nombres se dibujan FUERA del punto,
     asi que sin esto los equipos de los bordes quedan cortados. */
  const xs = chartData.map(d => d.x), ys = chartData.map(d => d.y);
  const rangoX = (Math.max.apply(null, xs) - Math.min.apply(null, xs)) || 10;
  const rangoY = (Math.max.apply(null, ys) - Math.min.apply(null, ys)) || 10;
  const escala = {
    xMin: Math.min.apply(null, xs) - rangoX * 0.14,
    xMax: Math.max.apply(null, xs) + rangoX * 0.14,
    yMin: Math.min.apply(null, ys) - rangoY * 0.16,
    yMax: Math.max.apply(null, ys) + rangoY * 0.20,
  };

  /* Eje Y invertido: DRTG bajo = buena defensa = arriba.
     De ahi salen los cuatro cuadrantes. */
  function cuadrante(d) {
    const ofFuerte = d.x >= avgX;
    const defFuerte = d.y <= avgY;
    if (ofFuerte && defFuerte) return CUADRANTES.elite;
    if (!ofFuerte && defFuerte) return CUADRANTES.def;
    if (ofFuerte && !defFuerte) return CUADRANTES.of;
    return CUADRANTES.bajo;
  }

  if (chartInstances.ortgDrtg) chartInstances.ortgDrtg.destroy();
  equipoDestacado = -1;

  /* El tamaño de logo, tipografia y carteles se calcula sobre el ancho REAL
     del area de dibujo, no sobre el viewport: el mismo grafico puede estar
     en una card angosta de escritorio o a pantalla completa en un telefono. */
  function ui(chart) {
    const w = chart.chartArea ? (chart.chartArea.right - chart.chartArea.left) : 600;
    if (w < 360) return { logo: 20, nombre: 8, cartel: 9, corte: 8, mostrarNombres: false };
    if (w < 520) return { logo: 24, nombre: 9, cartel: 10, corte: 10, mostrarNombres: true };
    if (w < 760) return { logo: 27, nombre: 9, cartel: 10, corte: 11, mostrarNombres: true };
    return { logo: 30, nombre: 10, cartel: 11, corte: 13, mostrarNombres: true };
  }
  const angosto = BP.movil;

  chartInstances.ortgDrtg = new Chart(canvas.getContext('2d'), {
    type: 'scatter',
    data: {
      datasets: [{
        label: 'Equipos',
        data: chartData,
        backgroundColor: 'transparent',
        borderColor: 'transparent',
        pointRadius: angosto() ? 13 : 18,
        pointHoverRadius: angosto() ? 16 : 22,
      }]
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      layout: { padding: { top: angosto() ? 12 : 18, right: angosto() ? 10 : 18, bottom: 4, left: 4 } },
      scales: {
        x: {
          min: escala.xMin, max: escala.xMax,
          title: { display: true, text: angosto() ? 'ORTG →' : 'ORTG  →  ataque', color: '#9CA3AF', font: { family: 'Barlow', size: 11 } },
          grid: { color: 'rgba(40,40,40,0.65)' },
          ticks: { color: '#6b7280', font: { family: 'DM Mono', size: 10 }, maxTicksLimit: angosto() ? 5 : 10 },
        },
        y: {
          reverse: true,
          min: escala.yMin, max: escala.yMax,
          title: { display: true, text: angosto() ? 'DRTG ↑' : 'DRTG  ↑  defensa', color: '#9CA3AF', font: { family: 'Barlow', size: 11 } },
          grid: { color: 'rgba(40,40,40,0.65)' },
          ticks: { color: '#6b7280', font: { family: 'DM Mono', size: 10 }, maxTicksLimit: angosto() ? 6 : 10 },
        }
      },
      interaction: { mode: 'nearest', intersect: false, axis: 'xy' },
      onHover: (evt, elementos) => {
        const idx = (elementos && elementos.length) ? elementos[0].index : -1;
        if (idx !== equipoDestacado) { idx >= 0 ? highlightPoint(idx) : removeHighlight(); }
      },
      plugins: {
        legend: { display: false },
        tooltip: {
          displayColors: false,
          backgroundColor: '#0B1121',
          borderColor: '#374151',
          borderWidth: 1,
          padding: 10,
          titleFont: { family: '"Barlow Condensed"', size: 14 },
          bodyFont: { family: '"DM Mono"', size: 11 },
          callbacks: {
            title: (items) => items[0].raw.name.toUpperCase(),
            label: (ctx) => [
              'ORTG  ' + ctx.raw.x.toFixed(1) + '   (media ' + avgX.toFixed(1) + ')',
              'DRTG  ' + ctx.raw.y.toFixed(1) + '   (media ' + avgY.toFixed(1) + ')',
              cuadrante(ctx.raw).label,
            ],
          }
        }
      }
    },
    plugins: [
      /* --- 1. Cuadrantes: tintes, medias punteadas y carteles --- */
      {
        id: 'quadrant-plugin',
        beforeDatasetsDraw: (chart) => {
          const ctx = chart.ctx;
          const area = chart.chartArea;
          const ex = chart.scales.x.getPixelForValue(avgX);
          const ey = chart.scales.y.getPixelForValue(avgY);

          ctx.save();

          // Tinte suavisimo por cuadrante, solo para orientar la lectura.
          const tintes = [
            [area.left, area.top, ex - area.left, ey - area.top, CUADRANTES.def.color],
            [ex, area.top, area.right - ex, ey - area.top, CUADRANTES.elite.color],
            [area.left, ey, ex - area.left, area.bottom - ey, CUADRANTES.bajo.color],
            [ex, ey, area.right - ex, area.bottom - ey, CUADRANTES.of.color],
          ];
          ctx.globalAlpha = 0.035;
          tintes.forEach(([x, y, w, h, color]) => { ctx.fillStyle = color; ctx.fillRect(x, y, w, h); });
          ctx.globalAlpha = 1;

          // Lineas de media
          ctx.setLineDash([5, 5]);
          ctx.lineWidth = 1;
          ctx.strokeStyle = 'rgba(156, 163, 175, 0.55)';
          ctx.beginPath();
          ctx.moveTo(ex, area.top); ctx.lineTo(ex, area.bottom);
          ctx.moveTo(area.left, ey); ctx.lineTo(area.right, ey);
          ctx.stroke();
          ctx.setLineDash([]);

          // Valor de cada media, pegado a la linea
          const U = ui(chart);
          ctx.font = '500 ' + (U.cartel - 1) + 'px "DM Mono", monospace';
          ctx.fillStyle = 'rgba(156, 163, 175, 0.9)';
          ctx.textAlign = 'left';
          ctx.textBaseline = 'top';
          ctx.fillText(avgX.toFixed(1), ex + 5, area.top + 4);
          ctx.textAlign = 'right';
          ctx.fillText(avgY.toFixed(1), area.right - 5, ey + 4);

          // Carteles de cuadrante en las esquinas
          const P = U.cartel;
          const corto = U.cartel <= 10;
          const carteles = [
            [CUADRANTES.def,   area.left + P,  area.top + P,    'left',  'top'],
            [CUADRANTES.elite, area.right - P, area.top + P,    'right', 'top'],
            [CUADRANTES.bajo,  area.left + P,  area.bottom - P, 'left',  'bottom'],
            [CUADRANTES.of,    area.right - P, area.bottom - P, 'right', 'bottom'],
          ];
          ctx.font = '700 ' + U.cartel + 'px "Barlow Condensed", sans-serif';
          carteles.forEach(([q, x, y, ta, tb]) => {
            ctx.textAlign = ta;
            ctx.textBaseline = tb;
            ctx.fillStyle = q.color;
            ctx.globalAlpha = 0.85;
            ctx.fillText(corto ? q.corto : q.label, x, y);
          });

          ctx.restore();
        }
      },
      /* --- 2. Logos + nombre arriba --- */
      {
        id: 'team-logos-plugin',
        afterDatasetsDraw: (chart) => {
          const ctx = chart.ctx;
          const meta = chart.getDatasetMeta(0);
          if (!meta || meta.hidden) return;

          const puntos = chart.data.datasets[0].data;
          const U = ui(chart);
          const BASE = U.logo;
          const ocupados = [];  // cajas de texto ya dibujadas, para no pisarlas

          meta.data.forEach((point, index) => {
            if (!point || point.skip) return;
            const item = puntos[index];
            if (!item) return;

            const q = cuadrante(item);
            const img = LOGOS.getImage(item.name);
            const activo = (index === equipoDestacado);
            const hayFoco = (equipoDestacado >= 0);
            const x = point.x, y = point.y;
            const r = (activo ? BASE * 0.62 : BASE / 2);

            ctx.save();
            ctx.globalAlpha = (hayFoco && !activo) ? 0.25 : 1;

            if (activo) {
              ctx.beginPath();
              ctx.arc(x, y, r + 6, 0, Math.PI * 2);
              ctx.fillStyle = 'rgba(247, 148, 30, 0.16)';
              ctx.fill();
            }

            // Disco de fondo: los logos con transparencia necesitan base opaca.
            ctx.beginPath();
            ctx.arc(x, y, r, 0, Math.PI * 2);
            ctx.fillStyle = '#0B1121';
            ctx.fill();

            ctx.save();
            if (img) {
              ctx.beginPath();
              ctx.arc(x, y, r - 1, 0, Math.PI * 2);
              ctx.clip();
              ctx.drawImage(img, x - r + 1, y - r + 1, (r - 1) * 2, (r - 1) * 2);
            } else {
              ctx.fillStyle = '#F9FAFB';
              ctx.font = '600 ' + Math.round(r * 0.72) + 'px Barlow, sans-serif';
              ctx.textAlign = 'center';
              ctx.textBaseline = 'middle';
              ctx.fillText(iniciales(item.name), x, y + 0.5);
            }
            ctx.restore();

            // Anillo del color del cuadrante. Naranja grueso si esta activo.
            ctx.beginPath();
            ctx.arc(x, y, r, 0, Math.PI * 2);
            ctx.lineWidth = activo ? 3 : 2;
            ctx.strokeStyle = activo ? '#f7941e' : q.color;
            if (activo) { ctx.shadowColor = 'rgba(247, 148, 30, 0.9)'; ctx.shadowBlur = 12; }
            ctx.stroke();
            ctx.shadowBlur = 0;

            // Nombre del equipo (reemplaza la lista lateral).
            // En pantallas muy angostas solo se rotula el equipo tocado.
            if (!U.mostrarNombres && !activo) { ctx.restore(); return; }
            const etiqueta = activo ? item.name.toUpperCase() : recortar(item.name.toUpperCase(), U.corte);
            ctx.font = (activo ? ('700 ' + (U.nombre + 2) + 'px ') : ('600 ' + U.nombre + 'px ')) + '"Barlow Condensed", sans-serif';
            ctx.textAlign = 'center';

            /* Evasion de colisiones: probamos arriba y, si ese hueco ya esta
               tomado por otra etiqueta, la mandamos abajo. Con dos intentos
               alcanza para densidades normales de liga. */
            const ancho = ctx.measureText(etiqueta).width;
            const alto = U.nombre + 2;
            const arriba = y - r - 5;
            const abajo = y + r + 5 + alto;
            let ty = arriba, base = 'bottom';

            const choca = (cy) => ocupados.some(c =>
              Math.abs(c.x - x) < (c.w + ancho) / 2 + 4 && Math.abs(c.y - cy) < alto + 2);

            if (choca(arriba)) {
              if (!choca(abajo)) { ty = abajo; base = 'alphabetic'; }
            }
            if (!activo) ocupados.push({ x: x, y: ty, w: ancho });
            ctx.textBaseline = base;

            // Contorno oscuro para que el texto se lea sobre la grilla.
            ctx.lineWidth = 3;
            ctx.strokeStyle = '#0B1121';
            ctx.lineJoin = 'round';
            ctx.strokeText(etiqueta, x, ty);
            ctx.fillStyle = activo ? '#f7941e' : '#cbd5e1';
            ctx.fillText(etiqueta, x, ty);

            ctx.restore();
          });
        }
      }
    ]
  });

  LOGOS.resolver(chartData.map(d => d.name)).then((res) => {
    const c = chartInstances.ortgDrtg;
    if (c) c.update('none');
    renderPanelLogosFaltantes(res.faltantes);
  });
}

/* Definicion de los cuatro cuadrantes. Eje Y invertido: DRTG bajo = arriba. */
const CUADRANTES = {
  elite: { label: 'ELITE',      corto: 'ELITE', color: '#22c55e' },  // + ataque, + defensa
  def:   { label: 'DEF FUERTE', corto: 'DEF',   color: '#60a5fa' },  // - ataque, + defensa
  of:    { label: 'OF FUERTE',  corto: 'OF',    color: '#f7941e' },  // + ataque, - defensa
  bajo:  { label: 'BAJO',       corto: 'BAJO',  color: '#ef4444' },  // - ataque, - defensa
};

function recortar(txt, max) {
  const s = String(txt || '');
  return s.length > max ? s.slice(0, max - 1) + '…' : s;
}
function renderPanelLogosFaltantes(faltantes) {
  const previo = document.getElementById('logosFaltantesPanel');
  if (previo) previo.remove();
  if (!faltantes || !faltantes.length) return;

  const filas = faltantes.map(n =>
    `<li class="flex items-baseline justify-between gap-3 py-1 border-b border-hairline/50 last:border-0">
       <span class="text-muted truncate">${escapeHtml(n)}</span>
       <code class="font-mono text-accent text-[11px] shrink-0">${LOGOS.slug(n)}.png</code>
     </li>`).join('');

  const lista = faltantes.map(n => LOGOS.slug(n) + '.png').join('\n');

  const div = document.createElement('div');
  div.id = 'logosFaltantesPanel';
  div.className = 'fixed bottom-4 right-4 z-40 w-[330px] max-w-[92vw] card rounded-lg shadow-2xl p-4';
  div.innerHTML = `
    <div class="flex items-start justify-between gap-2 mb-2">
      <h4 class="font-display uppercase tracking-wider text-sm text-accent">
        Faltan ${faltantes.length} logo${faltantes.length > 1 ? 's' : ''}
      </h4>
      <button onclick="document.getElementById('logosFaltantesPanel').remove()"
              class="text-muted hover:text-ink text-lg leading-none px-1" title="Cerrar">&times;</button>
    </div>
    <p class="text-[11px] text-muted mb-3 leading-snug">
      Subí estos archivos a la carpeta <code class="text-ink">logos/</code> del repositorio.
      El nombre tiene que ser este; la extensión puede ser
      <code class="text-ink">.png .jpg .webp .avif .svg</code>:
    </p>
    <ul class="text-xs max-h-56 overflow-y-auto mb-3">${filas}</ul>
    <button id="copiarListaLogos"
            class="w-full text-xs font-semibold uppercase tracking-wider bg-accent text-base rounded py-2 hover:bg-accentdeep transition-colors">
      Copiar lista
    </button>`;
  document.body.appendChild(div);

  div.querySelector('#copiarListaLogos').addEventListener('click', (ev) => {
    navigator.clipboard.writeText(lista).then(() => {
      ev.target.textContent = 'Copiado';
      setTimeout(() => { ev.target.textContent = 'Copiar lista'; }, 1500);
    }).catch(() => { ev.target.textContent = 'No se pudo copiar'; });
  });
}

const iniciales = LOGOS.iniciales;

/* ============ SECCIÓN: SCOUTING ============ */
function buildScouting() {
  const tabs = [
    { id: 'jugadores', label: 'Comparar Jugadores' },
    { id: 'equipos', label: 'Comparar Equipos' },
  ];
  const active = tabState.scouting;
  const body = active === 'jugadores'
    ? buildScoutingCompare('promediosJ', ['NOMBRE', 'JUGADOR'], 'scoutingPlayers', 'jugadores')
    : buildScoutingCompare('promediosE', ['EQUIPO', 'NOMBRE', 'RIVAL', 'TEAM'], 'scoutingTeams', 'equipos');
  return `
    <section class="space-y-4">
      <div class="flex flex-wrap gap-2">${buildTabs('scouting', tabs)}</div>
      ${body}
    </section>`;
}

function buildScoutingCompare(sheetKey, nameCandidates, selectionKey, chartSuffix) {
  const data = sheet(sheetKey);
  if (data.error) return renderErrorCard(`${sheetKey}: ${data.error}`);
  if (!data.rows.length) return renderEmptyCard('No hay datos disponibles.');

  const nameCol = findColumnLabel(data.cols, nameCandidates);
  if (!nameCol) return renderEmptyCard('No se encontró una columna de nombre/equipo para comparar.');

  const numericCols = detectNumericColumns(data, nameCol);
  const options = data.rows.map((r) => r.formatted[nameCol]).filter((v) => v !== '' && v !== null && v !== undefined);
  if (!options.length) return renderEmptyCard('No hay filas con nombre para comparar.');

  const sel = factorSelection[selectionKey];
  if (!sel[0] || !options.includes(sel[0])) sel[0] = options[0];
  if (!sel[1] || !options.includes(sel[1])) sel[1] = options[1] ?? options[0];

  const selectA = buildSelect(`compareA-${chartSuffix}`, options, sel[0], `onCompareChange('${selectionKey}', 0, this.value)`);
  const selectB = buildSelect(`compareB-${chartSuffix}`, options, sel[1], `onCompareChange('${selectionKey}', 1, this.value)`);

  const rowA = data.rows.find((r) => r.formatted[nameCol] === sel[0]);
  const rowB = data.rows.find((r) => r.formatted[nameCol] === sel[1]);

  const compareRows = numericCols.length
    ? numericCols.map((col) => {
      const va = rowA ? (rowA.formatted[col] ?? '—') : '—';
      const vb = rowB ? (rowB.formatted[col] ?? '—') : '—';
      const na = rowA ? toNumber(rowA.values[col]) : null;
      const nb = rowB ? toNumber(rowB.values[col]) : null;
      const aWins = na !== null && nb !== null && na > nb;
      const bWins = na !== null && nb !== null && nb > na;
      return `<tr>
        <td class="px-3 py-2 text-sm font-mono tabular-nums ${aWins ? 'text-accent font-semibold' : ''}">${escapeHtml(va)}</td>
        <td class="px-3 py-2 text-xs uppercase tracking-wide text-muted text-center whitespace-nowrap font-display">${escapeHtml(col)}</td>
        <td class="px-3 py-2 text-sm font-mono tabular-nums text-right ${bWins ? 'text-accent font-semibold' : ''}">${escapeHtml(vb)}</td>
      </tr>`;
    }).join('')
    : `<tr><td colspan="3" class="px-3 py-4 text-sm text-muted text-center">No se detectaron columnas numéricas para comparar.</td></tr>`;

  return `
    <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
      <div class="card rounded-lg p-5 space-y-4">
        <div class="grid grid-cols-2 gap-3">
          ${selectA}
          ${selectB}
        </div>
        <div class="scrollbox">
          <table class="w-full">
            <tbody>${compareRows}</tbody>
          </table>
        </div>
      </div>
      <div class="card rounded-lg p-5">
        <div class="chart-box is-sm">
          <canvas id="compareChart-${chartSuffix}"></canvas>
        </div>
      </div>
    </div>`;
}

function onCompareChange(selectionKey, index, value) {
  factorSelection[selectionKey][index] = value;
  rerenderCurrentSection();
}

function drawScoutingCharts() {
  if (typeof Chart === 'undefined') return;
  const suffix = tabState.scouting;
  const sheetKey = suffix === 'jugadores' ? 'promediosJ' : 'promediosE';
  const nameCandidates = suffix === 'jugadores' ? ['NOMBRE', 'JUGADOR'] : ['EQUIPO', 'NOMBRE', 'RIVAL', 'TEAM'];
  const selectionKey = suffix === 'jugadores' ? 'scoutingPlayers' : 'scoutingTeams';
  const data = sheet(sheetKey);
  const canvas = document.getElementById(`compareChart-${suffix}`);
  if (!canvas || data.error || !data.rows.length) return;

  const nameCol = findColumnLabel(data.cols, nameCandidates);
  if (!nameCol) return;
  const numericCols = detectNumericColumns(data, nameCol);
  if (numericCols.length < 2) return;

  const maxByMetric = {};
  numericCols.forEach((col) => {
    const vals = data.rows.map((r) => toNumber(r.values[col])).filter((v) => v !== null);
    maxByMetric[col] = vals.length ? Math.max(...vals, 0.0001) : 1;
  });

  const sel = factorSelection[selectionKey];
  const rowA = data.rows.find((r) => r.formatted[nameCol] === sel[0]);
  const rowB = data.rows.find((r) => r.formatted[nameCol] === sel[1]);
  const rawByLabel = {};
  const datasets = [];

  if (rowA) {
    rawByLabel[sel[0]] = numericCols.map((c) => rowA.formatted[c]);
    datasets.push({
      label: sel[0],
      data: numericCols.map((c) => ((toNumber(rowA.values[c]) ?? 0) / maxByMetric[c]) * 100),
      borderColor: '#f7941e', backgroundColor: '#f7941e33', pointBackgroundColor: '#f7941e', borderWidth: 2,
    });
  }
  if (rowB && sel[1] !== sel[0]) {
    rawByLabel[sel[1]] = numericCols.map((c) => rowB.formatted[c]);
    datasets.push({
      label: sel[1],
      data: numericCols.map((c) => ((toNumber(rowB.values[c]) ?? 0) / maxByMetric[c]) * 100),
      borderColor: '#60a5fa', backgroundColor: '#60a5fa33', pointBackgroundColor: '#60a5fa', borderWidth: 2,
    });
  }
  if (!datasets.length) return;

  const chartKey = `compare-${suffix}`;
  if (chartInstances[chartKey]) chartInstances[chartKey].destroy();
  chartInstances[chartKey] = new Chart(canvas.getContext('2d'), {
    type: 'radar',
    data: { labels: numericCols, datasets },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      scales: {
        r: {
          min: 0, max: 100,
          angleLines: { color: '#282828' },
          grid: { color: '#282828' },
          pointLabels: {
            color: '#f5f4f2',
            font: { family: 'Barlow', size: BP.movil() ? 8 : 11 },
            callback: (l) => (BP.movil() && String(l).length > 12
              ? String(l).replace(/\s+/, '\n').split('\n') : l),
          },
          ticks: { display: false },
        },
      },
      plugins: {
        legend: {
          position: BP.movil() ? 'bottom' : 'top',
          labels: {
            color: '#f5f4f2',
            font: { family: 'Barlow', size: BP.movil() ? 10 : 12 },
            boxWidth: BP.movil() ? 10 : 20,
          },
        },
        tooltip: {
          callbacks: {
            label(ctx) {
              const raw = rawByLabel[ctx.dataset.label];
              const val = raw ? raw[ctx.dataIndex] : ctx.formattedValue;
              return `${ctx.dataset.label}: ${val}`;
            },
          },
        },
      },
    },
  });
}

/* ============ ROUTER ============ */
function renderSection(section) {
  currentSection = section;
  document.querySelectorAll('[data-nav]').forEach((btn) => {
    const isActive = btn.getAttribute('data-nav') === section;
    btn.classList.toggle('active', isActive);
    btn.classList.toggle('bg-surface2', isActive);
    btn.classList.toggle('text-accent', isActive);
  });
  const titles = { principal: 'Principal', equipos: 'Equipos', jugadores: 'Jugadores', factores: '4 Factores', scouting: 'Scouting', diagnostico: 'Diagnóstico' };
  const titleEl = document.getElementById('page-title');
  if (titleEl) titleEl.textContent = titles[section] || '';

  const root = document.getElementById('view-root');
  if (!root) return;
  switch (section) {
    case 'principal': root.innerHTML = buildPrincipal(); break;   // SGADD (js/sgadd-principal.js)
    case 'diagnostico': root.innerHTML = buildDiagnostico(); diagCorrer(); break;
    case 'equipos': root.innerHTML = buildEquipos(); break;   // SGADD (js/sgadd-equipos.js)
    case 'jugadores': root.innerHTML = buildJugadores(); break;
    case 'factores': root.innerHTML = buildFactores(); drawFactoresChart(); break;
    case 'scouting': root.innerHTML = buildScouting(); drawScoutingCharts(); break;
    default: root.innerHTML = '';
  }
}

function navigate(section) {
  if (!VALID_SECTIONS.includes(section)) section = 'principal';
  renderSection(section);
  closeSidebar();
  const root = document.getElementById('view-root');
  if (root) root.scrollTop = 0;
  window.scrollTo(0, 0);
  history.replaceState(null, '', `#${section}`);
}

/* ============ SIDEBAR MÓVIL ============ */
function toggleSidebar() {
  sidebarOpen = !sidebarOpen;
  document.getElementById('sidebar').classList.toggle('open', sidebarOpen);
  document.getElementById('overlay').classList.toggle('hidden', !sidebarOpen);
}
function closeSidebar() {
  sidebarOpen = false;
  document.getElementById('sidebar').classList.remove('open');
  document.getElementById('overlay').classList.add('hidden');
}

/* ============ ESTADO DE CARGA / ERRORES ============ */
function renderStatusBanner(errors) {
  const holder = document.getElementById('status-banner-holder');
  if (!holder) return;
  if (!errors || !errors.length) {
    holder.innerHTML = `<span class="flex items-center gap-2 text-xs text-muted"><span class="w-2 h-2 rounded-full bg-green-500"></span>Datos actualizados</span>`;
    return;
  }
  holder.innerHTML = `
    <button onclick="toggleErrorDetail()" class="flex items-center gap-2 text-xs text-amber-400 hover:text-amber-300">
      <span class="w-2 h-2 rounded-full bg-amber-500"></span>${errors.length} hoja${errors.length === 1 ? '' : 's'} con errores
    </button>`;
}
function toggleErrorDetail() {
  if (!lastErrors.length) return;
  const list = lastErrors.map((e) => `• ${e.name}: ${e.error}`).join('\n');
  alert(`No se pudieron cargar estas hojas:\n\n${list}`);
}
function updateLastUpdatedLabel() {
  const el = document.getElementById('last-updated');
  if (el) el.textContent = lastUpdated ? `Actualizado ${lastUpdated.toLocaleTimeString('es-AR')}` : '';
}

async function refreshData() {
  const label = document.getElementById('refresh-label');
  if (label) label.textContent = 'Actualizando…';
  // Datos y logos viajan en paralelo. Los logos tienen techo de 12s:
  // si Drive tarda, el dashboard igual arranca y los logos entran despues via onReady.
  const errors = await fetchAllData();
  lastErrors = errors;
  renderStatusBanner(errors);
  updateLastUpdatedLabel();
  if (label) label.textContent = 'Actualizar datos';
  renderSection(currentSection);
}

/*
  El resaltado NO usa setActiveElements: como el dataset tiene background y border
  transparentes (los puntos los dibuja nuestro plugin), Chart.js no tenia nada que
  pintar en hover. Manejamos el foco nosotros y forzamos un redraw sin animacion.
*/
function highlightPoint(index) {
  if (equipoDestacado === index) return;
  equipoDestacado = index;
  const chart = chartInstances.ortgDrtg;
  if (chart) chart.update('none');
}

function removeHighlight() {
  if (equipoDestacado === -1) return;
  equipoDestacado = -1;
  const chart = chartInstances.ortgDrtg;
  if (chart) chart.update('none');
}

/* ============ INICIALIZACIÓN ============ */
async function init() {
  const initial = (window.location.hash || '#principal').replace('#', '');
  currentSection = VALID_SECTIONS.includes(initial) ? initial : 'principal';

  const errors = await fetchAllData();
  lastErrors = errors;

  document.getElementById('loader').classList.add('hidden');
  document.getElementById('app').classList.remove('hidden');

  renderStatusBanner(errors);
  updateLastUpdatedLabel();
  renderSection(currentSection);

  window.addEventListener('hashchange', () => {
    const h = window.location.hash || '#principal';
    // Las rutas de SGADD son #/planilla/fase/seccion/... y las maneja su modulo.
    if (h.indexOf('#/') === 0) {
      const r = SGADD.Ruta.parse(h);
      if (r.seccion === 'equipos') {
        if (currentSection !== 'equipos') navigate('equipos');
        else { equiposLeerRuta(); equiposPintar(); }
      } else if (r.seccion === 'principal' && currentSection !== 'principal') {
        navigate('principal');
      }
      return;
    }
    const sec = h.replace('#', '');
    if (VALID_SECTIONS.includes(sec)) navigate(sec);
  });

  /* Rotar el telefono cambia de breakpoint, pero Chart.js ya congelo las
     opciones. Re-renderizamos SOLO al cruzar un corte, no en cada pixel. */
  let bucketPrevio = BP.bucket();
  let tResize;
  window.addEventListener('resize', () => {
    clearTimeout(tResize);
    tResize = setTimeout(() => {
      const b = BP.bucket();
      if (b !== bucketPrevio) {
        bucketPrevio = b;
        if (b > 0) closeSidebar();
        renderSection(currentSection);
      }
    }, 220);
  });

  /* En touch no existe el mouseleave: sin esto el equipo resaltado queda pegado. */
  document.addEventListener('touchstart', (e) => {
    if (equipoDestacado >= 0 && !(e.target && e.target.id === 'ortgDrtgChart')) removeHighlight();
  }, { passive: true });

  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') { closeSidebar(); removeHighlight(); }
  });
}

/* Un unico punto de arranque. Los logos se resuelven despues, cuando ya
   conocemos los nombres de los equipos que vinieron de la planilla. */
if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', init);
} else {
  init();
}
</script>
