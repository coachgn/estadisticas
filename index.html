function leaderCardHTML(title, filas) {
  return `
    <div class="card bg-surface border border-hairline rounded-lg shadow-sm p-5 transition hover:border-hairline/80">
      <p class="font-display uppercase text-sm tracking-wide text-muted mb-2">${escapeHtml(title)}</p>
      <ul>${filas.map((f, i) => itemLeaderHTML(i, f.nombre, f.equipo, f.valor)).join('')}</ul>
    </div>`;
}

/**
 * Top 5 de una métrica de jugador.
 *
 * SALE DEL ÍNDICE, con la hoja de respaldo. `PROMEDIOS J` trae una fila
 * por (jugador, torneo, fase): en el tramo TOTAL devuelve 400 filas donde
 * hay 218 jugadores, así que el mismo tipo aparecía dos veces y el valor
 * mostrado era el de UN torneo, no el consolidado.
 *
 * El índice ya viene con un registro por jugador y con los promedios
 * recalculados sobre sus partidos.
 */
function buildLeaderCard(title, promJ, statCandidates) {
  const idxL = (typeof SGADD_APP !== 'undefined' && SGADD_APP.estado)
    ? SGADD_APP.estado.idx : null;
  if (idxL) {
    const met = statCandidates[0];
    const top = idxL.liga.jugadores
      .map(j => ({ nombre: j.NOMBRES, equipo: j.EQUIPO, v: j[met] }))
      .filter(x => typeof x.v === 'number' && isFinite(x.v))
      .sort((a, b) => b.v - a.v)
      .slice(0, 5);
    if (top.length) return leaderCardHTML(title, top.map(x => ({
      nombre: cleanName(x.nombre), equipo: x.equipo,
      valor: SGADD.formatear(met, x.v),
    })));
  }
  if (promJ.error) return renderErrorCard(`PROMEDIOS J: ${promJ.error}`);
  const nameCol = findColumnLabel(promJ.cols, ['NOMBRE', 'JUGADOR']);
  const teamCol = findColumnLabel(promJ.cols, ['EQUIPO', 'TEAM']);
  const statCol = findColumnLabel(promJ.cols, statCandidates);
  if (!statCol) {
    return `<div class="card bg-surface rounded-lg p-5 border border-hairline shadow-sm">
      <p class="font-display uppercase text-sm tracking-wide text-muted mb-2">${escapeHtml(title)}</p>
      <p class="text-sm text-muted">No se encontró la columna.</p>
    </div>`;
  }
  
  const validRows = promJ.rows.filter((r) => toNumber(r.values[statCol]) !== null && !isEquipoTipo(r));
  const sorted = sortRows(validRows, statCol, 'desc').slice(0, 5);
  
  const items = sorted.map((r, i) => itemLeaderHTML(i,
    nameCol ? cleanName(r.formatted[nameCol]) : '—',
    teamCol ? r.formatted[teamCol] : '',
    r.formatted[statCol])).join('');
    
  return `
    <div class="card bg-surface border border-hairline rounded-lg shadow-sm p-5 transition hover:border-hairline/80">
      <p class="font-display uppercase text-sm tracking-wide text-muted mb-2">${escapeHtml(title)}</p>
      <ol>${items || '<p class="text-sm text-muted">Sin datos suficientes.</p>'}</ol>
    </div>`;
}

/* ============ TABLA DE POSICIONES ============

   Vivia aca en DOS funciones —`renderStandingsTable` y
   `renderFullStandingsTable`— que calculaban lo mismo desde la misma hoja
   con agregaciones distintas: una sumaba PJ/PG/PP y la otra ademas partia
   el record en local y visitante, cada una con su propio recorrido sobre
   `Base Datos E`. Solo la primera pintaba zonas, y las pintaba
   HARDCODEADAS: `pos <= 8` verde, `<= 10` amarillo, resto rojo. Ocho a
   playoffs para todos los clientes, todas las categorias y todos los
   torneos.

   Las dos se colapsaron en `sgadd-clasificacion.js`, que lee del INDICE
   —ya scopeado al tramo, y con el record y el split ya calculados— y saca
   los cortes de `sgadd-config.js`. Aca queda solo el resumen de la
   pantalla de entrada, que es el MISMO componente con menos columnas.
   ============================================================ */
function renderClasificacionResumen() {
  const idx = (typeof SGADD_APP !== 'undefined' && SGADD_APP.estado)
    ? SGADD_APP.estado.idx : null;
  /* Principal se pinta antes de que el indice este armado: `init()`
     dispara `SGADD_APP.cargar()` sin await. No es un error, es que llega
     unos milisegundos despues — y cuando llega, `onCambio` repinta este
     mismo contenedor. Por eso se muestra ausente y no un cuadro vacio. */
  if (!idx) return renderEmptyCard('Cargando la tabla de posiciones…');
  if (typeof clasifTablaHTML !== 'function') return '';

  const vig = clasifFormatoVigente();
  const total = idx.lista().length;
  return `
    <div class="bg-surface border border-hairline rounded-xl shadow-sm p-5">
      ${clasifLeyendaHTML(vig.formato, total)}
      <div class="mt-3">${clasifTablaHTML(idx, { columnas: 'resumida',
        formato: vig.formato, orden: (vig.config && vig.config.ordenTabla) || null })}</div>
      <p class="text-[11px] text-muted mt-3">
        <button onclick="navigate('clasificacion')" class="text-accent hover:underline">
          Ver la tabla completa \u2192</button>
        con el desglose de local y visitante.
      </p>
    </div>`;
}
function buildPrincipal() {
  /* El índice, arriba de todo: LO USAN los KPIs, el mejor ataque, los
     líderes y el scatter. Estaba declarado a mitad de la función y con
     `const` eso es zona muerta para todo lo que va antes. */
  const idxLiga = (typeof SGADD_APP !== 'undefined' && SGADD_APP.estado && SGADD_APP.estado.idx)
    ? SGADD_APP.estado.idx.liga : null;
  const promE = sheet('promediosE');
  const baseE = sheet('baseDatosE');
  const promJ = sheet('promediosJ');

  const iconGrid = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><line x1="3" y1="9" x2="21" y2="9"></line><line x1="3" y1="15" x2="21" y2="15"></line><line x1="9" y1="3" x2="9" y2="21"></line><line x1="15" y1="3" x2="15" y2="21"></line></svg>`;
  const iconUser = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>`;
  const iconGlobe = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><line x1="2" y1="12" x2="22" y2="12"></line><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"></path></svg>`;
  const iconZap = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"></polygon></svg>`;

  /* MEJOR ATAQUE sale del ÍNDICE por el mismo motivo que el scatter.

     `PROMEDIOS E` trae una fila por (equipo, torneo, fase), así que en el
     tramo TOTAL el máximo se tomaba sobre los valores de UN torneo y se
     mostraba como si fueran los del total. Medido en DEPORTIVO: decía
     75,64 —el promedio de Ida de DLP— cuando su total consolidado es
     74,23. El número existía, pero no era el de la vista abierta. */
  let kpi1;
  if (idxLiga) {
    const mejor = (typeof SGADD_APP !== 'undefined' && SGADD_APP.estado.idx)
      ? SGADD_APP.estado.idx.lista()
          .map(e => ({ n: e.nombre, v: (e.promedios && typeof e.promedios['PTS'] === 'number') ? e.promedios['PTS'] : null }))
          .filter(x => x.v !== null)
          .sort((a, b) => b.v - a.v)[0]
      : null;
    kpi1 = mejor
      ? renderModernCard('Mejor Ataque', SGADD.formatear('PTS', mejor.v), 'PTS/P', iconZap)
      : renderEmptyCard('Sin valores numéricos');
  } else if (promE.error) {
    kpi1 = renderErrorCard(`PROMEDIOS E: ${promE.error}`);
  } else if (!promE.rows.length) {
    kpi1 = renderEmptyCard('Sin datos');
  } else {
    const ptsCol = findColumnLabel(promE.cols, ['PTS', 'PUNTOS', 'PPP']);
    if (ptsCol) {
      const validRows = promE.rows.filter((r) => toNumber(r.values[ptsCol]) !== null && !isEquipoTipo(r));
      const candidates = sortRows(validRows, ptsCol, 'desc');
      const top = candidates[0];
      kpi1 = top
        ? renderModernCard('Mejor Ataque', top.formatted[ptsCol], 'PTS/P', iconZap)
        : renderEmptyCard('Sin valores numéricos');
    } else {
      kpi1 = renderEmptyCard('Sin columna de puntos');
    }
  }

  const validEquipos = promE.rows.filter(r => !isEquipoTipo(r));
  /* El KPI de jugadores sale del ÍNDICE, no de `Base Datos J`.

     Esa hoja es la más pesada del libro —106.790 celdas en DEPORTIVO, el
     68% del volumen total— y acá se usaba para UNA sola cosa: contar
     nombres distintos. El índice ya tiene esa cuenta hecha, scopeada al
     tramo y sin la fila TIPO, así que pedirla de nuevo era bajar dos megas
     para un número que estaba a mano.

     Si el índice todavía no está armado se cae a la hoja, que es el
     comportamiento de antes: Principal puede pintarse antes que él. */
  const validPartidos = baseE.rows.filter(r => !isEquipoTipo(r));
  /* Base Datos E trae DOS filas por partido, una por equipo. Contar filas
     duplica el numero: 130 filas son 65 partidos. Se cuenta por PARTIDO. */
  const colPartido = findColumnLabel(baseE.cols, ['PARTIDO']);
  /* Normalizamos espacios y mayusculas antes de contar: si las dos filas de
     un partido difieren en un espacio doble, el Set las toma como dos
     partidos distintos y el total sale de mas. */
  const clavePartido = (r) => String(r.formatted[colPartido] || r.values[colPartido] || '')
    .replace(/\s+/g, ' ').trim().toUpperCase();
  const partidosUnicos = colPartido
    ? new Set(validPartidos.map(clavePartido).filter(Boolean)).size
    : Math.round(validPartidos.length / 2);

  /* Del índice si está: es la misma cuenta pero de la fuente que usa el
     resto de la app, así que no puede contradecir a Clasificación. */
  const nEquipos = idxLiga ? String(idxLiga.n || (SGADD_APP.estado.idx ? SGADD_APP.estado.idx.lista().length : 0))
    : (promE.error ? '—' : String(countDistinct(validEquipos, findColumnLabel(promE.cols, ['EQUIPO', 'NOMBRE', 'RIVAL', 'TEAM']))));
  const kpiEquipos = renderModernCard('Equipos', nEquipos, 'En competencia', iconGrid);
  /* Sin índice todavía se muestra ausente, no un cero: el índice llega
     unos milisegundos después y el número aparece solo. Antes había un
     respaldo que contaba sobre `Base Datos J`, pero esa hoja ya no se pide
     —era el 68% del volumen para una sola cuenta— así que el respaldo
     nunca podría haber funcionado. */
  const nJugadores = idxLiga ? String(idxLiga.jugadores.length) : '—';
  const kpiJugadores = renderModernCard('Jugadores', nJugadores, 'Con datos', iconUser);
  const kpiPartidos = renderModernCard('Partidos', baseE.error ? '—' : String(partidosUnicos), 'Disputados', iconGlobe);

  const leaderPts = buildLeaderCard('Líderes en Puntos', promJ, ['PTS', 'PUNTOS']);
  const leaderReb = buildLeaderCard('Líderes en Rebotes', promJ, ['RT', 'REB', 'REBOTES', 'REBOTES TOTALES']);
  const leaderAst = buildLeaderCard('Líderes en Asistencias', promJ, ['AST', 'ASISTENCIAS']);

  const standTable = renderClasificacionResumen();

  return `
    <section class="space-y-8">
      ${SGADD_APP.barra()}
      <div>
        <h2 class="font-display uppercase tracking-wide text-sm text-muted mb-3">Resumen General</h2>
        <div class="grid grid-cols-2 md:grid-cols-4 gap-3 sm:gap-4 md:gap-6">
          ${kpiEquipos}
          ${kpiJugadores}
          ${kpiPartidos}
          ${kpi1}
        </div>
      </div>
      <div>
        <h2 class="font-display uppercase tracking-wide text-sm text-muted mb-3">Líderes · Promedios por Jugador</h2>
        <div class="grid grid-cols-1 md:grid-cols-3 gap-4">${leaderPts}${leaderReb}${leaderAst}</div>
      </div>
      <div class="space-y-6">
        <div>
          <h2 class="font-display uppercase tracking-wide text-sm text-muted mb-3">Tabla de posiciones</h2>
          <!-- Con id propio para que onCambio repinte SOLO esto cuando llega
               el indice o cambia el tramo, sin tocar el resto de Principal ni
               grafico de ORTG/DRTG (que ya colgo la pagina una vez, punto 6). -->
          <div id="principalClasif">${standTable}</div>
        </div>
        <div class="card rounded-xl p-3 sm:p-5 border border-hairline">
           <h3 class="font-display text-base sm:text-lg uppercase tracking-wide mb-3 sm:mb-4" style="color:#F9FAFB">ORTG vs DRTG · Mapa de Rendimiento</h3>
           <div class="chart-box">
             <canvas id="ortgDrtgChart"></canvas>
           </div>
           <div class="flex flex-wrap items-center gap-x-5 gap-y-2 mt-4 pt-3 border-t border-hairline text-[11px] text-muted">
             <span class="flex items-center gap-1.5"><i class="w-2.5 h-2.5 rounded-full border-2" style="border-color:#22c55e"></i>Elite</span>
             <span class="flex items-center gap-1.5"><i class="w-2.5 h-2.5 rounded-full border-2" style="border-color:#60a5fa"></i>Defensa fuerte</span>
             <span class="flex items-center gap-1.5"><i class="w-2.5 h-2.5 rounded-full border-2" style="border-color:var(--acento)"></i>Ataque fuerte</span>
             <span class="flex items-center gap-1.5"><i class="w-2.5 h-2.5 rounded-full border-2" style="border-color:#ef4444"></i>Bajo</span>
             <span class="ml-auto font-mono hidden lg:inline">Líneas punteadas = media de la liga · DRTG invertido (arriba = mejor defensa)</span>
           </div>
        </div>
      </div>
    </section>`;
}

/* ============ SECCIÓN: EQUIPOS / JUGADORES ============ */

/* `buildEquiposLegacy()` se borró el 2026-08-25. Era la tabla genérica de
   solo lectura que mostraba ACUMULADO E / PROMEDIOS E / Base Datos E /
   RANKINGS E en cuatro pestañas, y quedó fuera del router cuando Equipos
   pasó a `sgadd-equipos.js` con su grilla, su ficha y sus ocho tabs.

   No se borró por prolijidad: era el ÚNICO consumidor de `rankingsE`, y
   mientras existía, esta capa seguía pidiéndole a GViz las dos hojas
   `RANKINGS` en cada arranque para llenar una clave que nadie leía. */
/* buildJugadores() vive ahora en js/sgadd-jugadores.js (grilla → ficha →
   tabs, sobre el núcleo SGADD), igual que Equipos. La versión vieja mostraba
   las hojas J crudas (Acumulado/Promedios/Base/Rankings); esa capa de datos
   sigue existiendo para otras secciones, solo dejó de alimentar este tab. */

/* ============ SECCIÓN: 4 FACTORES ============ */
function detectNumericColumns(data, nameCol) {
  return data.cols.filter((c) => {
    if (nameCol && c.label === nameCol) return false;
    const vals = data.rows.map((r) => r.values[c.label]);
    if (!vals.length) return false;
    const numCount = vals.filter((v) => toNumber(v) !== null).length;
    return numCount / vals.length >= 0.6;
  }).map((c) => c.label);
}


function drawOrtgDrtgChart() {
  const canvas = document.getElementById('ortgDrtgChart');
  if (!canvas || typeof Chart === 'undefined') return;

  /* EL DATASET SALE DEL ÍNDICE, no de la hoja.

     `PROMEDIOS 4F` trae UNA FILA POR (equipo, torneo, fase), así que en
     el tramo TOTAL —que junta los torneos de una fase— devuelve 24 filas
     para 12 equipos y el gráfico pintaba CADA CLUB DOS VECES, uno por
     torneo. Se veía en pantalla: DEPORTIVO LA PLATA en dos coordenadas
     distintas.

     Deduplicar la hoja no arreglaría nada: habría que elegir una de las
     dos filas, y cualquiera de las dos son los números de UN torneo
     rotulados como si fueran los del total.

     El índice ya tiene los valores CONSOLIDADOS —recalculados sobre los
     totales, no promediados— y trae un equipo por club por definición.
     Es la misma fuente que usan Equipos, Clasificación y los rankings,
     así que además el mapa deja de poder contradecirlos.

     La hoja queda de respaldo para el arranque: Principal puede pintarse
     antes de que el índice esté armado, y ahí no hay TOTAL posible
     todavía. */
  const idxG = (typeof SGADD_APP !== 'undefined' && SGADD_APP.estado)
    ? SGADD_APP.estado.idx : null;

  let chartData;
  if (idxG) {
    chartData = idxG.lista().map(e => ({
      name: e.nombre,
      x: (e.factores && typeof e.factores['RTNG OFF'] === 'number') ? e.factores['RTNG OFF'] : null,
      y: (e.factores && typeof e.factores['RTNG DEF'] === 'number') ? e.factores['RTNG DEF'] : null,
    })).filter(d => d.x !== null && d.y !== null);
  } else {
    const data = sheet('promedios4f');
    if (data.error || !data.rows.length) return;
    const colEquipo = findColumnLabel(data.cols, ['EQUIPO', 'NOMBRE']);
    const colOff = findColumnLabel(data.cols, ['RTNG OFF', 'ORTG']);
    const colDef = findColumnLabel(data.cols, ['RTNG DEF', 'DRTG']);
    chartData = data.rows
      .filter(r => !isEquipoTipo(r))
      .map((r) => ({
        name: cleanName(r.formatted[colEquipo] || 'Desconocido'),
        x: toNumber(r.values[colOff]),
        y: toNumber(r.values[colDef])
      }))
      .filter(d => d.x !== null && d.y !== null);
  }

  if (!chartData.length) return;

  const avgX = chartData.reduce((a, d) => a + d.x, 0) / chartData.length;
  const avgY = chartData.reduce((a, d) => a + d.y, 0) / chartData.length;

  /* Margen extra en los ejes: los logos y los nombres se dibujan FUERA del punto,
     asi que sin esto los equipos de los bordes quedan cortados. */
  const xs = chartData.map(d => d.x), ys = chartData.map(d => d.y);
  const rangoX = (Math.max.apply(null, xs) - Math.min.apply(null, xs)) || 10;
  const rangoY = (Math.max.apply(null, ys) - Math.min.apply(null, ys)) || 10;
  const escala = {
    xMin: Math.min.apply(null, xs) - rangoX * 0.14,
    xMax: Math.max.apply(null, xs) + rangoX * 0.14,
    yMin: Math.min.apply(null, ys) - rangoY * 0.16,
    yMax: Math.max.apply(null, ys) + rangoY * 0.20,
  };

  /* Eje Y invertido: DRTG bajo = buena defensa = arriba.
     De ahi salen los cuatro cuadrantes. */
  function cuadrante(d) {
    const ofFuerte = d.x >= avgX;
    const defFuerte = d.y <= avgY;
    if (ofFuerte && defFuerte) return CUADRANTES.elite;
    if (!ofFuerte && defFuerte) return CUADRANTES.def;
    if (ofFuerte && !defFuerte) return CUADRANTES.of;
    return CUADRANTES.bajo;
  }

  if (chartInstances.ortgDrtg) chartInstances.ortgDrtg.destroy();
  equipoDestacado = -1;

  /* Chart.js no dispara onHover cuando el puntero SALE del canvas, asi que
     el equipo quedaba resaltado y el resto atenuado para siempre. */
  canvas.onmouseleave = removeHighlight;
  canvas.onpointerleave = removeHighlight;

  /* El tamaño de logo, tipografia y carteles se calcula sobre el ancho REAL
     del area de dibujo, no sobre el viewport: el mismo grafico puede estar
     en una card angosta de escritorio o a pantalla completa en un telefono. */
  function ui(chart) {
    const w = chart.chartArea ? (chart.chartArea.right - chart.chartArea.left) : 600;
    if (w < 360) return { logo: 20, nombre: 8, cartel: 9, corte: 8, mostrarNombres: false };
    if (w < 520) return { logo: 24, nombre: 9, cartel: 10, corte: 10, mostrarNombres: true };
    if (w < 760) return { logo: 27, nombre: 9, cartel: 10, corte: 11, mostrarNombres: true };
    return { logo: 30, nombre: 10, cartel: 11, corte: 13, mostrarNombres: true };
  }
  const angosto = BP.movil;

  chartInstances.ortgDrtg = new Chart(canvas.getContext('2d'), {
    type: 'scatter',
    data: {
      datasets: [{
        label: 'Equipos',
        data: chartData,
        backgroundColor: 'transparent',
        borderColor: 'transparent',
        pointRadius: angosto() ? 13 : 18,
        pointHoverRadius: angosto() ? 16 : 22,
      }]
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      layout: { padding: { top: angosto() ? 12 : 18, right: angosto() ? 10 : 18, bottom: 4, left: 4 } },
      scales: {
        x: {
          min: escala.xMin, max: escala.xMax,
          title: { display: true, text: angosto() ? 'ORTG →' : 'ORTG  →  ataque', color: '#9CA3AF', font: { family: 'Barlow', size: 11 } },
          grid: { color: 'rgba(40,40,40,0.65)' },
          ticks: { color: '#6b7280', font: { family: 'DM Mono', size: 10 }, maxTicksLimit: angosto() ? 5 : 10 },
        },
        y: {
          reverse: true,
          min: escala.yMin, max: escala.yMax,
          title: { display: true, text: angosto() ? 'DRTG ↑' : 'DRTG  ↑  defensa', color: '#9CA3AF', font: { family: 'Barlow', size: 11 } },
          grid: { color: 'rgba(40,40,40,0.65)' },
          ticks: { color: '#6b7280', font: { family: 'DM Mono', size: 10 }, maxTicksLimit: angosto() ? 6 : 10 },
        }
      },
      /* En mouse exigimos estar SOBRE el punto; en touch no, porque el dedo
         nunca cae justo. Con intersect:false en desktop, todo el grafico
         quedaba atenuado apenas entrabas al area. */
      interaction: { mode: 'nearest', intersect: !esTactil(), axis: 'xy' },
      onHover: (evt, elementos) => {
        const i = (elementos && elementos.length) ? elementos[0].index : -1;
        if (i !== equipoDestacado) { i >= 0 ? highlightPoint(i) : removeHighlight(); }
      },
      plugins: {
        legend: { display: false },
        tooltip: {
          displayColors: false,
          backgroundColor: '#0B1121',
          borderColor: '#374151',
          borderWidth: 1,
          padding: 10,
          titleFont: { family: '"Barlow Condensed"', size: 14 },
          bodyFont: { family: '"DM Mono"', size: 11 },
          callbacks: {
            title: (items) => items[0].raw.name.toUpperCase(),
            label: (ctx) => [
              'ORTG  ' + ctx.raw.x.toFixed(1) + '   (media ' + avgX.toFixed(1) + ')',
              'DRTG  ' + ctx.raw.y.toFixed(1) + '   (media ' + avgY.toFixed(1) + ')',
              cuadrante(ctx.raw).label,
            ],
          }
        }
      }
    },
    plugins: [
      /* --- 1. Cuadrantes: tintes, medias punteadas y carteles --- */
      {
        id: 'quadrant-plugin',
        beforeDatasetsDraw: (chart) => {
          const ctx = chart.ctx;
          const area = chart.chartArea;
          const ex = chart.scales.x.getPixelForValue(avgX);
          const ey = chart.scales.y.getPixelForValue(avgY);

          ctx.save();

          // Tinte suavisimo por cuadrante, solo para orientar la lectura.
          const tintes = [
            [area.left, area.top, ex - area.left, ey - area.top, CUADRANTES.def.color],
            [ex, area.top, area.right - ex, ey - area.top, CUADRANTES.elite.color],
            [area.left, ey, ex - area.left, area.bottom - ey, CUADRANTES.bajo.color],
            [ex, ey, area.right - ex, area.bottom - ey, CUADRANTES.of.color],
          ];
          ctx.globalAlpha = 0.035;
          tintes.forEach(([x, y, w, h, color]) => { ctx.fillStyle = color; ctx.fillRect(x, y, w, h); });
          ctx.globalAlpha = 1;

          // Lineas de media
          ctx.setLineDash([5, 5]);
          ctx.lineWidth = 1;
          ctx.strokeStyle = 'rgba(156, 163, 175, 0.55)';
          ctx.beginPath();
          ctx.moveTo(ex, area.top); ctx.lineTo(ex, area.bottom);
          ctx.moveTo(area.left, ey); ctx.lineTo(area.right, ey);
          ctx.stroke();
          ctx.setLineDash([]);

          // Valor de cada media, pegado a la linea
          const U = ui(chart);
          ctx.font = '500 ' + (U.cartel - 1) + 'px "DM Mono", monospace';
          ctx.fillStyle = 'rgba(156, 163, 175, 0.9)';
          ctx.textAlign = 'left';
          ctx.textBaseline = 'top';
          ctx.fillText(avgX.toFixed(1), ex + 5, area.top + 4);
          ctx.textAlign = 'right';
          ctx.fillText(avgY.toFixed(1), area.right - 5, ey + 4);

          // Carteles de cuadrante en las esquinas
          const P = U.cartel;
          const corto = U.cartel <= 10;
          const carteles = [
            [CUADRANTES.def,   area.left + P,  area.top + P,    'left',  'top'],
            [CUADRANTES.elite, area.right - P, area.top + P,    'right', 'top'],
            [CUADRANTES.bajo,  area.left + P,  area.bottom - P, 'left',  'bottom'],
            [CUADRANTES.of,    area.right - P, area.bottom - P, 'right', 'bottom'],
          ];
          ctx.font = '700 ' + U.cartel + 'px "Barlow Condensed", sans-serif';
          carteles.forEach(([q, x, y, ta, tb]) => {
            ctx.textAlign = ta;
            ctx.textBaseline = tb;
            ctx.fillStyle = q.color;
            ctx.globalAlpha = 0.85;
            ctx.fillText(corto ? q.corto : q.label, x, y);
          });

          ctx.restore();
        }
      },
      /* --- 2. Logos + nombre arriba --- */
      {
        id: 'team-logos-plugin',
        afterDatasetsDraw: (chart) => {
          const ctx = chart.ctx;
          const meta = chart.getDatasetMeta(0);
          if (!meta || meta.hidden) return;

          const puntos = chart.data.datasets[0].data;
          const U = ui(chart);
          const BASE = U.logo;
          const ocupados = [];  // cajas de texto ya dibujadas, para no pisarlas

          meta.data.forEach((point, index) => {
            if (!point || point.skip) return;
            const item = puntos[index];
            if (!item) return;

            const q = cuadrante(item);
            const img = LOGOS.getImage(item.name);
            const activo = (index === equipoDestacado);
            const hayFoco = (equipoDestacado >= 0);
            const x = point.x, y = point.y;
            const r = (activo ? BASE * 0.62 : BASE / 2);

            ctx.save();
            ctx.globalAlpha = (hayFoco && !activo) ? 0.25 : 1;

            if (activo) {
              ctx.beginPath();
              ctx.arc(x, y, r + 6, 0, Math.PI * 2);
              ctx.fillStyle = 'rgba(247, 148, 30, 0.16)';
              ctx.fill();
            }

            // Disco de fondo: los logos con transparencia necesitan base opaca.
            ctx.beginPath();
            ctx.arc(x, y, r, 0, Math.PI * 2);
            ctx.fillStyle = '#0B1121';
            ctx.fill();

            ctx.save();
            if (img) {
              ctx.beginPath();
              ctx.arc(x, y, r - 1, 0, Math.PI * 2);
              ctx.clip();
              ctx.drawImage(img, x - r + 1, y - r + 1, (r - 1) * 2, (r - 1) * 2);
            } else {
              ctx.fillStyle = '#F9FAFB';
              ctx.font = '600 ' + Math.round(r * 0.72) + 'px Barlow, sans-serif';
              ctx.textAlign = 'center';
              ctx.textBaseline = 'middle';
              ctx.fillText(iniciales(item.name), x, y + 0.5);
            }
            ctx.restore();

            // Anillo del color del cuadrante. Naranja grueso si esta activo.
            ctx.beginPath();
            ctx.arc(x, y, r, 0, Math.PI * 2);
            ctx.lineWidth = activo ? 3 : 2;
            ctx.strokeStyle = activo ? CLUB.TEMA.acento : q.color;
            if (activo) { ctx.shadowColor = 'rgba(247, 148, 30, 0.9)'; ctx.shadowBlur = 12; }
            ctx.stroke();
            ctx.shadowBlur = 0;

            // Nombre del equipo (reemplaza la lista lateral).
            // En pantallas muy angostas solo se rotula el equipo tocado.
            if (!U.mostrarNombres && !activo) { ctx.restore(); return; }
            const etiqueta = activo ? item.name.toUpperCase() : recortar(item.name.toUpperCase(), U.corte);
            ctx.font = (activo ? ('700 ' + (U.nombre + 2) + 'px ') : ('600 ' + U.nombre + 'px ')) + '"Barlow Condensed", sans-serif';
            ctx.textAlign = 'center';

            /* Evasion de colisiones: probamos arriba y, si ese hueco ya esta
               tomado por otra etiqueta, la mandamos abajo. Con dos intentos
               alcanza para densidades normales de liga. */
            const ancho = ctx.measureText(etiqueta).width;
            const alto = U.nombre + 2;
            const arriba = y - r - 5;
            const abajo = y + r + 5 + alto;
            let ty = arriba, base = 'bottom';

            const choca = (cy) => ocupados.some(c =>
              Math.abs(c.x - x) < (c.w + ancho) / 2 + 4 && Math.abs(c.y - cy) < alto + 2);

            if (choca(arriba)) {
              if (!choca(abajo)) { ty = abajo; base = 'alphabetic'; }
            }
            if (!activo) ocupados.push({ x: x, y: ty, w: ancho });
            ctx.textBaseline = base;

            // Contorno oscuro para que el texto se lea sobre la grilla.
            ctx.lineWidth = 3;
            ctx.strokeStyle = '#0B1121';
            ctx.lineJoin = 'round';
            ctx.strokeText(etiqueta, x, ty);
            ctx.fillStyle = activo ? CLUB.TEMA.acento : '#cbd5e1';
            ctx.fillText(etiqueta, x, ty);

            ctx.restore();
          });
        }
      }
    ]
  });

  LOGOS.resolver(chartData.map(d => d.name)).then((res) => {
    const c = chartInstances.ortgDrtg;
    if (c) c.update('none');
    renderPanelLogosFaltantes(res.faltantes);
  });
}

/* Definicion de los cuatro cuadrantes. Eje Y invertido: DRTG bajo = arriba. */
const CUADRANTES = {
  elite: { label: 'ELITE',      corto: 'ELITE', color: '#22c55e' },  // + ataque, + defensa
  def:   { label: 'DEF FUERTE', corto: 'DEF',   color: '#60a5fa' },  // - ataque, + defensa
  of:    { label: 'OF FUERTE',  corto: 'OF',    get color() { return CLUB.TEMA.acento; } },  // + ataque, - defensa
  bajo:  { label: 'BAJO',       corto: 'BAJO',  color: '#ef4444' },  // - ataque, - defensa
};

function recortar(txt, max) {
  const s = String(txt || '');
  return s.length > max ? s.slice(0, max - 1) + '…' : s;
}
function renderPanelLogosFaltantes(faltantes) {
  const previo = document.getElementById('logosFaltantesPanel');
  if (previo) previo.remove();
  if (!faltantes || !faltantes.length) return;

  const filas = faltantes.map(n =>
    `<li class="flex items-baseline justify-between gap-3 py-1 border-b border-hairline/50 last:border-0">
       <span class="text-muted truncate">${escapeHtml(n)}</span>
       <code class="font-mono text-accent text-[11px] shrink-0">${LOGOS.slug(n)}.png</code>
     </li>`).join('');

  const lista = faltantes.map(n => LOGOS.slug(n) + '.png').join('\n');

  const div = document.createElement('div');
  div.id = 'logosFaltantesPanel';
  div.className = 'fixed bottom-4 right-4 z-40 w-[330px] max-w-[92vw] card rounded-lg shadow-2xl p-4';
  div.innerHTML = `
    <div class="flex items-start justify-between gap-2 mb-2">
      <h4 class="font-display uppercase tracking-wider text-sm text-accent">
        Faltan ${faltantes.length} logo${faltantes.length > 1 ? 's' : ''}
      </h4>
      <button onclick="document.getElementById('logosFaltantesPanel').remove()"
              class="text-muted hover:text-ink text-lg leading-none px-1" title="Cerrar">&times;</button>
    </div>
    <p class="text-[11px] text-muted mb-3 leading-snug">
      Subí estos archivos a <code class="text-ink">${(LOGOS.CFG.basePaths || ['logos/'])[0]}</code> en el repositorio.
      El nombre tiene que ser este; la extensión puede ser
      <code class="text-ink">.png .jpg .webp .avif .svg</code>:
    </p>
    <ul class="text-xs max-h-56 overflow-y-auto mb-3">${filas}</ul>
    <button id="copiarListaLogos"
            class="w-full text-xs font-semibold uppercase tracking-wider bg-accent text-base rounded py-2 hover:bg-accentdeep transition-colors">
      Copiar lista
    </button>`;
  document.body.appendChild(div);

  div.querySelector('#copiarListaLogos').addEventListener('click', (ev) => {
    navigator.clipboard.writeText(lista).then(() => {
      ev.target.textContent = 'Copiado';
      setTimeout(() => { ev.target.textContent = 'Copiar lista'; }, 1500);
    }).catch(() => { ev.target.textContent = 'No se pudo copiar'; });
  });
}

const iniciales = LOGOS.iniciales;

/* ============ SECCIÓN: SCOUTING ============ */
function buildScouting() {
  /* SCOUTING ES UNA SOLA COSA: el informe pre-partido.

     Tenía un segundo tab, "Comparar Jugadores", con la comparativa legacy
     de dos filas de `PROMEDIOS J`. Contestaba otra pregunta —no "cómo
     defiendo a este equipo" sino "en qué se diferencian estos dos"— y por
     eso se mudó a la sección COMPARATIVA, que es donde vive esa pregunta
     para equipos y para jugadores. Tener dos comparadores distintos en la
     app era pedirle al DT que eligiera entre dos caminos al mismo lugar.

     Con un solo contenido la barra de pestañas se va: una pestaña sola no
     es una elección, es un adorno que ocupa una línea.

     Se encadena a la promesa de `cargar()` en vez de confiar solo en el
     hook de `onCambio` de sgadd-app.js: entrando a la sección antes de que
     la categoría termine de bajar, el hook es el único que repinta y
     cualquier desincronización entre los dos archivos deja la vista
     clavada en "Cargando…". */
  SGADD_APP.inicializar();
  setTimeout(() => { scoutPintar(); Promise.resolve(SGADD_APP.cargar()).then(scoutPintar); }, 0);
  return `
    <section class="space-y-4">
      ${SGADD_APP.barra()}
      <div id="scoutRoot" class="space-y-4"></div>
    </section>`;
}

/* LA COMPARATIVA LEGACY DE DOS FILAS · YA NO LA LLAMA NADIE.

   Era el tab "Comparar Jugadores" de Scouting y se mudó a COMPARATIVA,
   que hace lo mismo mejor: lee de `idx` en vez de la capa de datos vieja,
   compara hasta tres, respeta la dirección de cada métrica y dice en qué
   se separan.

   Queda acá, sin borrar, a propósito: arrastra `factorSelection`,
   `onCompareChange` y `drawScoutingCharts`, y sacar ese hilo entero en la
   misma vuelta que se agrega una sección es cambiar dos cosas a la vez.
   `drawScoutingCharts` ya no encuentra su canvas y sale por el guard.
   Se limpia aparte, cuando el módulo nuevo esté rodado. */
function buildScoutingCompare(sheetKey, nameCandidates, selectionKey, chartSuffix) {
  const data = sheet(sheetKey);
  if (data.error) return renderErrorCard(`${sheetKey}: ${data.error}`);
  if (!data.rows.length) return renderEmptyCard('No hay datos disponibles.');

  const nameCol = findColumnLabel(data.cols, nameCandidates);
  if (!nameCol) return renderEmptyCard('No se encontró una columna de nombre/equipo para comparar.');

  const numericCols = detectNumericColumns(data, nameCol);
  const options = data.rows.map((r) => r.formatted[nameCol]).filter((v) => v !== '' && v !== null && v !== undefined);
  if (!options.length) return renderEmptyCard('No hay filas con nombre para comparar.');

  const sel = factorSelection[selectionKey];
  if (!sel[0] || !options.includes(sel[0])) sel[0] = options[0];
  if (!sel[1] || !options.includes(sel[1])) sel[1] = options[1] ?? options[0];

  const selectA = buildSelect(`compareA-${chartSuffix}`, options, sel[0], `onCompareChange('${selectionKey}', 0, this.value)`);
  const selectB = buildSelect(`compareB-${chartSuffix}`, options, sel[1], `onCompareChange('${selectionKey}', 1, this.value)`);

  const rowA = data.rows.find((r) => r.formatted[nameCol] === sel[0]);
  const rowB = data.rows.find((r) => r.formatted[nameCol] === sel[1]);

  const compareRows = numericCols.length
    ? numericCols.map((col) => {
      const va = rowA ? (rowA.formatted[col] ?? '—') : '—';
      const vb = rowB ? (rowB.formatted[col] ?? '—') : '—';
      const na = rowA ? toNumber(rowA.values[col]) : null;
      const nb = rowB ? toNumber(rowB.values[col]) : null;
      const aWins = na !== null && nb !== null && na > nb;
      const bWins = na !== null && nb !== null && nb > na;
      return `<tr>
        <td class="px-3 py-2 text-sm font-mono tabular-nums ${aWins ? 'text-accent font-semibold' : ''}">${escapeHtml(va)}</td>
        <td class="px-3 py-2 text-xs uppercase tracking-wide text-muted whitespace-nowrap font-display">${escapeHtml(col)}</td>
        <td class="px-3 py-2 text-sm font-mono tabular-nums ${bWins ? 'text-accent font-semibold' : ''}">${escapeHtml(vb)}</td>
      </tr>`;
    }).join('')
    : `<tr><td colspan="3" class="px-3 py-4 text-sm text-muted">No se detectaron columnas numéricas para comparar.</td></tr>`;

  return `
    <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
      <div class="card rounded-lg p-5 space-y-4">
        <div class="grid grid-cols-2 gap-3">
          ${selectA}
          ${selectB}
        </div>
        <div class="scrollbox">
          <table class="w-full">
            <tbody>${compareRows}</tbody>
          </table>
        </div>
      </div>
      <div class="card rounded-lg p-5">
        <div class="chart-box is-sm">
          <canvas id="compareChart-${chartSuffix}"></canvas>
        </div>
      </div>
    </div>`;
}

function onCompareChange(selectionKey, index, value) {
  factorSelection[selectionKey][index] = value;
  rerenderCurrentSection();
}

function drawScoutingCharts() {
  if (typeof Chart === 'undefined') return;
  const suffix = tabState.scouting;
  const sheetKey = suffix === 'jugadores' ? 'promediosJ' : 'promediosE';
  const nameCandidates = suffix === 'jugadores' ? ['NOMBRE', 'JUGADOR'] : ['EQUIPO', 'NOMBRE', 'RIVAL', 'TEAM'];
  const selectionKey = suffix === 'jugadores' ? 'scoutingPlayers' : 'scoutingTeams';
  const data = sheet(sheetKey);
  const canvas = document.getElementById(`compareChart-${suffix}`);
  if (!canvas || data.error || !data.rows.length) return;

  const nameCol = findColumnLabel(data.cols, nameCandidates);
  if (!nameCol) return;
  const numericCols = detectNumericColumns(data, nameCol);
  if (numericCols.length < 2) return;

  const maxByMetric = {};
  numericCols.forEach((col) => {
    const vals = data.rows.map((r) => toNumber(r.values[col])).filter((v) => v !== null);
    maxByMetric[col] = vals.length ? Math.max(...vals, 0.0001) : 1;
  });

  const sel = factorSelection[selectionKey];
  const rowA = data.rows.find((r) => r.formatted[nameCol] === sel[0]);
  const rowB = data.rows.find((r) => r.formatted[nameCol] === sel[1]);
  const rawByLabel = {};
  const datasets = [];

  if (rowA) {
    rawByLabel[sel[0]] = numericCols.map((c) => rowA.formatted[c]);
    datasets.push({
      label: sel[0],
      data: numericCols.map((c) => ((toNumber(rowA.values[c]) ?? 0) / maxByMetric[c]) * 100),
      borderColor: CLUB.TEMA.acento, backgroundColor: CLUB.TEMA.acento + '33', pointBackgroundColor: CLUB.TEMA.acento, borderWidth: 2,
    });
  }
  if (rowB && sel[1] !== sel[0]) {
    rawByLabel[sel[1]] = numericCols.map((c) => rowB.formatted[c]);
    datasets.push({
      label: sel[1],
      data: numericCols.map((c) => ((toNumber(rowB.values[c]) ?? 0) / maxByMetric[c]) * 100),
      borderColor: '#60a5fa', backgroundColor: '#60a5fa33', pointBackgroundColor: '#60a5fa', borderWidth: 2,
    });
  }
  if (!datasets.length) return;

  const chartKey = `compare-${suffix}`;
  if (chartInstances[chartKey]) chartInstances[chartKey].destroy();
  chartInstances[chartKey] = new Chart(canvas.getContext('2d'), {
    type: 'radar',
    data: { labels: numericCols, datasets },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      scales: {
        r: {
          min: 0, max: 100,
          angleLines: { color: '#282828' },
          grid: { color: '#282828' },
          pointLabels: {
            color: '#f5f4f2',
            font: { family: 'Barlow', size: BP.movil() ? 8 : 11 },
            callback: (l) => (BP.movil() && String(l).length > 12
              ? String(l).replace(/\s+/, '\n').split('\n') : l),
          },
          ticks: { display: false },
        },
      },
      plugins: {
        legend: {
          position: BP.movil() ? 'bottom' : 'top',
          labels: {
            color: '#f5f4f2',
            font: { family: 'Barlow', size: BP.movil() ? 10 : 12 },
            boxWidth: BP.movil() ? 10 : 20,
          },
        },
        tooltip: {
          callbacks: {
            label(ctx) {
              const raw = rawByLabel[ctx.dataset.label];
              const val = raw ? raw[ctx.dataIndex] : ctx.formattedValue;
              return `${ctx.dataset.label}: ${val}`;
            },
          },
        },
      },
    },
  });
}

/* ============ ROUTER ============ */
function renderSection(section) {
  currentSection = section;
  document.querySelectorAll('[data-nav]').forEach((btn) => {
    const isActive = btn.getAttribute('data-nav') === section;
    btn.classList.toggle('active', isActive);
    btn.classList.toggle('bg-surface2', isActive);
    btn.classList.toggle('text-accent', isActive);
  });
  const titles = { principal: 'Principal', clasificacion: 'Clasificación', equipos: 'Equipos',
    jugadores: 'Jugadores', scouting: 'Scouting', simulador: 'Simulador',
    configuracion: 'Panel Master', diagnostico: 'Diagnóstico',
    glosario: 'Glosario', comparativa: 'Comparativa' };
  const titleEl = document.getElementById('page-title');
  if (titleEl) titleEl.textContent = titles[section] || '';

  const root = document.getElementById('view-root');
  if (!root) return;

  /* EL GUARD DEL ROUTER. Va acá y no solo en `navigate()` porque a una
     sección se llega también por hash pegado a mano y por el ruteo
     inicial, y esos no pasan por `navigate()`. Un solo punto de entrada
     al render es un solo lugar donde chequear. */
  const permiso = SGADD_AUTH.puedoAcceder(section);
  if (!permiso.ok) {
    root.innerHTML = SGADD_UI.sinAcceso({
      motivo: permiso.motivo, plan: permiso.plan,
      seccion: titles[section] || section,
    });
    return;
  }

  /* MODO LANDING. Sin `?club=` no hay planilla que mostrar, así que cada
     sección explica qué se ve ahí en vez de intentar pintar datos que no
     existen. Va DESPUÉS del guard de permisos —un visitante tampoco entra
     a las internas desde la landing— y antes del switch, que es el único
     punto por el que pasan todas las secciones. */
  if (typeof SGADD_LANDING !== 'undefined' && SGADD_LANDING.activa()) {
    root.innerHTML = SGADD_LANDING.vista(section);
    return;
  }

  switch (section) {
    case 'principal': root.innerHTML = buildPrincipal(); drawOrtgDrtgChart(); break;
    case 'configuracion': root.innerHTML = buildConfiguracion(); break;   // SGADD (js/sgadd-configui.js)
    case 'diagnostico': root.innerHTML = buildDiagnostico(); diagCorrer(); break;
    case 'clasificacion': root.innerHTML = buildClasificacion(); break;   // SGADD (js/sgadd-clasificacion.js)
    case 'equipos': root.innerHTML = buildEquipos(); break;   // SGADD (js/sgadd-equipos.js)
    case 'jugadores': root.innerHTML = buildJugadores(); break;
    case 'simulador': root.innerHTML = buildSimulador(); break;   // SGADD (js/sgadd-4factores.js)
    case 'scouting': root.innerHTML = buildScouting(); drawScoutingCharts(); break;
    case 'glosario': root.innerHTML = SGADD_GLOSARIOUI.html(); break;   // SGADD (js/sgadd-glosarioui.js)
    /* COMPARATIVA necesita el índice, así que se engancha a la promesa de
       `cargar()` igual que Equipos/Jugadores/Scouting: entrando antes de
       que baje la categoría, el hook de `onCambio` es el único que
       repinta y la vista quedaría clavada en "Cargando…". */
    case 'comparativa':
      SGADD_APP.inicializar();
      SGADD_COMPUI.pintar();
      SGADD_APP.cargar().then(() => { if (currentSection === 'comparativa') SGADD_COMPUI.pintar(); });
      break;   // SGADD (js/sgadd-comparativaui.js)
    default: root.innerHTML = '';
  }
}

function navigate(section) {
  if (!VALID_SECTIONS.includes(section)) section = 'principal';
  /* Si el hash ya trae una ruta SGADD completa de ESTA misma sección, no se
     pisa: la escribió quien navegó (por ejemplo el link cruzado de Jugadores
     al detalle de un partido en Equipos, que lleva equipo + tab + partido).
     Reemplazarla por "#equipos" a secas dejaba el link imposible de compartir
     y un F5 volvía a la grilla. */
  const actual = window.location.hash || '';
  const rutaSgadd = actual.indexOf('#/') === 0 && SGADD.Ruta.parse(actual).seccion === section;
  renderSection(section);
  closeSidebar();
  const root = document.getElementById('view-root');
  if (root) root.scrollTop = 0;
  window.scrollTo(0, 0);
  if (!rutaSgadd) history.replaceState(null, '', `#${section}`);
}

/* Esconde del menú lo que esta sesión no puede abrir.

   Se ESCONDE en vez de deshabilitarse: un botón gris que no hace nada
   invita a clickearlo y no explica por qué. El que llega por URL sí ve
   la explicación completa, que es donde tiene sentido darla.

   Scouting es la excepción: al Básico se le MUESTRA, porque el punto es
   justamente que sepa que el módulo existe. Al entrar encuentra la card
   del plan con su acción. */
function aplicarPermisosNav() {
  document.querySelectorAll('[data-nav]').forEach((btn) => {
    const sec = btn.getAttribute('data-nav');
    const p = SGADD_AUTH.puedoAcceder(sec);
    const mostrar = p.ok || p.motivo === SGADD_AUTH.MOTIVOS.REQUIERE_PLAN;
    btn.classList.toggle('hidden', !mostrar);
  });
  pintarDistintivoPlan();
  pintarBotonIngreso();
  const pie = document.getElementById('pieApp');
  if (pie && typeof SGADD_UI !== 'undefined') pie.innerHTML = SGADD_UI.pieWeb();
  const d = SGADD_AUTH.descripcionSesion();
  const cont = document.getElementById('sesion-slot');
  if (cont) {
    cont.innerHTML = d ? `<span class="block text-[10px] uppercase tracking-wider text-muted">${
      SGADD_UI.esc(d.texto)}</span><span class="block text-[10px] text-muted/70 font-mono">${
      SGADD_UI.esc(d.detalle)}</span>` : '';
  }
}

/* EL BOTON DE INGRESO.

   Solo se ofrece cuando NO hay sesion: con una abierta, lo util es
   salir, no volver a entrar. Y solo con backend, porque sin el no hay
   contra que autenticar — una puerta que no lleva a ningun lado es peor
   que ninguna. */
function pintarBotonIngreso() {
  const cont = document.getElementById("ingresoSlot");
  if (!cont) return;
  const haySesion = !!SGADD_AUTH.token() || !!SGADD_AUTH.sesion();
  const hayApi = (typeof SGADD_DATA !== "undefined") && SGADD_DATA.apiConfigurada();
  /* CON SESION ABIERTA el boton util es SALIR, no volver a entrar. Antes
     no habia ninguno: la unica forma de cerrar sesion era vaciar el
     storage a mano desde la consola, que no es una salida. */
  if (haySesion) {
    cont.innerHTML = '<button onclick="SGADD_LOGIN.salir()" class="boton-ingreso">Cerrar sesión</button>';
    return;
  }
  cont.innerHTML = hayApi
    ? '<button onclick="SGADD_LOGIN.abrir()" class="boton-ingreso">Ingresar</button>'
    : '';
}

/* EL DISTINTIVO DEL PLAN ORO.

   El plan que se muestra es el EFECTIVO que declara el servidor
   (`estado.alcance.plan`), no el del token: es el que se hace valer, asi
   que con el del token un club bajado a Bronce seguiria luciendo un
   distintivo que ya no le corresponde hasta que su link venciera.

   Sin backend no se pinta nada: ahi no hay plan efectivo que consultar y
   un distintivo inventado seria peor que ninguno. */
function pintarDistintivoPlan() {
  const slot = document.getElementById('planSlot');
  if (!slot) return;
  const al = (typeof SGADD_APP !== 'undefined' && SGADD_APP.estado)
    ? SGADD_APP.estado.alcance : null;
  const plan = al && al.plan ? SGADD_AUTH.normalizarPlan(al.plan) : null;
  if (plan !== 'ORO') { slot.innerHTML = ''; return; }
  slot.innerHTML = '<span class="distintivo-oro" title="Analisis de scouters de '
    + 'MotorStats.ar en ciclos cada 4 partidos">&#9670; Plan ORO &middot; '
    + 'Auditoria MotorStats activa</span>';
}

function toggleSidebar() {
  sidebarOpen = !sidebarOpen;
  document.getElementById('sidebar').classList.toggle('open', sidebarOpen);
  document.getElementById('overlay').classList.toggle('hidden', !sidebarOpen);

/* ============ ESTADO DE CARGA / ERRORES ============ */
function renderStatusBanner(errors) {
  const holder = document.getElementById('status-banner-holder');
  if (!holder) return;
  if (!errors || !errors.length) {
    /* Sin errores el header queda vacío: el estado "todo bien" ya lo dice el
       punto verde del pie del menú, y repetirlo arriba era ruido. */
    holder.innerHTML = '';
    return;
  }
  holder.innerHTML = `
    <button onclick="toggleErrorDetail()" class="flex items-center gap-2 text-xs text-amber-400 hover:text-amber-300">
      <span class="w-2 h-2 rounded-full bg-amber-500"></span>${errors.length} hoja${errors.length === 1 ? '' : 's'} con errores
    </button>`;
}
function toggleErrorDetail() {
  if (!lastErrors.length) return;
  const list = lastErrors.map((e) => `• ${e.name}: ${e.error}`).join('\n');
  alert(`No se pudieron cargar estas hojas:\n\n${list}`);
}
function updateLastUpdatedLabel() {
  const el = document.getElementById('last-updated');
  if (!el) return;
  /* El punto verde vive acá, junto a la hora: es el mismo dato que antes se
     repetía arriba como "Datos actualizados". El header queda para los
     avisos de error, que sí necesitan estar a la vista. */
  el.innerHTML = lastUpdated
    ? `<span class="inline-flex items-center gap-1.5"><span class="w-2 h-2 rounded-full bg-green-500 shrink-0"></span>${escapeHtml(lastUpdated.toLocaleTimeString('es-AR'))}</span>`
    : '';
}

async function refreshData() {
  const label = document.getElementById('refresh-label');
  if (label) label.textContent = 'Actualizando…';
  // Datos y logos viajan en paralelo. Los logos tienen techo de 12s:
  // si Drive tarda, el dashboard igual arranca y los logos entran despues via onReady.
  /* El club define catalogo, tema y escudos. Todo lo demas depende de esto,
     asi que se resuelve primero. Si falla, seguimos con los defaults. */
  /* La config del club es una MEJORA OPCIONAL, no un requisito. Si el JSON
     no esta o falla, el panel arranca igual con los defaults de arriba.
     Nunca mas un archivo de configuracion puede tumbar el dashboard. */
  await resolverClubYPlanilla();

  /* EN LA LANDING NO SE PIDE NADA. Sin club no hay libro que bajar, y el
     intento terminaba en la pantalla llena de carteles rojos que la
     landing vino a reemplazar. Además así carga instantánea y no puede
     fallar por red. */
  const enLanding = (typeof SGADD_LANDING !== 'undefined') && SGADD_LANDING.activa();
  const errors = enLanding ? [] : await fetchAllData();
  /* La marca de MotorStats se pone DESPUÉS de `fetchAllData`, que es
     cuando `sgadd-club.js` ya terminó de pintar la del club por defecto.
     Al revés, la del club la pisaba y el sidebar seguía diciendo el
     nombre de un cliente que no es el que se está mirando. */
  if (enLanding) SGADD_LANDING.aplicarMarca();
  lastErrors = errors;
  precargarLogos();
  renderStatusBanner(errors);
  updateLastUpdatedLabel();
  if (label) label.textContent = 'Actualizar datos';
  renderSection(currentSection);


  /* El buzón vive en el header global, así que tiene que tener alertas
     ANTES de que el usuario entre a una sección SGADD. Principal usa la
     capa de datos vieja y nunca dispara `SGADD_APP.cargar()`, así que se
     dispara acá — sin await, para no demorar el primer render. La carga
     está cacheada por `SGADD.cargarCategoria`, así que entrar después a
     Equipos no vuelve a pedir nada. */
  /* TAMPOCO EN LA LANDING. Este disparo es el que arma el índice para el
     buzón, y sin club no hay plantel del que detectar ausencias: lo único
     que lograba era pedir una planilla que no corresponde y dejar el
     cartel de "1 hoja con errores" arriba de la bienvenida. */
  if (typeof SGADD_APP !== 'undefined' && !enLanding) {
    Promise.resolve(SGADD_APP.cargar()).then(() => {
      if (typeof SGADD_BUZON !== 'undefined') SGADD_BUZON.sincronizar();
    }).catch(() => {});
  }
}

/*
  El resaltado NO usa setActiveElements: como el dataset tiene background y border
  transparentes (los puntos los dibuja nuestro plugin), Chart.js no tenia nada que
  pintar en hover. Manejamos el foco nosotros y forzamos un redraw sin animacion.
*/
function highlightPoint(index) {
  if (equipoDestacado === index) return;
  equipoDestacado = index;
  const chart = chartInstances.ortgDrtg;
  if (chart) chart.update('none');
}

function removeHighlight() {
  if (equipoDestacado === -1) return;
  equipoDestacado = -1;
  const chart = chartInstances.ortgDrtg;
  if (chart) chart.update('none');
}

/* ============ INICIALIZACIÓN ============ */

/* Resuelve el club de la URL y deja activa SU planilla.

   Este paso vivia SOLO dentro de refreshData(), asi que en el ARRANQUE
   la planilla se quedaba con la de por defecto y ?club=jujuy terminaba
   mostrando los datos de Reconquista. Ahora es una sola funcion que llaman
   los dos caminos. */
async function resolverClubYPlanilla() {
  if (typeof CLUB !== 'undefined') {
    try { await CLUB.cargar(); } catch (e) { console.warn('[CLUB] omitido:', e); }
  }
  if (typeof SGADD_APP === 'undefined') return;

  SGADD_APP.inicializar();

  /* Si la planilla seleccionada no pertenece a ESTE club (pasa al cambiar de
     ?club=), se descarta y se toma la primera del catalogo nuevo. */
  let p = SGADD_APP.planillaActual();
  if (!p || !(p.slug || p.sheetId)) {
    const activas = SGADD.planillasVisibles({});
    if (activas.length) {
      SGADD_APP.estado.planillaId = activas[0].id;
      p = SGADD_APP.planillaActual();
    }
  }
  PLANILLA_ACTIVA = p;

  /* El log NO imprime el id de la planilla: con el backend eso es
     justamente el dato que no tiene que estar en ningún lado del cliente,
     y la consola es un lado del cliente. Va el slug, que es opaco. */
  console.log('[BOOT] club=' + ((typeof CLUB !== 'undefined' && CLUB.estado.id) || '?') +
    ' · planilla=' + (p ? p.id : '—') + ' · origen=' +
    (typeof SGADD_DATA !== 'undefined' ? SGADD_DATA.origen(p) : '?'));
}
/**
 * La sección que pide la URL, en cualquiera de los dos formatos.
 *
 * Hay DOS vocabularios de hash conviviendo y `init()` entendía uno solo:
 *
 *   #equipos                                    ← plano, el del menú
 *   #/<planilla>/<torneo>/<fase>/equipos/…      ← ruta SGADD, la de las
 *                                                 fichas y los links
 *                                                 compartidos
 *
 * Con el segundo, `VALID_SECTIONS.includes('/deportivo-primera-2026/…')`
 * daba false y la app abría en PRINCIPAL. Después una segunda pasada la
 * corregía, así que el DT veía un parpadeo — y si esa pasada perdía la
 * carrera (red lenta, error de carga), se quedaba en Principal sin más.
 *
 * `SGADD.Ruta.parse()` ya sabe leer los dos formatos y es el único lugar
 * que conoce ese vocabulario. Reusarlo evita que exista un segundo
 * parser que se quede viejo cuando se agregue una sección.
 */
/* Un hash a mano no puede abrir una sección que esta sesión no tiene.

   Devuelve PRINCIPAL en vez de la denegada solo cuando el motivo es que
   la pantalla es interna: ahí el link no es para este usuario y llevarlo
   a la pantalla de entrada es lo correcto. Con REQUIERE_PLAN se deja
   pasar y el router pinta la card del plan — el link SÍ era para él y
   merece ver qué se está perdiendo, no un rebote mudo. */
function permitida(sec) {
  const p = SGADD_AUTH.puedoAcceder(sec);
  if (p.ok || p.motivo === SGADD_AUTH.MOTIVOS.REQUIERE_PLAN) return sec;
  return 'principal';
}

function seccionDeLaUrl() {
  const h = window.location.hash || '';
  if (!h || h === '#') return 'principal';

  /* Formato plano: #equipos */
  const plano = h.replace('#', '');
  if (VALID_SECTIONS.includes(plano)) return permitida(plano);

  /* Ruta SGADD. Si el núcleo todavía no cargó, se cae al default en vez
     de inventar un parser propio. */
  try {
    if (typeof SGADD !== 'undefined' && SGADD.Ruta && SGADD.Ruta.parse) {
      const r = SGADD.Ruta.parse(h);
      if (r && r.seccion && VALID_SECTIONS.includes(r.seccion)) return permitida(r.seccion);
    }
  } catch (e) { /* un hash raro no puede impedir que la app abra */ }
  return 'principal';
}

async function init() {
  currentSection = seccionDeLaUrl();

  /* La versión de assets, a la vista en el pie del menú.

     Va en `init()` y NO en `refreshData()`, que corre solo al tocar el botón
     — es exactamente el error que ya se cometió con el arranque del buzón y
     que está anotado en el punto 13. Y sale del `?v=` de un <script> REAL en
     vez de una constante: una constante se puede olvidar de subir y mentiría
     justo cuando más importa. */
  (function () {
    const p = document.getElementById('asset-version');
    if (!p) return;
    const sc = document.querySelector('script[src*="sgadd-core.js?v="]');
    const m = sc && sc.getAttribute('src').match(/\?v=(\d+)/);
    p.textContent = m ? 'v' + m[1] : '';
  })();

  /* RESPALDO DE Ctrl+P · el nombre del PDF cuando NO se usó un botón.

     Las cuatro exportaciones nombran su archivo antes de imprimir, pero el
     DT también hace Ctrl+P parado en la tabla de posiciones o en el
     resumen, y ahí Chrome propone el título de la app.

     Se acota a Principal y Clasificación A PROPÓSITO. En una sección con
     su propia exportación, un Ctrl+P a mano imprime la pantalla sin el
     modo de papel: llamarlo 'Resumen' sería ponerle nombre de informe a
     algo que no es el informe. Y nunca pisa a una exportación en curso —
     eso lo decide `tituloPdfActivo()`. */
  window.addEventListener('beforeprint', () => {
    if (typeof SGADD_UI === 'undefined' || SGADD_UI.tituloPdfActivo()) return;
    if (currentSection !== 'principal' && currentSection !== 'clasificacion') return;
    const pl = (typeof SGADD_APP !== 'undefined') ? SGADD_APP.planillaActual() : null;
    SGADD_UI.tituloPdf(SGADD_UI.nombrePdf('resumen', {
      club: (typeof CLUB !== 'undefined' && CLUB.cfg) ? CLUB.cfg.nombre : '',
      categoria: pl && pl.label,
    }));
  });

  /* La sesión primero: de ella dependen el menú, el router y los
     pickers, así que tiene que estar resuelta antes del primer render.
     Es síncrona (URL + localStorage), no agrega latencia. */
  /* LA URL DEL BACKEND.

     Tres orígenes, en este orden: `?api=` (para probar contra un servidor
     local sin tocar el deploy), `window.SGADD_API` (lo que pone el
     `<script>` de configuración en producción) y vacío.

     VACÍO ES UN ESTADO VÁLIDO, no un error: mientras el backend no esté
     desplegado, el panel cae al modo que pueda y lo dice. Un panel que
     exige un backend que todavía no existe no se puede desplegar por
     partes, y esta migración se hace por partes sí o sí — son tres clubes
     en producción. */
  (function () {
    var api = '';
    try {
      var q = new URLSearchParams(window.location.search);
      api = q.get('api') || window.SGADD_API || '';
    } catch (e) { api = window.SGADD_API || ''; }
    SGADD_DATA.configurar(api);
  })();

  SGADD_AUTH.cargarSesion();
  aplicarPermisosNav();

  /* El selector de cliente se pide SIN await: es una comodidad de
     navegación del admin y esperarlo demoraría el primer pintado por un
     control que no hace falta para leer los datos. Aparece un instante
     después, que es exactamente lo que hace el buzón. */
  /* Los tooltips de metrica se enganchan UNA vez, por delegacion en el
     `document`: sobreviven a cualquier repintado de tabla. */
  if (typeof SGADD_GLOSARIOUI !== 'undefined') SGADD_GLOSARIOUI.iniciar();
  if (typeof SGADD_CONFIRMAR !== 'undefined') SGADD_CONFIRMAR.iniciar();
  if (typeof SGADD_CLIENTES !== 'undefined') SGADD_CLIENTES.iniciar();
  /* El selector de cliente SÍ se pide en la landing: un admin que entra a
     la URL limpia tiene que poder elegir a quién mirar desde ahí. */

  // Primero el club: define de QUE planilla se bajan los datos.
  await resolverClubYPlanilla();

  /* EN LA LANDING NO SE PIDE NADA. Sin `?club=` no hay libro que bajar, y
     el intento terminaba en la pantalla llena de carteles rojos que la
     landing vino a reemplazar. Además así carga instantánea y no puede
     fallar por red. */
  const enLanding = (typeof SGADD_LANDING !== 'undefined') && SGADD_LANDING.activa();
  const errors = enLanding ? [] : await fetchAllData();
  lastErrors = errors;

  document.getElementById('loader').classList.add('hidden');
  document.getElementById('app').classList.remove('hidden');

  renderStatusBanner(errors);
  updateLastUpdatedLabel();
  renderSection(currentSection);

  /* El buzon vive en el header global, asi que tiene que tener alertas ANTES
     de que el usuario entre a una seccion SGADD. Principal usa la capa de
     datos vieja y nunca dispara `SGADD_APP.cargar()`, asi que se dispara aca
     — sin await, para no demorar el primer render. La carga queda cacheada en
     `SGADD.cargarCategoria`, asi que entrar despues a Equipos no vuelve a
     pedir nada. */
  /* TAMPOCO EN LA LANDING: este disparo arma el índice para el buzón, y
     sin club no hay plantel del que detectar ausencias. Lo único que
     lograba era pedir una planilla que no corresponde y dejar el cartel de
     "1 hoja con errores" arriba de la bienvenida. */
  if (typeof SGADD_APP !== 'undefined' && !enLanding) {
    Promise.resolve(SGADD_APP.cargar()).then(function () {
      if (typeof SGADD_BUZON !== 'undefined') SGADD_BUZON.sincronizar();
    }).catch(function () {});
  }

  /* ---------------------------------------------------------------------
     Cambio de categoria.

     La capa de datos vieja (Principal, Jugadores, 4 Factores, Scouting) y el
     nucleo SGADD (Equipos, Diagnostico) leen de la MISMA planilla. Cuando el
     usuario cambia de categoria hay que refrescar las dos y repintar.
     --------------------------------------------------------------------- */
  window.onCategoriaCambiada = async function (idPlanilla) {
    const p = SGADD.planilla(idPlanilla);
    if (!p || !(p.slug || p.sheetId)) return;
    PLANILLA_ACTIVA = p;

    /* EL CARTEL SOLO EN PRINCIPAL, y esto es un fix, no un detalle.

       Este handler es de la capa de datos VIEJA, que solo usa Principal.
       Pisaba `#view-root` con "Cambiando de categoria..." aunque el DT
       estuviera en Equipos o Jugadores, y ahí se lleva puesta la BARRA:
       mientras baja la planilla nueva no hay selector en pantalla, así
       que no se puede volver atrás ni elegir otra. Si además la carga
       tardaba, la sección quedaba muda y sin controles — el "se traba y
       no puedo usarla" que reportó el club. Con Primera no se notaba
       porque ya estaba cacheada y volvía en el acto.

       Las secciones SGADD ya muestran su propio estado sin perder la
       barra: pintan "Cargando la categoría…" DEBAJO del selector. */
    if (currentSection === 'principal') {
      const root = document.getElementById('view-root');
      if (root) root.innerHTML = '<div class="card rounded-xl p-8 border border-hairline text-center text-muted text-sm">Cambiando de categoria...</div>';
    }

    lastErrors = await fetchAllData();
    renderSection(currentSection);
    precargarLogos();
  };

  window.addEventListener('hashchange', () => {
    const h = window.location.hash || '#principal';
    // Las rutas de SGADD son #/planilla/fase/seccion/... y las maneja su modulo.
    if (h.indexOf('#/') === 0) {
      const r = SGADD.Ruta.parse(h);
      if (r.seccion === 'equipos') {
        if (currentSection !== 'equipos') navigate('equipos');
        else { equiposLeerRuta(); equiposPintar(); }
      } else if (r.seccion === 'jugadores') {
        if (currentSection !== 'jugadores') navigate('jugadores');
        else { jugadoresLeerRuta(); jugadoresPintar(); }
      } else if (r.seccion === 'simulador') {
        if (currentSection !== 'simulador') navigate('simulador');
        else { simuladorLeerRuta(); simuladorPintar(); }
      } else if (r.seccion === 'principal' && currentSection !== 'principal') {
        navigate('principal');
      }
      return;
    }
    const sec = h.replace('#', '');
    if (VALID_SECTIONS.includes(sec)) navigate(sec);
  });

  /* Rotar el telefono cambia de breakpoint, pero Chart.js ya congelo las
     opciones. Re-renderizamos SOLO al cruzar un corte, no en cada pixel. */
  let bucketPrevio = BP.bucket();
  let tResize;
  window.addEventListener('resize', () => {
    clearTimeout(tResize);
    tResize = setTimeout(() => {
      const b = BP.bucket();
      if (b !== bucketPrevio) {
        bucketPrevio = b;
        if (b > 0) closeSidebar();
        renderSection(currentSection);
      }
    }, 220);
  });

  /* En touch no existe el mouseleave: sin esto el equipo resaltado queda pegado. */
  document.addEventListener('touchstart', (e) => {
    if (equipoDestacado >= 0 && !(e.target && e.target.id === 'ortgDrtgChart')) removeHighlight();
  }, { passive: true });

  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') { closeSidebar(); removeHighlight(); }
  });
}

/* Un unico punto de arranque. Los logos se resuelven despues, cuando ya
   conocemos los nombres de los equipos que vinieron de la planilla. */
if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', init);
} else {
  init();
}
</script>
<!-- La pantalla de ingreso vive al final del body y NO dentro del header:
     es un modal a pantalla completa, y adentro del grupo flex del header
     quedaba encajonado en una columna de cien pixeles. -->
<div id="loginSlot"></div>

</body>
</html>
