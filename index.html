      display: grid !important;
      grid-template-columns: repeat(auto-fit, minmax(38mm, 1fr));
      gap: 2mm 5mm;
      padding: 2mm 0 3mm;
      margin-bottom: 3mm;
      border-bottom: 1px solid #282828;
    }
  }

  /* Insignia de respaldo cuando un equipo no tiene escudo resuelto. Sin
     esto el informe quedaba sin ninguna marca del equipo — pasa siempre que
     el manifiesto de logos no se pueda leer (por ejemplo abriendo el panel
     como file://, donde el fetch del indice lo bloquea CORS). */
  .escudo-iniciales {
    display: inline-grid; place-items: center;
    border-radius: 50%;
    background: #1c1c1f; border: 1px solid #333;
    color: #a8b0bd; font-weight: 700; line-height: 1;
    letter-spacing: .02em;
  }

  .card { background: #141414; border: 1px solid #282828; transition: border-color .15s ease; }
  .card:hover { border-color: #3a3a3a; }

  table thead th { position: sticky; top: 0; background: #141414; z-index: 1; }

  /* LOS ENCABEZADOS YA IBAN CENTRADOS, y esto conviene dejarlo anotado.

     La regla de arriba (`table th, table td`) los centra desde siempre.
     Las tablas que se veian desalineadas —la de posiciones, la de la
     captura que llego— lo estaban porque pedian `text-left` a mano en la
     clase de TODAS sus cabeceras, y una clase le gana a un selector de
     elemento.

     Se corrigio ahi, en `sgadd-clasificacion.js`, decidiendo la
     alineacion por columna. Una regla nueva con mas especificidad habria
     tapado el sintoma y de paso pisado a cualquier tabla que pida la
     izquierda a proposito. */
  tbody tr { transition: background-color .1s ease; }
  tbody tr:hover { background: #1b1b1b; }
  tbody tr:hover td:first-child { box-shadow: inset 3px 0 0 var(--acento); }

  /* SELECCION DE TEXTO · el resalte tiene que dejar LEER lo seleccionado.

     Pintaba `var(--acento)` crudo con texto casi negro encima, y eso
     depende de cuan oscura sea la marca del cliente. Medido:

         Reconquista  #f7941e   8,68  pasa
         Jujuy        #2563eb   3,83  no llega
         DEPORTIVO    #09086E   1,20  ilegible

     `--acento-fondo` es exactamente el token que resuelve esto: se
     calcula aclarando la marca hasta que el texto oscuro de encima pase
     4,5 (punto 15). Con el: 8,25 / 4,73 / 4,76. */
  ::selection {
    background: var(--acento-fondo, var(--acento));
    color: #0B1121;
  }
  input:focus-visible, button:focus-visible, select:focus-visible, [tabindex]:focus-visible {
    outline: 2px solid var(--acento); outline-offset: 2px;
  }

  @keyframes spin-slow { to { transform: rotate(360deg); } }
  .animate-spin-slow { animation: spin-slow .9s linear infinite; }

  /* =====================================================================
     ZONAS DE LA TABLA DE POSICIONES

     Los cinco tonos de `SGADD_CONFIG.TONOS`, uno por clase. Van a mano y
     no con utilidades de Tailwind por dos motivos: la tabla la inyecta un
     nodo dinamico —la trampa del punto 12— y, sobre todo, porque el tono
     tiene que CAMBIAR en el papel. Un color de pantalla sobre hoja blanca
     no se lee, y el aplanado de impresion pisa cualquier color inline.

     Los diez valores estan medidos contra el fondo que les toca y los diez
     pasan 4.5 (WCAG AA). Hay un test que los recalcula. */
  .zona-exito    { --zona: #4ade80; }
  .zona-positivo { --zona: #5eead4; }
  .zona-aviso    { --zona: #fbbf24; }
  .zona-peligro  { --zona: #f87171; }
  .zona-neutro   { --zona: #94a3b8; }

  /* El puesto lleva una barra del color de su zona en la primera celda.
     Va en el <td> y no en el <tr>: en una tabla el fondo de la celda tapa
     el de la fila, asi que una regla sobre el <tr> se aplica, se ve en el
     getComputedStyle y NO se ve en pantalla (punto 14). */
  tr[class*="zona-"] > td:first-child {
    box-shadow: inset 3px 0 0 0 var(--zona);
  }
  .zona-punto {
    display: inline-block; width: .5rem; height: .5rem;
    border-radius: 9999px; background: var(--zona);
  }
  .zona-texto { color: var(--zona); }

  /* EN PAPEL EL TONO CAMBIA, no se atenua. Los valores de pantalla estan
     elegidos contra la card oscura y sobre hoja blanca no se leen: el verde
     #4ade80 da 1,6 sobre blanco. Se reemplazan por la variante oscura del
     mismo tono, que es exactamente la misma decision que ya tomo
     `scoutTono()` para el semaforo del informe (punto 7.6).

     El `!important` del color es obligatorio: el aplanado del papel hace
     `body * { color: #111 !important }` y sin el la zona sale negra. Gana
     por especificidad (0,1,0 contra 0,0,1), no por orden. */
  @media print {
    .zona-exito    { --zona: #15803d; }
    .zona-positivo { --zona: #0f766e; }
    .zona-aviso    { --zona: #8a5206; }
    .zona-peligro  { --zona: #b91c1c; }
    .zona-neutro   { --zona: #475569; }
    .zona-texto    { color: var(--zona) !important; }
    /* `box-shadow` no se imprime si el navegador descarta fondos, asi que
       la barra del puesto pasa a borde, que si sobrevive. */
    tr[class*="zona-"] > td:first-child {
      box-shadow: none;
      border-left: 3px solid var(--zona) !important;
    }
  }

  /* La campana sin nada pendiente se atenúa en vez de desaparecer: la
     ausencia de alertas se nota igual, pero el control sigue estando
     para buscar un jugador y marcarle el estado a mano. */
  .buzon-quieto { opacity: .45; }
  /* =====================================================================
     ESCUDOS · disco con borde fino

     Los escudos vienen de fuentes distintas y con fondos distintos (unos
     con transparencia, otros con blanco pegado). Sin un contenedor comun
     la grilla se ve despareja. El disco los iguala y el borde los separa
     de la card sin competir con el acento del club.

     Va a mano y no con utilidades de Tailwind porque lo inyectan nodos
     dinamicos: el scan del generador es estatico (punto 5 bis).
     ===================================================================== */
  .escudo-aro {
    display: grid; place-items: center;
    border-radius: 9999px;
    border: 1px solid #374151;
    background: rgba(255, 255, 255, .04);
    overflow: hidden;
    transition: border-color .2s ease, background-color .2s ease;
  }
  /* LA IMAGEN SE ENCOGE AL ARO, no al reves.

     El aro recorta (`overflow: hidden`) porque un escudo rectangular con
     fondo propio necesita la mascara circular. Pero sin acotar la imagen,
     un archivo mas grande que la caja se sale y el aro le come las puntas
     — se vio con el logo de MotorStats, cuya grafica llega al borde del
     lienzo, y con los escudos que traen texto abajo.

     `object-fit: contain` mas `max-width/height: 100%` garantizan que
     entre entera SIEMPRE, sea cual sea el tamaño del archivo, y el
     `box-sizing` hace que el padding descuente en vez de sumar. */
  .escudo-aro > img {
    padding: 2px;
    box-sizing: border-box;
    max-width: 100%; max-height: 100%;
    width: auto; height: auto;
    object-fit: contain;
  }

  /* HOVER de las cards de equipo. `box-shadow` y no `filter: brightness`:
     el filtro afecta al texto de adentro y con los tonos de zona eso
     rompe el contraste que el punto 15 deja medido. El resplandor usa el
     acento del club, asi que cada cliente se ilumina con SU color. */
  .card-equipo {
    transition: border-color .2s ease, box-shadow .25s ease, transform .2s ease;
  }
  .card-equipo:hover,
  .card-equipo:focus-visible {
    border-color: var(--acento-fondo, var(--acento));
    box-shadow: 0 0 0 1px var(--acento-fondo, var(--acento)),
                0 6px 22px -8px var(--acento-fondo, var(--acento));
  }
  .card-equipo:hover .escudo-aro,
  .card-equipo:focus-visible .escudo-aro {
    border-color: var(--acento-fondo, var(--acento));
    background: rgba(255, 255, 255, .08);
  }
  /* Con movimiento reducido no hay transicion, pero el borde SI cambia:
     el feedback no puede depender solo de la animacion. */
  @media (prefers-reduced-motion: reduce) {
    .card-equipo, .escudo-aro { transition: none !important; }
  }

  /* El disco de espera de las secciones. Va a mano y no con utilidades de
     Tailwind porque lo inyecta `SGADD_UI.cargando()` en un nodo dinámico y
     el JIT del CDN no genera clases para eso — la trampa del punto 12. */
  .cargando-disco {
    width: 2rem; height: 2rem; border-radius: 9999px;
    border: 2px solid #374151;   /* el mismo `hairline` de la config de Tailwind */
    border-top-color: var(--acento-texto, var(--acento, #f7941e));
    animation: spin-slow .9s linear infinite;
  }
  /* Con movimiento reducido el disco se queda quieto en vez de parpadear:
     la regla global lleva la duración a 0.001ms y una animación infinita a
     esa velocidad titila. El texto de al lado sigue diciendo qué pasa. */
  @media (prefers-reduced-motion: reduce) {
    .cargando-disco, .animate-spin-slow { animation: none !important; }
  }

  /* overflow-hidden del contenedor pisaba el scroll horizontal: las tablas
     anchas quedaban CORTADAS en mobile en vez de scrollear. */
  .scrollbox {
    overflow-x: auto !important;
    overflow-y: hidden;
    -webkit-overflow-scrolling: touch;
    overscroll-behavior-x: contain;
  }

  /* Alturas de graficos por breakpoint */
  .chart-box { position: relative; width: 100%; height: 520px; }
  .chart-box.is-md { height: 420px; }
  .chart-box.is-sm { height: 380px; }
  @media screen and (max-width: 1023px) {
    .chart-box { height: 440px; }
    .chart-box.is-md { height: 380px; }
    .chart-box.is-sm { height: 340px; }
  }
  @media screen and (max-width: 767px) {
    .chart-box { height: 400px; }
    .chart-box.is-md { height: 320px; }
    .chart-box.is-sm { height: 300px; }
  }
  @media screen and (max-width: 479px) {
    .chart-box { height: 360px; }
    .chart-box.is-md { height: 280px; }
    .chart-box.is-sm { height: 260px; }
  }

  /* Primera columna fija: sin esto perdes de vista que jugador estas mirando
     apenas scrolleas la tabla a lo ancho.

     VA EN `screen` Y NO A SECAS, y esto costó una tarde: al imprimir, Chrome
     evalua las media queries contra el ANCHO DE HOJA del dialogo —A4 vertical
     con margenes por defecto da ~717px, o sea MENOS de 767— asi que la regla
     se activaba en el papel. Ahi no hay scroll horizontal que justifique la
     columna fija, y su `background: #141414` pintaba la primera columna de
     NEGRO: los nombres, ya aplanados a #111 por el papel blanco, quedaban
     invisibles. Se veia en la tabla de marcas del scouting y en los dos box
     scores del post-partido, en cualquier club.

     Los PDF que se auditaron antes no lo mostraban porque se generaban con
     `printToPDF` y margenes en 0, que da una hoja mas ancha que 767px y nunca
     entraba en esta rama. Auditar con el papel del dialogo, no con el de la
     automatizacion. */
  @media screen and (max-width: 767px) {
    .scrollbox table th:first-child,
    .scrollbox table td:first-child {
      position: sticky; left: 0; z-index: 2;
      background: #141414;
      box-shadow: 1px 0 0 #282828;
    }

    /* LA BARRA DE ZONA SE PERDIA EN CELULAR, y no era el color: era la
       PROPIEDAD.

       La barra del puesto se pinta con `box-shadow: inset` sobre el
       `td:first-child` (ver la regla de `.zona-*` arriba). La columna
       fija de celular usa `box-shadow` TAMBIEN, para su separador — y
       como es la misma propiedad y esta regla viene despues en el
       documento, la pisaba entera.

       En escritorio no pasa porque esta media query no se activa, y por
       eso el bug se veia SOLO en el telefono.

       Se arregla combinando las dos sombras en vez de elegir una: la
       barra de zona adentro, el separador de la columna fija afuera. */
    .scrollbox tr[class*="zona-"] > td:first-child {
      box-shadow: inset 3px 0 0 0 var(--zona), 1px 0 0 #282828;

function normalizeText(s) {
  return (s === null || s === undefined ? '' : String(s))
    .normalize('NFD').replace(/[\u0300-\u036f]/g, '')
    .trim().toUpperCase();
}

function escapeHtml(str) {
  return String(str === null || str === undefined ? '' : str).replace(/[&<>"']/g, (m) => (
    { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[m]
  ));
}
function escapeAttr(str) { return escapeHtml(str).replace(/`/g, '&#96;'); }

function toNumber(v) {
  if (v === null || v === undefined || v === '') return null;
  if (typeof v === 'number') return Number.isFinite(v) ? v : null;
  const n = parseFloat(String(v).replace(',', '.'));
  return Number.isFinite(n) ? n : null;
}

function findColumnLabel(cols, candidates) {
  if (!cols || !cols.length) return null;
  const normalized = cols.map((c) => ({ label: c.label, norm: normalizeText(c.label) }));
  for (const cand of candidates) {
    const nc = normalizeText(cand);
    const hit = normalized.find((c) => c.norm === nc);
    if (hit) return hit.label;
  }
  for (const cand of candidates) {
    const nc = normalizeText(cand);
    const hit = normalized.find((c) => c.norm.includes(nc));
    if (hit) return hit.label;
  }
  return null;
}

function countDistinct(rows, label) {
  if (!label) return rows.length;
  const set = new Set(rows.map((r) => normalizeText(r.formatted[label])).filter((v) => v !== ''));
  return set.size;
}

function sortRows(rows, label, dir) {
  if (!label) return rows;
  const sample = rows.find((r) => r.values[label] !== null && r.values[label] !== undefined && r.values[label] !== '');
  const isNumeric = sample ? toNumber(sample.values[label]) !== null : false;
  const sorted = [...rows].sort((a, b) => {
    if (isNumeric) {
      const na = toNumber(a.values[label]);
      const nb = toNumber(b.values[label]);
      if (na === null && nb === null) return 0;
      if (na === null) return 1;
      if (nb === null) return -1;
      return na - nb;
    }
    const sa = (a.formatted[label] ?? '').toString();
    const sb = (b.formatted[label] ?? '').toString();
    return sa.localeCompare(sb, 'es');
  });
  return dir === 'desc' ? sorted.reverse() : sorted;
}

function isEquipoTipo(row) {
  return Object.values(row.formatted).some(v => normalizeText(v) === 'EQUIPO TIPO');
}

function filterRows(rows, term) {
  let filtered = rows.filter(r => !isEquipoTipo(r));
  if (!term) return filtered;
  const t = normalizeText(term);
  return filtered.filter((r) => Object.values(r.formatted).some((v) => normalizeText(v).includes(t)));
}

/* =====================================================================
   EL TRAMO TAMBIÉN MANDA ACÁ

   Esta capa de datos es anterior al adaptador y leía el libro ENTERO, sin
   scopear por torneo. Con DEPORTIVO, que trae Ida y Vuelta en el mismo
   libro, eso daba dos respuestas distintas a la misma pregunta:

     barra superior (índice scopeado)  →  12 equipos · 64 partidos · 208 jug
     Principal (esta capa, sin scope)  →  12 equipos · 76 partidos · 218 jug

   76 = 64 de Ida + 12 de Vuelta. Los dos números eran ciertos y se
   contradecían en la misma pantalla. Ya había pasado con el U23, donde el
   encabezado decía 0 partidos y el resumen 82.

   Se filtra acá, en el único punto por donde pasan todos los consumidores,
   con las mismas tres reglas del núcleo:
     · sin columna TORNEO no se filtra por torneo (planilla pre-v44);
     · una fila SIN torneo pasa siempre, aunque se esté filtrando;
     · la fila TIPO pasa siempre: es la mediana de la liga, no un equipo.
   ===================================================================== */
function tramoActivo() {
  if (typeof SGADD_APP === 'undefined' || !SGADD_APP.estado) return null;
  const e = SGADD_APP.estado;
  if (!e.fase) return null;
  return { torneo: e.torneo || null, fase: String(e.fase).toUpperCase() };
}

function scoparTramo(d) {
  const t = tramoActivo();
  if (!t || !d || !d.rows || !d.rows.length) return d;
  const etiquetas = (d.cols || []).map(c => String(c.label || '').toUpperCase());
  const hayFase = etiquetas.indexOf('FASE') !== -1;
  const hayTorneo = etiquetas.indexOf('TORNEO') !== -1;
  if (!hayFase && !hayTorneo) return d;

  const dato = (r, col) => {
    const v = (r.formatted && r.formatted[col] !== undefined) ? r.formatted[col]
      : (r.values ? r.values[col] : '');
    return String(v === null || v === undefined ? '' : v).trim().toUpperCase();
  };
  const esTipo = (r) => Object.values(r.formatted || {})
    .some(v => /^\s*(EQUIPO|JUGADOR)\s+TIPO\s*$/i.test(String(v || '')));

  const rows = d.rows.filter(r => {
    if (esTipo(r)) return true;
    if (hayFase) { const f = dato(r, 'FASE'); if (f && f !== t.fase) return false; }
    /* El TOTAL de una fase NO filtra por torneo: los quiere a todos. Sin
       esta rama el centinela `*TOTAL*` se compara contra el nombre real
       de cada fila, no coincide con ninguna, y la pantalla queda en cero
       filas — que es exactamente lo que pasó al sumarlo. */
    const totalDeFase = (typeof SGADD !== 'undefined' && SGADD.esTotal)
      ? SGADD.esTotal(t.torneo) : String(t.torneo || '') === '*TOTAL*';
    if (hayTorneo && t.torneo && t.torneo !== 'GENERAL' && !totalDeFase) {
      const tt = dato(r, 'TORNEO');
      if (tt && tt !== String(t.torneo).toUpperCase()) return false;
    }
    return true;
  });
  return { cols: d.cols, rows: rows, error: d.error };
}

function sheet(key) {
  return scoparTramo(DATA[key] || { cols: [], rows: [], error: 'Sin datos' });
}

function cleanName(name) {
  if (!name) return '';
  // "- MM", "- U21M", "- U15F": el sufijo de categoria no aporta en pantalla.
  return String(name).replace(/\s*-\s*(MM|MF|U\d{1,2}\s*[MF]?)\s*$/i, '').replace(/\s*-\s*MM/g, '').trim();
}

/* ============ MÓDULO LOGOS (hosting estático) ============ */
/*
  CONTEXTO: la app corre en GitHub Pages. No hay backend. `google.script.run`
  NO EXISTE fuera del sandbox de HtmlService, así que todo el approach de
  base64-desde-Drive es inaplicable acá. Este módulo resuelve logos por HTTP.

  Cascada de proveedores, primero que responde gana:
    0) CFG.overrides       -> mapa manual nombre -> URL (casos raros)
    1) CFG.jsonpUrl        -> Apps Script publicado como API JSONP (opcional,
                              mantiene el workflow "tiro el PNG en Drive")
    2) CFG.basePath        -> archivos del propio repo por convención de slug
                              (RECOMENDADO: mismo origen, cachea el browser,
                               no ensucia el canvas, cero latencia de Drive)
    3) null                -> el plugin dibuja el fallback de iniciales

  Agregar un equipo nuevo = subir `logos/<slug>.png` al repo. Nada más.
*/
const LOGOS = (function () {

  const CFG = {
    /* Pozo compartido + override por liga. Dos ciudades tienen rivales
       distintos, y hay nombres que se repiten entre ligas (hay un Atenas
       en media Argentina). El de la liga gana; el generico es el respaldo.
       CLUB.aplicar() reemplaza esta lista segun el JSON del club. */
    /* Default que funciona SOLO, sin config externa. Busca primero en la
       carpeta de la liga y despues en el pozo compartido, asi anda con la
       estructura vieja y con la nueva. CLUB lo sobreescribe si carga. */
    basePaths: ['logos/la-plata/', 'logos/'],

    /* Sufijos de categoria a descartar del nombre del equipo. Son una
       convencion DE CADA LIGA, no una regla universal:
         La Plata      "ATENAS 'A' - MM", "RECONQUISTA 'A' - U21M"
         Liga Argentina  puede no tener ninguno, u otro formato
       El JSON del club los sobreescribe con `sufijosEquipo`. */
    sufijos: ["\\s*-\\s*(MM|MF|U\\d{1,2}\\s*[MF]?)\\s*$"],
    extensiones: ['png', 'webp', 'jpg', 'jpeg', 'jfif', 'avif', 'svg', 'gif'],
    // Dejalo en '' para desactivar. Si lo usás: URL /exec del Web App.
    jsonpUrl: '',
    jsonpTimeout: 8000,
    overrides: {
      // "NAUTICO ENSENADA": "logos/nautico.png",
    },
  };

  const DEFAULT_LOGO = "data:image/svg+xml;charset=utf-8,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 24 24%22 fill=%22%239CA3AF%22%3E%3Cpath d=%22M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5%22%3E%3C/path%3E%3C/svg%3E";

  const cache = new Map();      // CLAVE -> { img: HTMLImageElement|null, url: string|null }
  const alResolverFns = [];     // callbacks para repintar cuando llegan los escudos
  /* Cuántos escudos se resolvieron DESDE QUE ARRANCÓ la app. Es lo que
     distingue "llegaron escudos nuevos" de "se releyó el caché", y lo que
     corta el ciclo infinito descrito en `resolver()`. */
  let resueltos = 0;
  const enVuelo = new Map();    // CLAVE -> Promise
  let mapaRemoto = null;        // CLAVE -> URL (del JSONP)
  let promesaRemota = null;

  /* ---------- normalización y slugs ---------- */

  /* Quita los sufijos de categoria configurados para la liga del club.
     Sin esto, el mismo club es una entidad distinta en cada categoria y su
     escudo no matchea: "RECONQUISTA 'A' - U21M" buscaria reconquista-a-u21m. */
  function quitarSufijos(t) {
    (CFG.sufijos || []).forEach((pat) => {
      try { t = t.replace(new RegExp(pat, 'i'), ''); } catch (e) {}
    });
    return t;
  }

  function normalizar(s) {
    const base = String(s === null || s === undefined ? '' : s)
      .normalize('NFD').replace(/[\u0300-\u036f]/g, '')
      .toUpperCase();
    return quitarSufijos(base)
      .replace(/[^A-Z0-9]+/g, ' ')
      .trim();
  }

  function slug(s) {
    return normalizar(s).toLowerCase().replace(/\s+/g, '-');
  }

  /*
    Candidatos de nombre de archivo, de más específico a más laxo.
    "ESTUDIANTES DE LA PLATA 'A'" ->
      estudiantes-de-la-plata-a / estudiantes_de_la_plata_a / estudiantesdelaplataa
      + primeras 2 palabras: estudiantes-de / estudiantes
  */
  function nombresArchivo(nombreEquipo) {
    const base = slug(nombreEquipo);
    if (!base) return [];
    const partes = base.split('-').filter(Boolean);
    const out = [base, base.replace(/-/g, '_'), base.replace(/-/g, '')];

    // Sin las iniciales sueltas: "C F GONNET" -> "gonnet", "CLUB A BANFIELD" -> "club-banfield"
    const largas = partes.filter(t => t.length > 1);
    if (largas.length && largas.length < partes.length) {
      out.push(largas.join('-'), largas.join(''));
    }

    // Recortes por delante y por detras: el nombre distintivo puede estar
    // en cualquier punta ("NAUTICO ensenada" vs "c f GONNET").
    if (partes.length > 2) out.push(partes.slice(0, 2).join('-'), partes.slice(-2).join('-'));
    if (partes.length > 1) out.push(partes[0], partes[partes.length - 1]);
    if (largas.length > 1) out.push(largas[largas.length - 1], largas[0]);

    return out.filter(v => v && v.length > 1).filter((v, i, a) => a.indexOf(v) === i);
  }

  function candidatos(nombreEquipo) {
    const urls = [];
    const clave = normalizar(nombreEquipo);

    // 0) override manual
    const ovKey = Object.keys(CFG.overrides).find(k => normalizar(k) === clave);
    if (ovKey) urls.push(CFG.overrides[ovKey]);

    // 1) mapa remoto (JSONP) — match exacto y después contención
    if (mapaRemoto) {
      if (mapaRemoto[clave]) {
        urls.push(mapaRemoto[clave]);
      } else {
        let mejor = null, len = 0;
        Object.keys(mapaRemoto).forEach((k) => {
          if ((clave.indexOf(k) !== -1 || k.indexOf(clave) !== -1) && k.length > len) {
            mejor = k; len = k.length;
          }
        });
        if (mejor) urls.push(mapaRemoto[mejor]);
      }
    }

    // 2) archivos del repo por convención.
    //    Tanda 1 = nombre exacto (acierta el 90% de las veces).
    //    Tanda 2 = variantes y recortes, solo si la 1 no dio nada.
    const nombres = nombresArchivo(nombreEquipo);
    const rutas = CFG.basePaths || ['logos/'];
    const tanda1 = [], tanda2 = [];
    nombres.forEach((n, i) => {
      rutas.forEach((base, r) => {
        CFG.extensiones.forEach((ext) => {
          // Tanda 1: nombre exacto en la carpeta de la liga.
          (i === 0 && r === 0 ? tanda1 : tanda2).push(base + n + '.' + ext);
        });
      });
    });

    return [urls.concat(tanda1), tanda2];
  }

  /* Prueba un lote de URLs EN PARALELO y devuelve la de menor indice que cargo. */
  async function primeraQueCargue(urls) {
    if (!urls.length) return null;
    const res = await Promise.all(urls.map(u =>
      cargarImagen(u).then(img => ({ img: img, url: u })).catch(() => null)
    ));
    return res.find(Boolean) || null;
  }

  /* ---------- carga ---------- */

  function cargarImagen(url) {
    return new Promise((resolve, reject) => {
      const img = new Image();
      // Sin crossOrigin: los assets del repo son mismo-origen y Drive no manda
      // CORS. Si algún día exportás el canvas a PNG, pasá TODO a assets locales.
      img.onload = () => (img.naturalWidth > 0 ? resolve(img) : reject(new Error('vacía')));
      img.onerror = () => reject(new Error('404 ' + url));
      img.src = url;
    });
  }

  function cargarJsonp(url) {
    return new Promise((resolve, reject) => {
      const cb = '__logosCb_' + Math.random().toString(36).slice(2);
      const script = document.createElement('script');
      const limpiar = () => { delete window[cb]; script.remove(); };
      const guarda = setTimeout(() => { limpiar(); reject(new Error('JSONP timeout')); }, CFG.jsonpTimeout);

      window[cb] = (data) => { clearTimeout(guarda); limpiar(); resolve(data); };
      script.onerror = () => { clearTimeout(guarda); limpiar(); reject(new Error('JSONP error')); };
      script.src = url + (url.indexOf('?') === -1 ? '?' : '&') + 'callback=' + cb;
      document.head.appendChild(script);
    });
  }

  function asegurarMapaRemoto() {
    if (!CFG.jsonpUrl) return Promise.resolve(null);
    if (promesaRemota) return promesaRemota;

    promesaRemota = cargarJsonp(CFG.jsonpUrl)
      .then((resp) => {
        const dict = (resp && resp.logos) ? resp.logos : (resp || {});
        mapaRemoto = {};
        Object.keys(dict).forEach((k) => { mapaRemoto[normalizar(k)] = dict[k]; });
        console.log('[LOGOS] mapa remoto:', Object.keys(mapaRemoto).length, 'equipos');
        return mapaRemoto;
      })
      .catch((e) => {
        console.warn('[LOGOS] sin mapa remoto (' + e.message + '), voy con archivos locales');
        mapaRemoto = null;
        return null;
      });

    return promesaRemota;
  }

  /* ---------------------------------------------------------------------
     MANIFIESTO (opcional). Sin el, por cada equipo probamos 8 extensiones x
     2 carpetas: hasta 190 pedidos, casi todos 404. Con un archivo
     logos/<liga>/index.json que liste los nombres reales, es UN pedido.

       { "astillero": "astillero.webp", "c f gonnet": "gonnet.jfif" }

     La clave se normaliza igual que los nombres de equipo, asi que la podes
     escribir como quieras. Si el archivo no existe, se prueba a mano igual
     que antes y no cambia nada.
     --------------------------------------------------------------------- */
  let manifiesto = null, promesaManifiesto = null;
  let manifiestoRoto = [];

  function cargarManifiesto() {
    if (promesaManifiesto) return promesaManifiesto;
    const base = (CFG.basePaths || ['logos/'])[0];
    promesaManifiesto = fetch(base + 'index.json', { cache: 'no-cache' })
      .then(r => (r.ok ? r.json() : null))
      .then(j => {
        manifiesto = {};
        if (j) {
          Object.keys(j).forEach(k => { manifiesto[normalizar(k)] = base + j[k]; });
          console.log('[LOGOS] manifiesto:', Object.keys(manifiesto).length, 'escudos');
        }
        return manifiesto;
      })
      .catch((e) => {
        // No romper si no hay manifiesto, pero NUNCA en silencio.
        console.warn('[LOGOS] sin manifiesto:', e && e.message ? e.message : e);
        manifiesto = {}; return manifiesto;
      });
    return promesaManifiesto;
  }

  async function resolverUno(nombreEquipo) {
    const clave = normalizar(nombreEquipo);
    if (!clave) return { img: null, url: null };
    if (cache.has(clave)) return cache.get(clave);
    if (enVuelo.has(clave)) return enVuelo.get(clave);

    const tarea = (async () => {
      await asegurarMapaRemoto();
      await cargarManifiesto();

      // Camino rapido: el manifiesto dice exactamente cual es el archivo.
      const enManifiesto = manifiesto && manifiesto[clave];
      if (enManifiesto) {
        try {
          const img = await cargarImagen(enManifiesto);
          const r = { img: img, url: enManifiesto };
          cache.set(clave, r); if (r.img) resueltos++;
          return r;
        } catch (e) {
          /* El manifiesto apunta a un archivo que no existe. Seguimos
             sondeando para no romper, pero AVISAMOS: un manifiesto con
             nombres inventados es peor que no tenerlo, porque suma un
             pedido fallido por equipo antes del sondeo. */
          manifiestoRoto.push(clave + ' → ' + enManifiesto.replace((CFG.basePaths || [''])[0], ''));
        }
      }

      const tandas = candidatos(nombreEquipo);
      for (let i = 0; i < tandas.length; i++) {
        const hit = await primeraQueCargue(tandas[i]);
        if (hit) { cache.set(clave, hit); resueltos++; return hit; }
      }
      const r = { img: null, url: null };
      cache.set(clave, r);
      return r;
    })();

    enVuelo.set(clave, tarea);
    tarea.finally(() => enVuelo.delete(clave));
    return tarea;
  }

  /**
   * Resuelve un lote de equipos. Devuelve Promise<{encontrados, faltantes[]}>.
   * Llamalo con los nombres que salen de la planilla, no antes.
   */
  async function resolver(nombres) {
    const resueltosAlEmpezar = resueltos;
    const unicos = Array.from(new Set((nombres || []).map(n => String(n || '')).filter(Boolean)));
    const res = await Promise.all(unicos.map(resolverUno));
    const faltantes = unicos.filter((n, i) => !res[i].img);
    if (faltantes.length) {
      console.warn('[LOGOS] sin archivo (' + faltantes.length + '/' + unicos.length + '):', faltantes);
      console.warn('[LOGOS] esperaba, por ejemplo:', (CFG.basePaths || ['logos/'])[0] + slug(faltantes[0]) + '.png');
    } else if (unicos.length) {
      console.log('[LOGOS] ' + unicos.length + '/' + unicos.length + ' logos OK');
    }
    /* SE AVISA SOLO SI LLEGÓ ALGO NUEVO, y esto arregla un cuelgue total
       de la página.

       El hook existe porque los escudos llegan DESPUÉS del primer
       pintado y hay que repintar. Pero avisar SIEMPRE cierra un ciclo:

         drawOrtgDrtgChart() → LOGOS.resolver() → alResolverFns →
         renderSection('principal') → drawOrtgDrtgChart() → …

       Con todo ya en caché, esas promesas resuelven en microtasks y el
       bucle NUNCA cede el hilo: Chrome muestra "la página no responde".
       Se disparaba al CAMBIAR de categoría —ahí el callback ya está
       registrado— y no en el arranque, que es justo lo que se veía.

       Si no entró ningún escudo nuevo no hay nada que repintar, así que
       la segunda vuelta no avisa y el ciclo se corta solo. */
    if (resueltos !== resueltosAlEmpezar) {
      alResolverFns.forEach(fn => { try { fn(); } catch (e) { console.warn('[LOGOS]', e); } });
    }

    if (manifiestoRoto.length) {
      console.warn('[LOGOS] el manifiesto apunta a ' + manifiestoRoto.length +
        ' archivo(s) que NO existen. Regeneralo desde Diagnóstico:', manifiestoRoto);
    }
    return {
      encontrados: unicos.length - faltantes.length, total: unicos.length,
      faltantes: faltantes, manifiestoRoto: manifiestoRoto.slice(),
    };
  }

  /* ---------- lectura sincrónica (para el render loop) ---------- */

  function getImage(nombreEquipo) {
    const r = cache.get(normalizar(nombreEquipo));
    return (r && r.img && r.img.complete && r.img.naturalWidth > 0) ? r.img : null;
  }

  function getUrl(nombreEquipo) {
    const r = cache.get(normalizar(nombreEquipo));
    return (r && r.url) ? r.url : null;
  }

  function iniciales(nombre) {
    return String(nombre || '?')
      .split(/\s+/).filter(Boolean).slice(0, 2)
      .map(p => p.charAt(0).toUpperCase()).join('');
  }

  return {
    CFG, DEFAULT_LOGO,
    resolver, getImage, getUrl, iniciales,
    normalizar, slug,
    // Diagnóstico: LOGOS.debug() en la consola
    /* Genera el contenido de logos/<liga>/index.json con lo que YA se resolvio.
       Se usa una vez: se copia, se sube, y desde ahi la carga es instantanea. */
    /* Borra TODO el estado en memoria. Obligatorio al cambiar de club: dos
       ligas distintas pueden tener un "ATENAS" cada una, con escudos
       distintos, y la clave de cache es solo el nombre normalizado. */
    /** Se llama cada vez que termina una tanda de resolucion. */
    alResolver: (fn) => { if (typeof fn === 'function') alResolverFns.push(fn); },
    reset: () => {
      cache.clear();
      enVuelo.clear();
      manifiesto = null; promesaManifiesto = null; manifiestoRoto = [];
      mapaRemoto = null; promesaRemota = null;
      console.log('[LOGOS] cache limpiada');
    },
    /* Devuelve el JSON con los escudos YA resueltos. Si no hay ninguno, no
       devuelve "{}" mudo: dice por que. Un {} sin explicacion me costo dos
       vueltas de diagnostico. */
    generarManifiesto: () => {
      const base = (CFG.basePaths || ['logos/'])[0];
      const out = {};
      let n = 0;
      cache.forEach((v, k) => {
        if (v && v.url) { out[k.toLowerCase()] = String(v.url).replace(base, ''); n++; }
      });
      if (!n) {
        return '// Todavia no hay escudos resueltos en memoria.\n' +
               '// Entra a Principal o Equipos (ahi se resuelven), volve aca y apreta de nuevo.\n' +
               '// Si ya pasaste por esas secciones y sigue vacio, es que ningun archivo\n' +
               '// existe en ' + base;
      }
      return JSON.stringify(out, null, 2);
    },
    debug: () => {
      const filas = [];
      cache.forEach((v, k) => filas.push({ equipo: k, archivo: v.url || '— FALTA —' }));
      console.table(filas);
      return { resueltos: cache.size, jsonp: CFG.jsonpUrl || '(desactivado)', basePaths: CFG.basePaths };
    },
  };
})();

/* Compat con el código existente */
const DEFAULT_LOGO = LOGOS.DEFAULT_LOGO;
function getLogoUrl(teamName) { return LOGOS.getUrl(cleanName(teamName)) || DEFAULT_LOGO; }
function getTeamImage(teamName) { return LOGOS.getImage(cleanName(teamName)); }

/* Repinta la seccion actual cuando terminan de resolverse los escudos.

   Este es el "parpadeo": la seccion se pinta con getUrl() = null (iniciales)
   y nadie la volvia a pintar cuando los archivos terminaban de bajar. Por eso
   aparecian recien al salir y entrar. Se registra UNA sola vez. */
let repintadoRegistrado = false;
function registrarRepintadoPorLogos() {
  if (repintadoRegistrado || typeof LOGOS === 'undefined' || !LOGOS.alResolver) return;
  repintadoRegistrado = true;
  LOGOS.alResolver(() => {
    if (typeof CLUB !== 'undefined' && CLUB.reintentarEscudo) CLUB.reintentarEscudo();
    if (typeof currentSection !== 'undefined' && typeof renderSection === 'function') {
      renderSection(currentSection);
    }
  });
}

/* Resuelve los escudos de TODOS los equipos de la planilla, una sola vez.

   Antes esto vivia adentro de drawOrtgDrtgChart(), asi que solo pasaba si
   entrabas por Principal. Si ibas primero a Equipos, getUrl() devolvia null
   y no se veia ningun escudo; y al volver, otra vez a esperar. */
/**
 * Resuelve los escudos de todos los equipos del libro.
 *
 * LOS NOMBRES SALEN DEL ÍNDICE, con respaldo en la capa vieja.
 *
 * Antes salían SOLO de `sheet('promedios4f')`, o sea de la capa de datos
 * de Principal. Eso ataba la precarga de una pieza global —los escudos se
 * usan en Equipos, Jugadores, Scouting, Simulador y los cuatro PDF— al
 * render de UNA sección. Si esa cadena de fetch no había terminado, o si
 * la sección nunca se pintó, las demás quedaban sin escudos hasta que el
 * DT pasara por Principal.
 *
 * El índice es la fuente correcta: ya está scopeado al tramo, ya tiene el
 * nombre limpio de cada equipo y lo comparten todas las secciones. La
 * capa vieja queda como respaldo para el arranque, donde Principal puede
 * pintarse antes de que el índice esté armado.
 */
async function precargarLogos() {
  try {
    registrarRepintadoPorLogos();
    const nombres = nombresParaLogos();
    if (!nombres.length) return;

    const res = await LOGOS.resolver(nombres);
    if (typeof renderPanelLogosFaltantes === 'function') renderPanelLogosFaltantes(res.faltantes);
  } catch (e) { console.warn('[LOGOS] precarga omitida:', e); }
}

/** Los equipos del libro, del índice si está y de la hoja si todavía no. */
function nombresParaLogos() {
  const idx = (typeof SGADD_APP !== 'undefined' && SGADD_APP.estado)
    ? SGADD_APP.estado.idx : null;
  if (idx) {
    const del = idx.lista().map(e => e.nombre).filter(Boolean);
    if (del.length) return del;
  }
  const d = sheet('promedios4f');
  if (d.error || !d.rows.length) return [];
  const col = findColumnLabel(d.cols, ['EQUIPO', 'NOMBRE']);
  return d.rows.filter(r => !isEquipoTipo(r))
    .map(r => cleanName(r.formatted[col] || '')).filter(Boolean);
}

/* ============ CAPA DE DATOS DE PRINCIPAL ============ */

/* Baja las hojas que Principal necesita.

   Pide solo CUATRO de las nueve: llegó a pedir once y consumir cuatro,
   y las siete de más eran el 68% del volumen del arranque (punto 3). El
   recorte se conserva — con el backend, además, el servidor ya sabe
   cuáles mandar en texto y son exactamente estas. */
async function fetchAllData() {
  const p = SGADD_APP.planillaActual();
  PLANILLA_ACTIVA = p;
  if (!p) {
    DATA = {};
    return [{ key: 'todas', name: 'planilla', ok: false, error: 'No hay categoría activa.' }];
  }

  let r;
  try {
    r = await SGADD_DATA.cargarCategoria(p);
  } catch (err) {
    DATA = {};
    SHEETS_CONFIG.forEach(cfg => { DATA[cfg.key] = { cols: [], rows: [], error: err.message }; });
    return [{ key: 'todas', name: 'planilla', ok: false, error: (err && err.message) || String(err) }];
  }

  const nextData = {};
  const errors = [];
  SHEETS_CONFIG.forEach((cfg) => {
    /* `crudas` viene del backend (matrices de Sheets); con GViz no hay, y
       ahí se cae a la forma del índice — que no trae `formatted`, así que
       Principal formatea con lo que tiene. Es la degradación de la
       transición y desaparece cuando GViz se apague. */
    const cruda = r.crudas && r.crudas[cfg.name];
    if (cruda) {
      nextData[cfg.key] = SGADD_DATA.matrizALegacy(cruda, r.textos && r.textos[cfg.name]);
      return;
    }
    const hoja = r.hojas && r.hojas[cfg.name];
    if (hoja) {
      nextData[cfg.key] = legacyDesdeIndice(hoja);
      return;
    }
    nextData[cfg.key] = { cols: [], rows: [], error: 'La hoja no vino en la respuesta.' };
    errors.push({ key: cfg.key, name: cfg.name, ok: false, error: 'La hoja no vino en la respuesta.' });
  });

  DATA = nextData;
  lastUpdated = new Date();
  return errors;
}

/* Puente para el modo GViz: la forma del índice no trae `formatted`, así
   que se usa el valor crudo como texto. NO se inventa un formato — es
   exactamente lo que hacía GViz con una celda sin `f`. */
function legacyDesdeIndice(hoja) {
  const cols = (hoja.cols || []).map((label, k) => ({ id: 'c' + k, label: label, type: 'string' }));
  const rows = (hoja.filas || []).map(f => {
    const values = {}, formatted = {};
    (hoja.cols || []).forEach(c => {
      values[c] = (f[c] === undefined || f[c] === '') ? null : f[c];
      formatted[c] = (f[c] === null || f[c] === undefined) ? '' : String(f[c]);
    });
    return { values: values, formatted: formatted };
  });
  return { cols: cols, rows: rows };
}

function renderErrorCard(msg) {

}
function renderModernCard(title, value, subtitle, iconSvg) {

function buildTabs(section, tabs) {

}
function buildSelect(id, options, selected, onchange) {
  const opts = options.map((o) => `<option value="${escapeAttr(o)}" ${o === selected ? 'selected' : ''}>${escapeHtml(o)}</option>`).join('');
  return `<select id="${id}" onchange="${onchange}" class="w-full bg-surface2 border border-hairline rounded-md px-3 py-2 text-sm focus:border-accent outline-none">${opts}</select>`;

/* ============ TABLA GENÉRICA ============ */
function renderTable(tableId, sheetKey, opts = {}) {
  const data = sheet(sheetKey);
  if (data.error) return renderErrorCard(`${sheetKey}: ${data.error}`);
  if (!data.cols.length) return renderEmptyCard('Esta hoja no tiene columnas.');
  if (!data.rows.length) return renderEmptyCard('No hay filas para mostrar todavía.');

  const st = tableState[tableId] || (tableState[tableId] = { sortLabel: null, sortDir: 'asc', search: '' });
  let rows = filterRows(data.rows, st.search);
  if (st.sortLabel) rows = sortRows(rows, st.sortLabel, st.sortDir);
  const limit = opts.limit;
  const shownRows = limit ? rows.slice(0, limit) : rows;
  const cols = data.cols;

  const searchBox = opts.searchable === false ? '' : `
    <div class="mb-3">
      <input type="text" placeholder="Buscar…" value="${escapeAttr(st.search)}"
        oninput="onTableSearch('${tableId}', this.value)"
        data-focus-id="search-${tableId}"
        class="w-full md:w-72 bg-surface2 border border-hairline rounded-md px-3 py-2 text-sm placeholder:text-muted focus:border-accent outline-none" />
    </div>`;

  const theadCells = cols.map((c) => {
    const active = st.sortLabel === c.label;
    const arrow = active ? (st.sortDir === 'asc' ? '↑' : '↓') : '';
    const clickable = opts.sortable === false ? '' : `onclick="onTableSort('${tableId}','${escapeAttr(c.label)}')" class="cursor-pointer select-none hover:text-accent transition-colors"`;
    
    return `<th ${clickable} class="px-4 py-3 text-[11px] uppercase tracking-wider text-muted whitespace-nowrap font-display font-semibold border-b border-hairline bg-surface2/50 backdrop-blur">${escapeHtml(c.label)} <span class="text-accent ml-1">${arrow}</span></th>`;
  }).join('');

  const tbodyRows = shownRows.map((r) => {
    const tds = cols.map((c) => {
      const val = r.values[c.label];
      const fmt = r.formatted[c.label] ?? '';
      
      let cellStyle = "px-4 py-3 whitespace-nowrap text-sm border-b border-hairline/40 text-white";
      
      if (typeof val === 'number') {
        cellStyle += " font-mono tabular-nums";
        if (val > 0 && !c.label.toLowerCase().includes('nombre') && !c.label.toLowerCase().includes('equipo')) {
          cellStyle += " text-accent font-medium"; 
        }
      }
      
      return `<td class="${cellStyle}">${escapeHtml(fmt)}</td>`;
    }).join('');
    return `<tr class="hover:bg-surface2/40 transition-colors cursor-default">${tds}</tr>`;
  }).join('');

  const countLabel = `<p class="text-xs text-muted mb-2">${rows.length} fila${rows.length === 1 ? '' : 's'}${limit && rows.length > limit ? ` · mostrando ${limit}` : ''}</p>`;

  return `
    <div class="bg-surface border border-hairline rounded-xl shadow-sm p-5">
      ${searchBox}
      ${countLabel}
      <div class="scrollbox rounded-lg border border-hairline/50 overflow-hidden">
        <table class="w-full border-collapse tabla-rank">
          <thead><tr>${theadCells}</tr></thead>
          <tbody>${tbodyRows || `<tr><td class="px-4 py-5 text-sm text-muted" colspan="${cols.length}">Sin resultados.</td></tr>`}</tbody>
        </table>
      </div>
    </div>`;
}

function onTableSearch(tableId, value) {
  const st = tableState[tableId] || (tableState[tableId] = { sortLabel: null, sortDir: 'asc', search: '' });
  st.search = value;
  rerenderCurrentSection({ focusId: `search-${tableId}` });
}
function onTableSort(tableId, label) {
  const st = tableState[tableId] || (tableState[tableId] = { sortLabel: null, sortDir: 'asc', search: '' });
  if (st.sortLabel === label) st.sortDir = st.sortDir === 'asc' ? 'desc' : 'asc';
  else { st.sortLabel = label; st.sortDir = 'asc'; }
  rerenderCurrentSection();
}
function onTabChange(section, tabId) {
  tabState[section] = tabId;
  rerenderCurrentSection();
}

function rerenderCurrentSection(opts = {}) {
  renderSection(currentSection);
  if (opts.focusId) {
    const el = document.querySelector(`[data-focus-id="${opts.focusId}"]`);
    if (el) {
      el.focus();
      const v = el.value;
      el.selectionStart = el.selectionEnd = v.length;
    }
  }
}

/* ============ SECCIÓN: PRINCIPAL ============ */
/* Una fila del top 5. Lo usan las DOS ramas —índice y hoja— para que no
   se puedan ver distinto según de dónde salió el dato. */
function itemLeaderHTML(i, nombre, equipo, valor) {

    <li class="flex items-center justify-between py-2 border-b border-hairline/60 last:border-0">
