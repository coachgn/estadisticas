<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Panel de Scouting</title>

<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    theme: {
      extend: {
        colors: {
          base: '#0B1121',       /* Fondo principal oscuro navy */
          surface: '#111827',    /* Fondo de las tarjetas */
          surface2: '#1F2937',   /* Hover en filas y botones */
          hairline: '#374151',   /* Bordes más suaves */
          accent: '#FBBF24',     /* Amarillo dorado de la imagen */
          accentdeep: '#D97706', 
          ink: '#F9FAFB',        /* Texto principal blanco */
          muted: '#9CA3AF',      /* Texto secundario gris */
        },
        fontFamily: {
          display: ['"Barlow Condensed"', 'sans-serif'],
          body: ['"Barlow"', 'sans-serif'],
          mono: ['"DM Mono"', 'monospace'],
        },
      },
    },
  };
</script>

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link
  href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800&family=Barlow:wght@400;500;600;700&family=DM+Mono:wght@400;500&display=swap"
  rel="stylesheet"
/>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js" crossorigin="anonymous" referrerpolicy="no-referrer"></script>

<style>
  :root { color-scheme: dark; }
  html, body { background: #0a0a0a; }
  ::-webkit-scrollbar { width: 8px; height: 8px; }
  ::-webkit-scrollbar-track { background: #141414; }
  ::-webkit-scrollbar-thumb { background: #333; border-radius: 4px; }
  :root { --acento: #f7941e; --acento-oscuro: #d97706; --acento-texto: #f7941e;
          /* Variante oscurecida para el PAPEL: el acento crudo da 2,08 de
             contraste sobre el gris de las tarjetas impresas y se lee lavado.
             `sgadd-club.js` la recalcula por club. */
          --acento-papel: #a16014; }

  ::-webkit-scrollbar-thumb:hover { background: var(--acento); }
  * { scrollbar-color: #333 #141414; scrollbar-width: thin; }

  .nav-item { position: relative; }
  .nav-item.active::before {
    content: '';
    position: absolute; left: 0; top: 8px; bottom: 8px; width: 3px;
    background: var(--acento); border-radius: 0 2px 2px 0;
  }
  /* Respaldo de los colores de marca: si el JIT del CDN de Tailwind todavia
     no genero la clase para un nodo recien inyectado, igual se ve bien. */
  .text-ink { color: #F9FAFB; }
  .text-muted { color: #a8b0bd; }
  /* Como TEXTO se usa la variante aclarada: el color de marca crudo puede
     no tener contraste suficiente sobre fondo oscuro (ver sgadd-club.js). */
  .text-accent { color: var(--acento-texto) !important; }
  .bg-accent { background-color: var(--acento); }
  .border-accent { border-color: var(--acento); }
  .hover\:bg-accentdeep:hover { background-color: var(--acento-oscuro); }
  .bg-surface2 { background-color: #1F2937; }

  /* ---------------------------------------------------------------------
     ALINEACION GLOBAL DE TABLAS

     Regla unica: la primera columna (nombre de equipo, jugador o categoria)
     va a la izquierda; todo lo demas centrado. Se aplica una sola vez aca en
     vez de repetir text-center en cada <td> de cada seccion.

     Escape: si la primera columna es un numero (puesto, #), poner la clase
     `tabla-rank` en la <table> y el nombre pasa a ser la segunda columna.
     --------------------------------------------------------------------- */
  table th, table td { text-align: center; }
  table th:first-child, table td:first-child { text-align: left; }

  table.tabla-rank th:first-child,
  table.tabla-rank td:first-child { text-align: center; }
  table.tabla-rank th:nth-child(2),
  table.tabla-rank td:nth-child(2) { text-align: left; }

  /* Utilitarias de alto contraste. Sobre fondo oscuro, text-white y
     dato-sec quedan al limite de lo legible. */
  /* ---------------------------------------------------------------------
     CONTRASTE

     Los colores con opacidad (text-muted/60, text-ink/80) sobre fondo oscuro
     quedan al limite de lo legible. Se usan solidos, y con !important porque
     el CDN de Tailwind inyecta sus reglas DESPUES de este <style> y le gana
     por orden de cascada.
     --------------------------------------------------------------------- */
  .text-white { color: #ffffff !important; }
  .text-slate-100 { color: #f1f5f9 !important; }
  .text-slate-300 { color: #cbd5e1 !important; }

  /* Dato de apoyo: percentiles, medianas, notas al pie. Legible pero
     claramente secundario. */
  .dato-sec { color: #a8b0bd !important; }
  .text-green-400 { color: #4ade80 !important; }
  .text-red-400 { color: #f87171 !important; }
  .text-yellow-400 { color: #facc15; }

  /* +/- del jugador. A propósito MÁS APAGADO que el verde/rojo de arriba:
     esos marcan rendimientos atípicos y son un hallazgo; el +/- es una
     columna de contexto. Dos semáforos con la misma intensidad en la misma
     tabla no se leen. Van a mano y no con utilidades de Tailwind porque el
     JIT del CDN no genera clases para nodos inyectados dinámicamente. */
  .mm-pos  { color: #6ee7a8 !important; opacity: .75; }
  .mm-neg  { color: #f4a5a5 !important; opacity: .75; }
  .mm-cero { color: #8b93a0 !important; }

  /* =====================================================================
     BUZÓN DE ALERTAS · drawer, toast y sincronización gráfico ↔ tabla

     Todo a mano y no con utilidades de Tailwind: son nodos inyectados
     dinámicamente y el JIT del CDN no genera clases para ellos (misma
     razón que los respaldos de text-accent y de .mm-pos).
     ===================================================================== */

  /* --- Campana del buzón ---
     A mano y no con utilidades de Tailwind: el botón lo inyecta
     `SGADD_BUZON.badge()` después del render y el JIT del CDN no genera
     clases para nodos dinámicos, así que `w-10 h-10` no se aplicaba y el
     botón quedaba del ancho del emoji (21px). Mismo motivo que .mm-pos y
     .fila-inicial. */
  .buzon-boton {
    position: relative; display: grid; place-items: center;
    width: 40px; height: 40px; flex-shrink: 0;
    border: 1px solid #282828; border-radius: 8px;
    background: #1c1c1f; font-size: 16px; line-height: 1;
    cursor: pointer;
    transition: background-color .15s ease, border-color .15s ease, transform .15s ease;
  }
  .buzon-boton:hover { background: #24242a; border-color: rgba(250,204,21,.5); }
  .buzon-boton:active { transform: scale(.95); }
  .buzon-badge {
    position: absolute; top: -6px; right: -6px;
    min-width: 18px; height: 18px; padding: 0 4px;
    border-radius: 999px; background: #facc15; color: #000;
    font-size: 10px; font-weight: 700; line-height: 18px; text-align: center;
  }

  /* --- Drawer: entrada y salida suaves, como pide Checklist Design --- */
  @keyframes buzonFadeIn  { from { opacity: 0 } to { opacity: 1 } }
  @keyframes buzonSlideIn { from { transform: translateX(100%) } to { transform: translateX(0) } }
  .buzon-fade  { animation: buzonFadeIn .18s ease-out both; }
  .buzon-slide { animation: buzonSlideIn .22s cubic-bezier(.22,.8,.3,1) both; }
  .buzon-saliendo { animation: buzonFadeIn .16s ease-in reverse both; }
  .buzon-saliendo .buzon-slide { animation: buzonSlideIn .16s ease-in reverse both; }

  /* --- Salida de UNA tarjeta resuelta ---
     Se anima la ALTURA (más margen, padding y borde) para que las tarjetas
     de abajo suban solas por el flujo, sin repintar la lista ni resetear el
     scroll. `height: auto` no es animable: el JS fija la altura en px antes
     de colapsarla. `transform` no serviría acá — desplazaría la tarjeta pero
     seguiría ocupando su lugar, y el hueco quedaría igual. */
  .buzon-tarjeta-saliendo {
    transition: height .22s cubic-bezier(.4,0,.2,1),
                opacity .16s ease-out,
                margin .22s cubic-bezier(.4,0,.2,1),
                padding .22s cubic-bezier(.4,0,.2,1),
                border-width .22s cubic-bezier(.4,0,.2,1);
    pointer-events: none;   /* no se puede votar dos veces la misma tarjeta */
  }

  /* --- Toast: feedback inmediato al confirmar una alerta --- */
  @keyframes toastIn  { from { opacity: 0; transform: translateY(10px) } to { opacity: 1; transform: none } }
  .toast-in  { animation: toastIn .2s cubic-bezier(.22,.8,.3,1) both; }
  .toast-out { animation: toastIn .2s ease-in reverse both; }

  /* --- Fila destacada del plantel (viene del hover en el scatter) ---
     Checklist Design · table row states:
       · tinte del acento al 12%, NUNCA blanco plano: sobre una card oscura
         el blanco encandila y tapa el color de los números;
       · indicador lateral de 3px, porque el fondo solo no dice CUÁL fila
         está activa cuando hay dos tintes parecidos en pantalla;
       · el texto NO cambia de color al destacarse. Repintarlo obliga a
         revalidar el contraste de cada celda (verde de atípico, rojo de
         +/- negativo, naranja de acento) contra un fondo nuevo.
     El tinte al 12% sobre #0e0e10 da 1,08:1 de diferencia con el fondo
     base: se ve, y deja los textos por encima de 4.5:1 igual que antes. */
  /* OJO: el fondo va en los `td`, NO en el `tr`. La card pinta las celdas
     con `#141414` propio y ese fondo TAPA el del `tr`: la regla se aplicaba
     y no se veía nada. Por lo mismo el desplazamiento se hace con
     `padding-left` y no con `transform`, que en `display: table-row` los
     motores directamente ignoran. */
  #plantelTabla tr.fila-jug > td {
    transition: background-color .2s ease, padding-left .15s ease, box-shadow .2s ease;
  }
  #plantelTabla tr.fila-jug:hover > td,
  #plantelTabla tr.fila-destacada > td {
    background: color-mix(in srgb, var(--acento) 12%, #141414);
  }
  #plantelTabla tr.fila-jug:hover > td:first-child,
  #plantelTabla tr.fila-destacada > td:first-child {
    box-shadow: inset 3px 0 0 0 var(--acento);
  }
  /* La fila que llega desde el gráfico se corre apenas: el desplazamiento
     es lo que el ojo percibe primero cuando está mirando el scatter. */
  #plantelTabla tr.fila-destacada > td:first-child { padding-left: 9px; }
  #plantelTabla tr.fila-destacada .fila-inicial {
    border-color: var(--acento);
    color: var(--acento-texto);
    background: color-mix(in srgb, var(--acento) 22%, transparent);
  }
  /* Insignia con las mismas iniciales del nodo: es el puente visual entre
     las dos vistas. Sin esto hay que leer el nombre completo para saber
     qué punto del gráfico es cuál. */
  .fila-inicial {
    display: inline-grid; place-items: center;
    width: 22px; height: 22px; margin-right: 8px;
    border: 1px solid var(--hairline, #2a2a2e); border-radius: 999px;
    font-size: 9px; font-weight: 700; letter-spacing: .3px;
    color: #a8b0bd; vertical-align: middle;
    transition: background-color .2s ease, border-color .2s ease, color .2s ease;
  }
  /* Atenuado, pero legible: 3.1:1 sobre el fondo de la card. El
     `opacity: .5` anterior lo tiraba a 2.2:1 y no pasaba WCAG. */
  #plantelTabla tr.fila-flojo td { color: #8b93a0; }
  #plantelTabla tr.fila-flojo .fila-inicial { opacity: .6; }

  /* Respaldo para navegadores sin color-mix. */
  @supports not (background: color-mix(in srgb, red 10%, #000)) {
    #plantelTabla tr.fila-jug:hover > td,
    #plantelTabla tr.fila-destacada > td { background: #2c2318; }
    #plantelTabla tr.fila-jug:hover > td:first-child,
    #plantelTabla tr.fila-destacada > td:first-child { box-shadow: inset 3px 0 0 0 #f7941e; }
    #plantelTabla tr.fila-destacada .fila-inicial { background: rgba(247,148,30,.22); }
  }

  /* --- Foco visible en todo lo interactivo (WCAG 2.4.7) ---
     `:focus-visible` y no `:focus`: el anillo aparece al navegar con
     teclado y no en cada clic del mouse, que es lo que lo volvía ruido. */
  button:focus-visible, select:focus-visible, input:focus-visible,
  a:focus-visible, [tabindex]:focus-visible {
    outline: 2px solid var(--acento-texto);
    outline-offset: 2px;
    border-radius: 4px;
  }
  /* Una FILA enfocada no se puede marcar solo con `outline`: en
     `display: table-row` los motores lo dibujan de forma despareja, el mismo
     motivo por el que el fondo de una fila va en los `<td>` y no en el `<tr>`
     (punto 14). Se repite el tratamiento de la fila destacada, que ya está
     medido en contraste, y la barra lateral del acento marca dónde arranca. */
  tbody tr[role="button"]:focus-visible { outline: none; }
  tbody tr[role="button"]:focus-visible > td {
    background: color-mix(in srgb, var(--acento) 14%, #141414);
  }
  tbody tr[role="button"]:focus-visible > td:first-child {
    box-shadow: inset 3px 0 0 0 var(--acento);
  }

  /* Saltar al contenido: con un menú lateral de seis secciones, sin esto el
     teclado tiene que atravesarlo entero en CADA pantalla. Solo se ve cuando
     recibe el foco. */
  .salto-contenido {
    position: absolute; left: .5rem; top: -3rem; z-index: 60;
    background: var(--acento); color: #111; font-weight: 600;
    padding: .5rem .9rem; border-radius: .5rem;
    transition: top .15s ease;
  }
  .salto-contenido:focus-visible { top: .5rem; }
  @media (prefers-reduced-motion: reduce) {
    .buzon-fade, .buzon-slide, .toast-in, .toast-out, .buzon-saliendo,
    .buzon-saliendo .buzon-slide { animation: none !important; }
    .buzon-tarjeta-saliendo { transition: none !important; }
    #plantelTabla tr.fila-jug { transition: none; }
  }

  .border-green-400 { border-color: #4ade80; }
  .border-red-400 { border-color: #f87171; }

  /* Hover generico de tarjetas: la interfaz responde al cursor. */
  .transition-all { transition: all .2s ease; }
  .hover\:border-accent:hover { border-color: var(--acento); }
  .hover\:shadow-lg:hover { box-shadow: 0 8px 24px rgba(0,0,0,.45); }



  /* =====================================================================
     INFORME POST-PARTIDO · exactamente UNA hoja A4

     Presupuesto medido sobre 277mm útiles (A4 menos 10mm de margen):
       encabezado 22 · insight 76 · factores 26 · box scores 68 · pie 6
       = 266mm, con 11mm de sobra.

     Los dos box scores van EN PARALELO: en columna se comen 136mm y no
     entra nada más. Todo se comprime con tipografías en pt y paddings en
     mm para que el resultado no dependa del zoom del navegador.
     ===================================================================== */
  /* El lienzo de la hoja: blanco de borde a borde. */
  @page partido { size: A4; margin: 10mm; background: #ffffff; }

  /* =====================================================================
     INFORME POST-PARTIDO · exactamente UNA hoja A4

     ATENCIÓN AL MÉTODO: la primera versión usaba `body > *:not(#view-root)`
     para ocultar la app. Eso salía en blanco porque #view-root está CUATRO
     niveles adentro de <body>: la regla ocultaba el contenedor que lo
     envuelve y se llevaba puesto el contenido.

     La forma robusta no depende de la estructura: se oculta TODO el body y
     después se re-muestra la cadena de ancestros del bloque a imprimir,
     usando `visibility` en vez de `display` para no romper el layout.
     ===================================================================== */
  @media print {
    /* `visibility: hidden` NO saca el color de fondo: el elemento sigue
       pintando su background. Por eso salían márgenes negros alrededor de
       la hoja. Hay que blanquear html, body y los contenedores intermedios. */
    /* ---------------------------------------------------------------------
       EL MARCO NEGRO

       Chromium ignora `background` dentro de @page: el color de la hoja y de
       sus margenes lo toma del ELEMENTO RAIZ. Y hay tres fuentes de oscuro
       peleando:
         1. `html, body { background: #0a0a0a }` del style block
         2. `<body class="bg-base">` — Tailwind inyecta su CSS DESPUES
         3. #loader y header, tambien con bg-base

       Se blanquea :root, html y body SIN condicionar a ninguna clase, y se
       neutraliza `.bg-base`, que es la que gana por especificidad de clase.
       --------------------------------------------------------------------- */
    :root, html, body {
      background: #ffffff !important;
      background-color: #ffffff !important;
      background-image: none !important;
    }
    .bg-base, [class*="bg-base"] {
      background: #ffffff !important;
      background-color: #ffffff !important;
    }
    body.modo-partido-print #view-root,
    body.modo-partido-print .card,
    body.modo-partido-print > div,
    body.modo-partido-print > div > div,
    body.modo-partido-print > div > div > div { background: transparent !important; }

    body.modo-partido-print { visibility: hidden; }

    /* El bloque y toda su descendencia vuelven a ser visibles. */
    body.modo-partido-print #detallePartido,
    body.modo-partido-print #detallePartido * { visibility: visible !important; }

    /* Se saca del flujo y se ancla arriba: los ancestros siguen ocupando
       lugar aunque estén invisibles, y sin esto el informe arrancaría a
       mitad de la hoja. */
    body.modo-partido-print #detallePartido {
      position: absolute !important;
      left: 0; top: 0; width: 100%;
      page: partido;
      font-size: 7pt;
      line-height: 1.25;
      background: #fff !important;
    }

    /* Papel: blanco y negro sin depender de "Gráficos de fondo". */
    body.modo-partido-print #detallePartido,
    body.modo-partido-print #detallePartido * {
      color: #0f172a !important;
      background-image: none !important;
      box-shadow: none !important;
      /* Obliga al navegador a imprimir los colores, sin depender de
         que el usuario active "Graficos de fondo". */
      -webkit-print-color-adjust: exact !important;
      print-color-adjust: exact !important;
    }
    /* El blanco absoluto desarmó la jerarquía: todo parecía texto suelto.
       Las tarjetas conservan fondo suave y borde sólido; el papel sigue
       siendo claro, así que el gasto de tinta no cambia. */
    body.modo-partido-print #detallePartido [class*="bg-surface2"],
    body.modo-partido-print #detallePartido [class*="bg-accent/"],
    body.modo-partido-print #detallePartido [class*="bg-green-400/"],
    body.modo-partido-print #detallePartido [class*="bg-red-400/"] {
      background: #ffffff !important;
      border: 1.4px solid #94a3b8 !important;
      border-radius: 1.5mm !important;
    }
    body.modo-partido-print #detallePartido .border-green-400 { border-left: 2.5px solid #15803d !important; }
    body.modo-partido-print #detallePartido .border-red-400 { border-left: 2.5px solid #b91c1c !important; }
    body.modo-partido-print #detallePartido h5 {
      border-bottom: 1px solid #cbd5e1 !important;
      padding-bottom: 0.8mm !important;
      color: #0f172a !important;
    }
    body.modo-partido-print #detallePartido .dato-sec,
    body.modo-partido-print #detallePartido .text-muted { color: #64748b !important; }
    body.modo-partido-print #detallePartido .text-white,
    body.modo-partido-print #detallePartido .text-slate-100 { color: #0f172a !important; }

    /* Verde y rojo un tono mas oscuro que en pantalla: sobre blanco, los de
       la app quedan lavados. Mismo significado, distinta luminosidad. */
    body.modo-partido-print #detallePartido .text-green-400 { color: #15803d !important; }
    body.modo-partido-print #detallePartido .text-red-400 { color: #b91c1c !important; }
    body.modo-partido-print #detallePartido .bg-green-400 { background: #15803d !important; }
    body.modo-partido-print #detallePartido .bg-red-400 { background: #b91c1c !important; }
    body.modo-partido-print #detallePartido .bg-muted { background: #94a3b8 !important; }
    body.modo-partido-print #detallePartido .bg-surface2 { background: #e2e8f0 !important; }

    /* El acento del club se mantiene: es la identidad del cliente. */
    body.modo-partido-print #detallePartido .text-accent {
      color: var(--acento-papel, #a16014) !important; font-weight: 700;
    }

    /* Los botones no van al papel. */
    body.modo-partido-print [data-no-print] { display: none !important; }

    /* -----------------------------------------------------------------
       LOS TRES BLOQUES DE CIERRE, EN TRES COLUMNAS

       "Para el próximo cruce" ya usa `lg:grid-cols-3`, pero el breakpoint
       `lg` de Tailwind es 1024px y la hoja A4 vertical mide 794px: en el
       papel nunca se activaba y los tres quedaban APILADOS, ocupando ~330px
       de alto donde en columnas ocupan ~120.

       Es exactamente lo que empujaba el informe a una segunda hoja: medido,
       el detalle daba 1260px contra 1047 de A4 útil, y estos 210px son la
       diferencia. Se gana espacio usando el ancho libre, sin achicar la
       tipografía del box score, que es lo que hay que poder leer.
       ----------------------------------------------------------------- */
    body.modo-partido-print #proximoCruce > .grid {
      display: grid !important;
      grid-template-columns: repeat(3, 1fr) !important;
      gap: 2mm !important;
    }
    /* Los aires de PANTALLA son generosos a propósito; en una carilla A4
       son los que sobran. Se comprimen los espacios verticales y NO la
       tipografía: el box score tiene que seguir siendo legible, que es todo
       el punto de llevar la hoja a la cancha. Con esto el detalle bajó de
       1260px a los 1047 que entran en la hoja. */
    body.modo-partido-print #detallePartido .mb-6 { margin-bottom: 2.5mm !important; }
    body.modo-partido-print #detallePartido .mt-6 { margin-top: 2.5mm !important; }
    body.modo-partido-print #detallePartido .mb-5 { margin-bottom: 2mm !important; }
    body.modo-partido-print #detallePartido .mb-4,
    body.modo-partido-print #detallePartido .mb-3 { margin-bottom: 1.5mm !important; }
    body.modo-partido-print #detallePartido .p-4,
    body.modo-partido-print #detallePartido .p-5 { padding: 2mm !important; }
    body.modo-partido-print #detallePartido .pt-4 { padding-top: 2mm !important; }
    body.modo-partido-print #detallePartido .gap-3 { gap: 1.5mm !important; }
    body.modo-partido-print #detallePartido .space-y-2 > * + * { margin-top: 1mm !important; }

    /* -----------------------------------------------------------------
       DOS HOJAS, Y EL CORTE DONDE CORRESPONDE

       Con el perfil de tiro adentro, el post-partido ya no entra en una
       carilla — y está bien que no entre: son dos lecturas distintas.

         hoja 1 · marcador, insight, 4 factores, eficiencia, perfil de tiro
                  → el análisis de EQUIPO
         hoja 2 · los dos box scores + el cierre
                  → el detalle jugador por jugador

       Sin el corte explícito, los box scores arrancaban al pie de la
       primera y se partían al medio: la tabla de un equipo quedaba en una
       hoja y la del otro en la siguiente, que es justo lo que impide
       compararlas. `page-break-inside: avoid` sobre el grid no alcanza —
       con las dos tablas juntas nunca entra en el hueco que sobra—.
       ----------------------------------------------------------------- */
    body.modo-partido-print #boxScores {
      page-break-before: always; break-before: page;
    }
    /* El perfil de tiro cierra la primera hoja: no se parte ni arrastra. */
    body.modo-partido-print #perfilTiro {
      page-break-inside: avoid; break-inside: avoid;
      page-break-after: avoid; break-after: avoid;
    }
    /* Los dos gráficos, uno al lado del otro: en el papel el breakpoint
       `lg` (1024px) nunca se activa sobre una hoja de 794px. Mismo caso que
       "Para el próximo cruce". */
    body.modo-partido-print #perfilTiro > .grid {
      display: grid !important;
      grid-template-columns: 1fr 1fr !important;
      gap: 3mm !important;
    }
    /* Con la hoja para él, el gráfico puede respirar. */
    body.modo-partido-print #perfilTiro .chart-box {
      height: 62mm !important;
      position: relative;
      overflow: hidden;
    }
    body.modo-partido-print #perfilTiro canvas {
      max-width: 100% !important;
      max-height: 100% !important;
    }

    /* Nada se parte al medio. El informe ocupa dos hojas: forzar una sola
       obligaba a apretar el box score, que es lo que hay que poder leer. */
    body.modo-partido-print #detallePartido > *,
    body.modo-partido-print #detallePartido .card,
    body.modo-partido-print #detallePartido table,
    body.modo-partido-print #detallePartido tr {
      page-break-inside: avoid !important;
      break-inside: avoid !important;
    }
    body.modo-partido-print #proximoCruce {
      page-break-before: auto !important;
      break-before: auto !important;
      margin-top: 4mm !important;
    }

    /* --- Compactado --- */
    body.modo-partido-print #detallePartido .p-4,
    body.modo-partido-print #detallePartido .p-5,
    body.modo-partido-print #detallePartido .sm\:p-5 { padding: 2mm !important; }
    body.modo-partido-print #detallePartido .p-3,
    body.modo-partido-print #detallePartido .p-2\.5 { padding: 1.2mm !important; }
    body.modo-partido-print #detallePartido .mb-6,
    body.modo-partido-print #detallePartido .mb-5 { margin-bottom: 2.5mm !important; }
    body.modo-partido-print #detallePartido .mb-3,
    body.modo-partido-print #detallePartido .mb-2 { margin-bottom: 1.2mm !important; }
    body.modo-partido-print #detallePartido .gap-6,
    body.modo-partido-print #detallePartido .gap-3 { gap: 2.5mm !important; }
    body.modo-partido-print #detallePartido .mt-5,
    body.modo-partido-print #detallePartido .mt-6 { margin-top: 2.5mm !important; }
    body.modo-partido-print #detallePartido .pt-4 { padding-top: 2mm !important; }
    body.modo-partido-print #detallePartido .space-y-2 > * + * { margin-top: 1mm !important; }

    /* El marcador es lo primero que se mira: se mantiene grande. */
    body.modo-partido-print #detallePartido .text-3xl,
    body.modo-partido-print #detallePartido .text-4xl,
    body.modo-partido-print #detallePartido .sm\:text-4xl { font-size: 20pt !important; }
    body.modo-partido-print #detallePartido img {
      width: 8mm !important; height: 8mm !important;
      -webkit-print-color-adjust: exact !important; print-color-adjust: exact !important;
    }

    body.modo-partido-print #detallePartido .text-base { font-size: 8.5pt !important; }
    body.modo-partido-print #detallePartido .text-sm  { font-size: 7.5pt !important; }
    body.modo-partido-print #detallePartido .text-xs  { font-size: 6.8pt !important; }
    body.modo-partido-print #detallePartido .text-\[10px\],
    body.modo-partido-print #detallePartido .text-\[11px\] { font-size: 5.8pt !important; }

    /* Los box scores van UNO DEBAJO DEL OTRO, y esto cambió a propósito.

       Mientras el informe tenía que entrar en UNA carilla iban en paralelo
       —en columna se comían media hoja—, pero con 14 columnas cada tabla se
       quedaba con ~357px de los 718 útiles y su ancho mínimo real es ~470:
       medido, la tabla de la derecha llegaba a 882px sobre una hoja que
       termina en 718, así que RT, AST, PR, PP y +/- caían FUERA del área de
       página y Chromium directamente no las imprimía. Es el mismo defecto
       que tenía "Restricción / alerta" en scouting (punto 7.3).

       Ahora que los box scores abren su propia hoja hay altura de sobra
       (620 de 1047), así que cada uno se lleva el ancho completo y entra
       entero. */
    body.modo-partido-print #boxScores {
      display: grid !important;
      grid-template-columns: 1fr !important;
      gap: 4mm !important;
    }
    /* `width: 100%` solo no alcanza: con `table-layout: auto` el ancho
       mínimo del contenido le gana y la tabla se ensancha igual. */
    body.modo-partido-print #detallePartido table {
      font-size: 6pt !important; width: 100% !important;
      table-layout: fixed !important; min-width: 0 !important;
    }
    /* Un apellido largo parte de línea en vez de ensanchar su columna. */
    body.modo-partido-print #detallePartido th,
    body.modo-partido-print #detallePartido td { overflow-wrap: anywhere !important; }
    /* Los que jugaron menos de 8 minutos van atenuados, pero en el papel la
       OPACIDAD no sirve: destiñe el número y el borde de la fila por igual y
       la tabla se lee sucia. Es la misma decisión que ya tomó el plantel del
       informe de equipo — atenuar con TINTA, no con opacidad. */
    body.modo-partido-print #detallePartido tr.fila-tenue { opacity: 1 !important; }
    body.modo-partido-print #detallePartido tr.fila-tenue td,
    body.modo-partido-print #detallePartido tr.fila-tenue td * { color: #94a3b8 !important; }

    /* Con `table-layout: fixed` las 15 columnas se reparten en partes
       iguales, y la de nombres necesita el triple que una de números:
       medido, "RUSSO NOWOSIESKI" y "GARCIA BARUCCO" se montaban encima de
       los minutos. El `whitespace-nowrap` del nombre es de pantalla —ahí la
       tabla puede scrollear— y en el papel lo único que hace es empujar el
       texto fuera de su celda. */
    body.modo-partido-print #detallePartido table th:first-child,
    body.modo-partido-print #detallePartido table td:first-child {
      width: 20% !important; white-space: normal !important;
    }
    body.modo-partido-print #detallePartido th,
    body.modo-partido-print #detallePartido td {
      padding: 0.7mm 0.6mm !important;
      border-bottom: 1px solid #e0e0e0 !important;
    }
    body.modo-partido-print #detallePartido .scrollbox { overflow: visible !important; }

    /* La 2da linea del desvio duplica la altura de fila; el color alcanza. */
    body.modo-partido-print #detallePartido td span.block { display: none !important; }

    /* Metricas avanzadas: 4 en una fila. */
    body.modo-partido-print #avanzadasPartido {
      display: grid !important;
      grid-template-columns: repeat(4, 1fr) !important;
      gap: 2mm !important;
    }
  }

  /* =====================================================================
     IMPRESIÓN · Informe pre-partido

     Se activa con body.modo-impresion. El navegador ya sabe generar PDF;
     lo único que hay que hacer es ocultar la app y darle reglas de corte.
     ===================================================================== */
  #informeSalida { display: none; }

  body.modo-impresion #informeSalida { display: block; }
  body.modo-impresion > *:not(#informeSalida) { display: none !important; }

  /* La ficha individual del jugador: mismo mecanismo, contenedor propio.
     Se queda con la @page VERTICAL por defecto —una ficha personal se
     imprime, se dobla y se lleva a la charla— mientras los dos informes
     largos van en A3 apaisada. */
  #fichaSalida { display: none; }
  body.modo-ficha-print #fichaSalida { display: block; }
  body.modo-ficha-print > *:not(#fichaSalida) { display: none !important; }

  @media print {
    /* `@page` no se puede condicionar por clase del body, así que es
       compartida por las dos exportaciones (informe de equipo y scouting).
       Vertical explícito para que no dependa del default del navegador. */
    @page { size: A4 portrait; margin: 12mm 10mm; }
    /* El post-partido necesita cada milimetro para entrar en una carilla. */
    body.modo-partido-print { }

    /* =================================================================
       PAPEL CLARO · UN SOLO CRITERIO PARA LAS TRES EXPORTACIONES

       Hoja blanca, texto oscuro, tarjetas grises y acentos de color. Los
       tres informes se leen igual, que es lo que pidió el club: el DT
       abre cualquiera de los tres y encuentra la misma jerarquía visual.

       (Scouting estuvo un tiempo con la paleta oscura de la app. Se
       revirtió: en papel el gris claro de las tarjetas contra el blanco de
       la hoja separa mejor los bloques, y no depende de que el lector
       tenga "gráficos de fondo" activado.)
       ================================================================= */

    /* EL LIENZO. `:root { color-scheme: dark }` hace que Chrome pinte el
       fondo de la página —lo que queda detrás de todo, márgenes incluidos—
       con su gris por defecto #121212, y lo pinta ANTES que el documento,
       así que ningún `background: #fff` lo tapa. Es la causa real de los
       "márgenes negros" que estuvieron abiertos meses en el punto 7.

       Medido en los PDF ANTES de esta línea: informe de equipo → primer
       relleno RGB(18,18,18); post-partido → RGB(15,23,42). */
    @page { background: #ffffff; }
    html { color-scheme: light !important; }

    :root, html, body {
      background: #ffffff !important;
      background-color: #ffffff !important;
      color: #111 !important;
    }
    .bg-base,
    [class*="bg-base"] { background: #ffffff !important; }
    body * { color: #111 !important; }
    /* El JIT del CDN de Tailwind genera sus utilidades de color CON
       `!important`, así que `.text-slate-300` (0,1,0) le gana a `body *`
       (0,0,1) aunque las dos lo lleven. Resultado: los párrafos de
       descripción de los 8 ejes ("Empuja el ritmo. Más posesiones que el
       resto…") se imprimían en gris #cbd5e1 sobre gris claro — ilegibles.
       Con `body` adelante la especificidad sube a 0,1,1 y gana el papel.
       El post-partido ya tenía este parche puntual para `.text-slate-100`;
       acá vale para las tres exportaciones y para toda la familia. */
    body [class*="text-slate-"],
    body [class*="text-gray-"],
    body [class*="text-zinc-"],
    body [class*="text-neutral-"],
    /* `.text-white` y `.text-ink` son el texto DESTACADO del tema oscuro
       —nombres de equipo, marcadores, valores fuertes—. Sobre papel claro
       desaparecen: en el informe de scouting los nombres de los dos clubes
       del cruce salían en blanco sobre gris. */
    body .text-white,
    body .text-ink { color: #111 !important; }

    /* LAS TARJETAS VAN EN BLANCO CON BORDE SÓLIDO.

       Estuvieron en gris (#f1f5f9) un tiempo: con el blanco absoluto y un
       borde finito de 1px todo parecía texto suelto. La corrección no fue
       volver al gris sino **cargar el borde**: 1,4px de un slate que sí se
       ve (#94a3b8) separa los bloques igual o mejor que un fondo, y en papel
       gasta muchísima menos tinta — que es para lo que se imprime.

       Las tarjetas que YA traen un borde de color (el verde/rojo del ciclo,
       los cuatro grupos del plan colectivo, el acento del ADN) lo conservan:
       sus reglas van después y con `!important`.

       Genérico y no una lista de opacidades: `bg-surface2/60` no estaba y
       los chips de perfiles técnicos de la ficha salían en gris oscuro
       sobre el papel. Enumerarlas a mano garantiza que la próxima variante
       vuelva a escaparse. */
    .card,
    .scout-card,
    .scout-ficha,
    [class*="bg-surface2"],
    .bg-surface2,
    [class*="bg-accent/"],
    [class*="bg-green-400/"],
    [class*="bg-red-400/"] {
      background: #ffffff !important;
      border: 1.4px solid #94a3b8 !important;
      border-radius: 1.5mm !important;
      box-shadow: none !important;
    }
    .dato-sec,
    .text-muted { color: #64748b !important; }
    .text-green-400 { color: #15803d !important; }
    .text-red-400 { color: #b91c1c !important; }
    .text-yellow-400 { color: #a16207 !important; }
    .text-blue-400 { color: #1d4ed8 !important; }
    .text-amber-400 { color: #b45309 !important; }
    /* El acento del club se mantiene: es la identidad del cliente. Se usa
       la variante oscura, que sobre blanco sí tiene contraste. */
    .text-accent { color: var(--acento-papel, #a16014) !important; font-weight: 700; }
    .border-green-400 { border-left: 2.5px solid #15803d !important; }
    .border-red-400 { border-left: 2.5px solid #b91c1c !important; }
    /* El `thead th` de la app trae `background: #141414` por el sticky y no
       estaba neutralizado acá: daba texto gris #555 sobre casi negro, o sea
       encabezados de tabla ilegibles en el PDF en blanco y negro. */
    table thead th {
      /* TRANSPARENTE y no blanco: la tarjeta que contiene la tabla ya trae su
         gris de papel, y un blanco duro dibujaba un recuadro que no cerraba
         con el resto de la fila de encabezados. */
      background: transparent !important;
      position: static !important;
    }
    /* Y lo mismo con la PRIMERA COLUMNA fija de las tablas que scrollean:
       en el papel no hay scroll horizontal, así que la columna no se fija ni
       arrastra su fondo oscuro. La media query que la define ya está acotada
       a `screen`; esto es el cinturón además de los tiradores, porque cuando
       se activó nadie lo notó hasta ver el PDF: los nombres salían en negro
       sobre negro. */
    .scrollbox table th:first-child,
    .scrollbox table td:first-child {
      position: static !important;
      background: transparent !important;
      box-shadow: none !important;
    }

    /* Nada de la app navegable entra al papel. `.no-imprimir` vale para las
       TRES exportaciones, no solo para la de scouting: marca lo que es
       control y no contenido. Sin esto, esconder los `<select>` dejaba sus
       etiquetas huérfanas ("CATEGORÍA", "FASE", "LOCAL", "VISITANTE")
       flotando sobre una card vacía al principio del PDF. */
    aside, nav, header.sticky, button, select, input,
    .no-imprimir,
    #modalInforme, #logosFaltantesPanel, [data-no-print] { display: none !important; }

    /* Cortes: una tarjeta o una tabla partida al medio arruina el informe. */
    .informe-bloque, .card, table, tr, .chart-box { page-break-inside: avoid; break-inside: avoid; }
    .informe-bloque { page-break-after: auto; margin-bottom: 10mm; }
    h1, h2, h3, h5 { page-break-after: avoid; break-after: avoid; }
    thead { display: table-header-group; }   /* repite encabezado por página */

    .informe-cabecera { border-bottom: 2px solid #111; padding-bottom: 4mm; margin-bottom: 6mm; }
    .informe-cabecera h1 { font-size: 16pt; font-weight: 700; text-transform: uppercase; letter-spacing: .02em; }
    .informe-cabecera p { font-size: 8pt; color: #555 !important; margin-top: 1mm; }

    .informe-bloque h2 {
      font-size: 11pt; font-weight: 700; text-transform: uppercase;
      border-bottom: 1px solid #999; padding-bottom: 1.5mm; margin-bottom: 3mm;
    }
    .informe-pregunta { font-size: 8pt; color: #666 !important; margin-bottom: 3mm; }
    .informe-arquetipo { border-left: 3px solid #111; padding-left: 4mm; margin-bottom: 4mm; }
    .informe-arquetipo-titulo { font-size: 13pt; font-weight: 700; text-transform: uppercase; }
    /* Pie compartido por las TRES exportaciones. Lo arma
       `SGADD_UI.pieInforme()`: "MotorStats^AR · Generado el <fecha>". */
    .informe-pie {
      border-top: 1px solid #999; padding-top: 3mm; margin-top: 4mm;
      font-size: 7.5pt; color: #666 !important;
      page-break-inside: avoid; break-inside: avoid;
    }
    .informe-pie .pie-marca { font-weight: 700; color: #334155 !important; }
    /* El AR es parte de la marca, no una sigla suelta: va volado y más
       chico, pero no tanto como para no leerse impreso. */
    .informe-pie .pie-marca-sup {
      font-size: .62em;
      vertical-align: super;
      line-height: 0;
      margin-left: .5px;
      letter-spacing: .02em;
    }

    table { width: 100%; border-collapse: collapse; font-size: 8pt; }
    th, td { border-bottom: 1px solid #e0e0e0; padding: 1.5mm 2mm; }
    th { font-size: 7pt; text-transform: uppercase; color: #555 !important; }

    /* Los graficos entran a media pagina para que no empujen todo. */
    .chart-box { height: 62mm !important; }
    canvas { max-width: 100% !important; height: auto !important; }
    .scrollbox { overflow: visible !important; }

    /* =================================================================
       INFORME DE EQUIPO · hoja A3 apaisada

       Mismo formato que el de scouting, y por el mismo motivo: el informe
       es ancho —tablas de métricas, barras comparadas, radar de 8 ejes— y
       en A4 vertical todo eso queda apretado en 190mm. A3 apaisada da
       400mm útiles y el mismo alto que un A4 vertical.
       ================================================================= */
    body.modo-impresion { page: apaisada; }
    body.modo-impresion #informeSalida { max-width: none !important; }

    /* -----------------------------------------------------------------
       LAS TARJETAS, CON EL GRIS DEL POST-PARTIDO

       El blanco absoluto desarmaba la jerarquía: todo parecía texto
       suelto. Es el mismo criterio —y los mismos valores— que ya usa el
       informe post-partido, así que los dos PDF se leen igual.
       ----------------------------------------------------------------- */
    body.modo-impresion #informeSalida .card,
    body.modo-impresion #informeSalida [class*="bg-surface2"],
    body.modo-impresion #informeSalida [class*="bg-accent/"],
    body.modo-impresion #informeSalida [class*="bg-green-400/"],
    body.modo-impresion #informeSalida [class*="bg-red-400/"] {
      background: #ffffff !important;
      border: 1.4px solid #94a3b8 !important;
      border-radius: 1.5mm !important;
      box-shadow: none !important;
    }
    /* Los acentos de color del post-partido, para que el verde y el rojo
       sigan significando lo mismo en los dos informes. */
    body.modo-impresion #informeSalida .border-green-400 { border-left: 2.5px solid #15803d !important; }
    body.modo-impresion #informeSalida .border-red-400 { border-left: 2.5px solid #b91c1c !important; }
    body.modo-impresion #informeSalida .text-green-400 { color: #15803d !important; }
    body.modo-impresion #informeSalida .text-red-400 { color: #b91c1c !important; }
    body.modo-impresion #informeSalida .text-accent {
      color: var(--acento-papel, #a16014) !important; font-weight: 700;
    }

    /* -----------------------------------------------------------------
       LOS GRÁFICOS NO SE MONTAN SOBRE LO QUE VIENE DESPUÉS

       `.chart-box` fija la altura del contenedor, pero el <canvas> de
       Chart.js se dimensiona por su cuenta con `maintainAspectRatio:
       false` y se desborda: en el PDF terminaba pisando el pie de figura,
       el encabezado de la tabla siguiente o la tabla misma.

       `overflow: hidden` sola recortaría el gráfico. Lo que hace falta es
       que el canvas se ajuste al contenedor (`height: 100%` y no `auto`)
       y que el bloque entero reserve su espacio.
       ----------------------------------------------------------------- */
    /* 88mm y no 70: un radar es CUADRADO, así que su tamaño lo limita el
       lado más corto de la caja. En una hoja de 400mm de ancho, con 70mm de
       alto el gráfico quedaba diminuto en el centro y con medio metro de
       aire a los lados. Subir el alto lo hace crecer de verdad. */
    body.modo-impresion #informeSalida .chart-box {
      height: 88mm !important;
      max-height: 88mm !important;
      position: relative;
      overflow: hidden;
      margin-bottom: 4mm;
      page-break-inside: avoid; break-inside: avoid;
    }
    /* NO se le fuerza `width/height: 100%` al canvas.

       Chart.js dibuja el bitmap a un tamaño y el CSS lo ESCALA: si los dos
       no coinciden, el gráfico sale deformado. Es lo que ponía el radar
       "muy apaisado" — el polígono se estiraba a lo ancho de la caja en vez
       de quedar regular. Con `max-*` y `responsive: true`, Chart.js
       dimensiona el bitmap al contenedor y el CSS no lo toca. */
    body.modo-impresion #informeSalida .chart-box canvas {
      max-width: 100% !important;
      max-height: 100% !important;
    }
    /* Un radar es CUADRADO: su radio sale del lado más corto de la caja. A
       todo el ancho de una hoja de 400mm quedaba chico en el centro y con
       las etiquetas separadísimas del dibujo. Se le acota el ancho —un poco
       más que el alto, para que entren "Protección del aro" y "Búsqueda de
       contacto" a los costados— y se centra. */
    body.modo-impresion #informeSalida .chart-box.is-radar {
      max-width: 120mm;
      margin-left: auto;
      margin-right: auto;
    }
    /* El de local/visitante NO lleva excepción: se le acotó el contenedor en
       el HTML (`max-w-3xl`) para que Chart.js lo dibuje con el mismo aspecto
       que los otros dos, y así comparte estas mismas medidas. Darle una caja
       más grande acá no servía: el radar sale del lado más corto del canvas,
       y un canvas más ancho se escala más y termina MÁS chico. */
    /* El pie de figura no se separa de su gráfico. */
    body.modo-impresion #informeSalida .chart-box + p {
      page-break-before: avoid; break-before: avoid;
      margin-top: 0;
    }

    /* -----------------------------------------------------------------
       FICHA INDIVIDUAL · A4 VERTICAL

       Hereda todo el papel claro de arriba; lo propio es el ancho de hoja.
       Los gráficos van más bajos que en el informe de equipo (60mm contra
       88): acá la hoja mide 190mm de ancho, no 400, así que un gráfico alto
       se come la carilla sin ganar legibilidad.
       ----------------------------------------------------------------- */
    body.modo-ficha-print #fichaSalida {
      max-width: none !important;
      padding: 0 !important;
    }
    /* La evolución ABRE HOJA. Con el corte automático el título quedaba al
       pie de una hoja y el gráfico arrancaba en la siguiente; y ahora que
       son varios gráficos —uno por métrica elegida— el bloque es largo y
       conviene que empiece limpio. */
    body.modo-ficha-print #fichaSalida [data-bloque="evolucion"] {
      page-break-before: always; break-before: page;
    }
    /* Cada gráfico con su pie no se parte del título de su panel. */
    body.modo-ficha-print #fichaSalida [data-bloque="evolucion"] > div {
      page-break-inside: avoid; break-inside: avoid;
    }

    /* Los bloques de la ficha SE PUEDEN PARTIR entre hojas. La regla general
       le pone `page-break-inside: avoid` a `.informe-bloque` —pensada para
       los bloques cortos del informe de equipo— y acá el de percentiles mide
       más de media carilla: con `avoid` se bajaba entero a la hoja
       siguiente y la primera quedaba con 2/3 en blanco. Medido: 4 hojas
       para una ficha que entra en 2.
       Lo que sí sigue sin partirse es cada TARJETA y cada TABLA. */
    body.modo-ficha-print #fichaSalida .informe-bloque {
      page-break-inside: auto; break-inside: auto;
      margin-bottom: 5mm;
    }
    body.modo-ficha-print #fichaSalida .card,
    body.modo-ficha-print #fichaSalida table {
      page-break-inside: avoid; break-inside: avoid;
    }
    body.modo-ficha-print #fichaSalida .chart-box {
      height: 60mm !important;
      max-height: 60mm !important;
      position: relative;
      overflow: hidden;
      margin-bottom: 3mm;
      page-break-inside: avoid; break-inside: avoid;
    }
    /* Igual que en el informe de equipo: al canvas NO se le fuerza el
       tamaño, o Chart.js dibuja el bitmap a una medida y el CSS lo escala a
       otra y el gráfico sale deformado. */
    body.modo-ficha-print #fichaSalida .chart-box canvas {
      max-width: 100% !important;
      max-height: 100% !important;
    }
    /* Los KPIs y las tarjetas de síntesis van en grillas de 2 y 4 columnas
       con breakpoints `sm:`/`lg:` que en una hoja de 794px nunca se activan:
       sin esto, cuatro tarjetas se apilan y se llevan media carilla. */
    body.modo-ficha-print #fichaSalida .grid-cols-4,
    body.modo-ficha-print #fichaSalida .lg\:grid-cols-4 {
      display: grid !important;
      grid-template-columns: repeat(4, 1fr) !important;
      gap: 2mm !important;
    }
    body.modo-ficha-print #fichaSalida .lg\:grid-cols-3 {
      display: grid !important;
      grid-template-columns: repeat(3, 1fr) !important;
      gap: 2mm !important;
    }
    body.modo-ficha-print #fichaSalida .lg\:grid-cols-2,
    body.modo-ficha-print #fichaSalida .sm\:grid-cols-2 {
      display: grid !important;
      grid-template-columns: repeat(2, 1fr) !important;
      gap: 2mm !important;
    }
    /* La sangría negativa del hover no hace falta en papel y corta el texto
       alineado a la derecha contra el borde de la hoja. */
    body.modo-ficha-print #fichaSalida .-mx-2 {
      margin-left: 0 !important; margin-right: 0 !important;
    }
    .ficha-cabecera-fila { display: flex; align-items: center; gap: 4mm; }
    .ficha-escudo { width: 16mm; height: 16mm; object-fit: contain; }
    .ficha-aviso { font-size: 8pt; color: #a16207 !important; margin-top: 2mm; }

    /* Las filas de los 8 ejes usan `px-2 -mx-2`: una sangría negativa para
       que el hover cubra todo el ancho de la card. En pantalla el padre
       tiene padding y no se nota; en el papel no lo tiene, así que esos 8mm
       se salían del área imprimible y CORTABAN el texto alineado a la
       derecha ("Acelerado", "Juego perimetral", "Va a la línea"…). Medido:
       6 elementos llegaban a 1510px sobre un informe de 1502.
       El hover no existe en papel, así que la sangría tampoco hace falta. */
    body.modo-impresion #informeSalida .-mx-2 {
      margin-left: 0 !important;
      margin-right: 0 !important;
    }
    /* Red de seguridad: nada se pega al filo de la hoja. */
    body.modo-impresion #informeSalida { padding-right: 1mm; }

    /* -----------------------------------------------------------------
       LOS QUE NO ENTRAN AL GRÁFICO, MÁS TENUES

       En pantalla la fila lleva `.fila-flojo` y sale en gris; en el papel el
       aplanado (`body * { color: #111 }`) los igualaba a todos, así que el
       plantel se leía como si los dieciocho pesaran lo mismo. Los que juegan
       menos de 10 minutos no entran al scatter y no deberían competir por la
       atención con los titulares de la rotación.

       Va con `color` y no con `opacity`: la opacidad afecta también a la
       insignia de iniciales y al borde de la fila, y en papel eso se ve
       sucio. El gris elegido sigue siendo legible impreso.
       ----------------------------------------------------------------- */
    body.modo-impresion #informeSalida tr.fila-flojo td,
    body.modo-impresion #informeSalida tr.fila-flojo td * { color: #94a3b8 !important; }
    body.modo-impresion #informeSalida tr.fila-flojo .fila-inicial {
      opacity: .55;
      border-color: #cbd5e1 !important;
    }

    /* -----------------------------------------------------------------
       BLOQUES QUE ABREN HOJA · `data-hoja`

       Pedido del club: "Cómo ataca", "Dónde gana y dónde pierde" y las
       tablas de "4 Factores ofensivos/defensivos" empiezan en página nueva.

       En pantalla esos tres viven DENTRO de un grid de dos columnas —al
       lado del radar o uno al lado del otro—, así que romper página no
       alcanza: primero hay que sacarlos de la grilla, o el navegador
       intenta mantener la fila y el corte queda a mitad de camino. En el
       papel el grid pasa a una columna y cada bloque ocupa su hoja entera,
       que es donde mejor se leen: son listas largas de ejes y de claves.
       ----------------------------------------------------------------- */
    body.modo-impresion #informeSalida [data-hoja] {
      page-break-before: always; break-before: page;
      page-break-inside: auto; break-inside: auto;
    }
    /* La grilla que contiene un `data-hoja` se aplana: si sigue en dos
       columnas, el corte de página parte la fila al medio. */
    body.modo-impresion #informeSalida .grid:has(> [data-hoja]) {
      display: block !important;
    }
    /* Respaldo para navegadores sin `:has()`: los grids de dos columnas del
       informe se aplanan igual, que en A3 apaisada no aprieta nada. */
    body.modo-impresion #informeSalida .lg\:grid-cols-2 { display: block !important; }
    body.modo-impresion #informeSalida .lg\:grid-cols-2 > * + * { margin-top: 4mm; }

    /* =================================================================
       SCOUTING PRE-PARTIDO · export por cards

       Se activa con la clase `modo-scout-print`, que scoutImprimir() pone
       en el <html> Y en el <body>, y saca en afterprint. Sin esa clase un
       Ctrl+P normal no cambia de comportamiento: hay tres exportaciones
       distintas en la app y no pueden pisarse entre sí.

       POR QUÉ LA CLASE VA TAMBIÉN EN EL <html>: las reglas de papel blanco
       de más arriba apuntan a `:root, html, body` con `!important`, y una
       clase del body no le puede ganar al selector `html`. Con la clase en
       el elemento raíz, `html.modo-scout-print` (0,1,1) sí gana.
       ================================================================= */

    html.modo-scout-print .no-imprimir,
    html.modo-scout-print .scout-card.no-imprimir { display: none !important; }

    /* -----------------------------------------------------------------
       COLORES DE LA APP EN EL PAPEL

       A pedido del club: el informe de scouting se imprime con la paleta
       vigente, no en blanco y negro. Es un PDF que se lee en pantalla y se
       comparte por WhatsApp, no una hoja para la impresora hogareña — el
       argumento de "el tema oscuro gasta tinta" no aplica acá.

       `print-color-adjust: exact` es obligatorio: sin él Chromium descarta
       fondos e imágenes al imprimir y quedaría todo blanco igual.
       ----------------------------------------------------------------- */
    /* El scouting usa el MISMO papel claro que los otros dos informes: todo
       eso ya está definido arriba, sin condicionar a ningún modo. Acá queda
       solo lo propio de esta exportación: los contenedores intermedios que
       traen fondo propio, y el `print-color-adjust`. */
    html.modo-scout-print .bg-base,
    html.modo-scout-print [class*="bg-base"],
    html.modo-scout-print #view-root,
    html.modo-scout-print #app,
    html.modo-scout-print #scoutInforme { background: transparent !important; }
    /* Obligatorio: sin esto Chromium descarta TODO fondo al imprimir y las
       tarjetas grises saldrían en blanco, sin separación entre bloques. */
    html.modo-scout-print, html.modo-scout-print * {
      -webkit-print-color-adjust: exact !important;
      print-color-adjust: exact !important;
    }

    /* -----------------------------------------------------------------
       LAS TARJETAS ANIDADAS DEL CICLO

       "Partidos ganados / perdidos" viven DENTRO de la card de splits y
       usan `bg-surface2/40`. El aplanado general las alcanza, pero pierde:
       el `<style>` del CDN de Tailwind se inyecta DESPUÉS del nuestro, así
       que a igual especificidad (0,1,0) y con `!important` en las dos, gana
       la que viene última en el documento. Salían en gris oscuro sobre la
       tarjeta clara. Con `body` adelante sube a 0,1,1 y gana el papel.

       El BORDE las distingue de un vistazo, que es para lo que el DT las
       mira: verde el bloque de ganados, rojo el de perdidos. */
    body .scout-ciclo-card {
      background: #ffffff !important;
      border: 1.4px solid #94a3b8 !important;
    }
    body .scout-ciclo-card.ciclo-ganado { border-color: #15803d !important; }
    body .scout-ciclo-card.ciclo-perdido { border-color: #b91c1c !important; }

    /* -----------------------------------------------------------------
       LOS CUATRO GRUPOS DEL PLAN COLECTIVO · borde sólido

       En pantalla van al 40% de opacidad, que sobre el fondo oscuro
       alcanza. En papel se desdibujan y los cuatro dejan de distinguirse
       entre sí, justo lo que hace legible el plan de un vistazo: cada
       grupo es una decisión defensiva distinta.
       ----------------------------------------------------------------- */
    body .scout-grupo {
      border-width: 1.5px !important;
      background: #ffffff !important;
    }
    body .scout-grupo.grupo-foco      { border-color: #b91c1c !important; }
    body .scout-grupo.grupo-intocable { border-color: #15803d !important; }
    body .scout-grupo.grupo-fuente    { border-color: #1d4ed8 !important; }
    body .scout-grupo.grupo-cristal   { border-color: #a16207 !important; }

    /* -----------------------------------------------------------------
       EL MAPA DE CALOR DEL TOP 3

       El color dice "acá está el especialista", no "este número es bueno":
       1° amenaza principal, 2° precaución, 3° foco complementario. Los
       tonos de pantalla sobre papel blanco dan 2,3 · 2,9 · 1,4 de
       contraste — el amarillo es prácticamente invisible.

       Se repintan con los tonos oscuros del resto del papel y se les sube
       el fondo del 10% a un tinte que sí se ve. El `!important` es
       obligatorio: el color de pantalla va en un `style` inline.
       ----------------------------------------------------------------- */
    /* -----------------------------------------------------------------
       EL SEMÁFORO DEL INFORME, TAMBIÉN EN EL PAPEL

       El informe pinta el mismo juego de tres tonos en ocho lugares —matriz
       de métricas, rankings de liga, línea de tiro, filas de cierre,
       leyenda del top 3, viñetas de la ficha— siempre con `style="color:…"`
       INLINE. Al imprimir, el aplanado (`body * { color: #111 !important }`)
       le gana al inline, así que TODOS los números salían en negro y se
       perdía la lectura rápida de "esto lo hace bien / esto lo hace mal".

       El motor emite, junto al color de pantalla, una clase que dice qué
       SIGNIFICA ese color (`scoutTono()`); acá se repinta con la variante
       oscura, que sobre papel blanco sí se lee. Son los mismos tonos que ya
       usan el verde y el rojo del resto del papel: un solo vocabulario. */
    body .tono-alto   { color: #15803d !important; }
    body .tono-bajo   { color: #b91c1c !important; }
    body .tono-medio  { color: #c2410c !important; }
    body .tono-aviso  { color: #a16207 !important; }
    body .tono-neutro { color: #64748b !important; }
    /* El chip del puesto lleva el color de fondo al 13% (`…22`), que sobre
       la tarjeta gris casi no se ve: se le sube el tinte. */
    body .chip-rk.tono-alto   { background: #dcfce7 !important; }
    body .chip-rk.tono-bajo   { background: #fee2e2 !important; }
    body .chip-rk.tono-neutro { background: #e2e8f0 !important; }

    body .top-1 { color: #15803d !important; background: #dcfce7 !important; }
    body .top-2 { color: #c2410c !important; background: #ffedd5 !important; }
    body .top-3 { color: #a16207 !important; background: #fef9c3 !important; }
    body .top-1, body .top-2, body .top-3 {
      border-radius: 1mm;
      padding: 0 1mm !important;
    }

    /* -----------------------------------------------------------------
       PAGINADO POR GRUPOS

       Antes CADA card rompía página (`page-break-after: always`), así que
       el informe salía a una card por hoja sin poder juntar las que se
       leen de a pares. Ahora rompe solo la que ABRE hoja (`.scout-pagina`)
       y las que no la llevan quedan pegadas a la anterior:

         1 Encabezado · 2 Matriz · 3 Ciclo
         4 Plan colectivo + Resumen de criterio
         5 Tabla de marcas (APAISADA)
         6 Jugadores clave + Claves estratégicas
         7+ Fichas individuales

       `page-break-before` y no `after`: si el DT destilda una card del
       medio, el corte lo sigue poniendo la card que sí se imprime. Con
       `after` quedaba una hoja en blanco donde estaba la oculta.
       ----------------------------------------------------------------- */
    html.modo-scout-print .scout-card {
      page-break-inside: avoid; break-inside: avoid;
      page-break-after: auto; break-after: auto;
      margin-bottom: 4mm;
    }
    html.modo-scout-print .scout-card.scout-pagina {
      page-break-before: always; break-before: page;
    }
    /* La primera no arrastra una hoja en blanco adelante. */
    html.modo-scout-print .scout-card.scout-pagina:first-of-type {
      page-break-before: auto; break-before: auto;
    }
    /* Las fichas individuales tampoco se cortan al medio. */
    html.modo-scout-print .scout-ficha {
      page-break-inside: avoid; break-inside: avoid;
    }

    /* -----------------------------------------------------------------
       LA HOJA APAISADA · el fix de "Restricción / alerta"

       La tabla de marcas mide `min-width: 62rem` (≈992px) y el área útil
       de un A4 vertical con margen 10mm es ~190mm (≈718px). La última
       columna caía FUERA del área de página y Chromium simplemente no la
       imprimía: no había scroll ni corte visible, la columna desaparecía.

       Dos correcciones, y hacen falta LAS DOS:

       1. `@page apaisada` + `page: apaisada` da 277mm útiles (≈1047px).
          Es CSS Paged Media: una página con nombre, aplicada por la
          propiedad `page` del elemento.
       2. `min-width: 0` + `overflow: visible` sobre el `.scrollbox`. El
          `min-width` es un estilo INLINE, así que hace falta `!important`
          para ganarle. Sin esto, aun apaisada la tabla se pasa unos píxeles
          y vuelve a recortar; y si el navegador ignorara la página
          nombrada, esta sola alcanza para que la columna entre —apretada,
          pero entera—. O sea: la columna no depende del landscape.
       ----------------------------------------------------------------- */
    /* -----------------------------------------------------------------
       EL TAMAÑO DE HOJA DEL INFORME · A3 apaisada

       Pedido: "el mismo largo que A4, pero lo suficientemente ancha para
       que entren todas las tablas y dos fichas de jugador una al lado de
       la otra". A3 apaisada es exactamente eso y no hay que inventar una
       medida:

           A4 vertical  210 × 297 mm
           A3 apaisada  420 × 297 mm   ← mismo alto, el doble de ancho

       Con margen 10mm quedan 400mm útiles (≈1512px): la tabla de marcas
       entra holgada y las fichas van de a dos por fila.

       Se aplica a TODO el informe de scouting, no solo a la tabla: mezclar
       tamaños dentro de un mismo PDF obliga al DT a rotar hojas para
       leerlo, y la carpeta del cuerpo técnico es de un solo formato.
       ----------------------------------------------------------------- */
    @page apaisada { size: A3 landscape; margin: 10mm; }
    /* La `page` va en el BODY y no solo en las cards. `@page` a secas no se
       puede condicionar por clase, así que la hoja por defecto sigue siendo
       la A4 vertical que usan las otras dos exportaciones; sin esta línea,
       todo lo que quedara fuera de una card —y el arranque del documento—
       generaba hojas A4 sueltas mezcladas con las A3. Medido: el PDF salía
       con los dos tamaños. */
    html.modo-scout-print body,
    html.modo-scout-print .scout-card { page: apaisada; }
    html.modo-scout-print .scrollbox {
      overflow: visible !important;
      max-width: none !important;
    }
    /* El ancho de la app está topeado en 1600px para pantalla; en el papel
       tiene que ocupar la hoja entera. */
    html.modo-scout-print #view-root,
    html.modo-scout-print main { max-width: none !important; padding: 0 !important; }

    /* -----------------------------------------------------------------
       FICHAS DE JUGADOR · dos por fila

       En una hoja de 400mm útiles, una ficha por fila deja media hoja en
       blanco y estira el informe a el doble de páginas.
       ----------------------------------------------------------------- */
    html.modo-scout-print [data-bloque="fichas"] .scout-fichas-grid {
      display: grid !important;
      grid-template-columns: 1fr 1fr;
      gap: 4mm;
      align-items: start;
    }
    html.modo-scout-print .tabla-marcas {
      min-width: 0 !important;
      width: 100% !important;
      table-layout: fixed;
      font-size: 7.5pt;
    }
    html.modo-scout-print .tabla-marcas td,
    html.modo-scout-print .tabla-marcas th {
      padding: 1.5mm 1.5mm;
      vertical-align: top;
      word-break: break-word;      /* un nombre largo no ensancha la columna */
      overflow-wrap: anywhere;
    }

    /* Los inputs editables de marcas SI tienen que verse en el papel: la
       regla general esconde todo input, y acá el valor cargado por el DT es
       justamente el contenido del informe. */
    html.modo-scout-print .scout-card input[type="text"] {
      display: block !important;
      width: 100% !important;
      border: none !important;
      background: transparent !important;
      color: var(--acento-papel, #a16014) !important;
      padding: 0 !important;
      font-size: 7.5pt;
      font-weight: 700;
    }
  }

  /* Fuera de impresion el helper no hace nada visible: existe para que
     el modal de export y los controles no entren al PDF. */
  @media screen { .no-imprimir { } }

  /* Al reves: lo que existe SOLO para el papel. La ficha del cruce (fecha,
     torneo, proximo rival) se repite ahi como texto porque en pantalla vive
     en inputs, y `@media print` esconde todo control de formulario. */
  .solo-imprimir { display: none; }
  @media print {
    .solo-imprimir { display: block; }
    .scout-meta-impresa {
      display: grid !important;
      grid-template-columns: repeat(auto-fit, minmax(38mm, 1fr));
      gap: 2mm 5mm;
      padding: 2mm 0 3mm;
      margin-bottom: 3mm;
      border-bottom: 1px solid #282828;
    }
  }

  /* Insignia de respaldo cuando un equipo no tiene escudo resuelto. Sin
     esto el informe quedaba sin ninguna marca del equipo — pasa siempre que
     el manifiesto de logos no se pueda leer (por ejemplo abriendo el panel
     como file://, donde el fetch del indice lo bloquea CORS). */
  .escudo-iniciales {
    display: inline-grid; place-items: center;
    border-radius: 50%;
    background: #1c1c1f; border: 1px solid #333;
    color: #a8b0bd; font-weight: 700; line-height: 1;
    letter-spacing: .02em;
  }

  .card { background: #141414; border: 1px solid #282828; transition: border-color .15s ease; }
  .card:hover { border-color: #3a3a3a; }

  table thead th { position: sticky; top: 0; background: #141414; z-index: 1; }
  tbody tr { transition: background-color .1s ease; }
  tbody tr:hover { background: #1b1b1b; }
  tbody tr:hover td:first-child { box-shadow: inset 3px 0 0 var(--acento); }

  ::selection { background: var(--acento); color: #0a0a0a; }
  input:focus-visible, button:focus-visible, select:focus-visible, [tabindex]:focus-visible {
    outline: 2px solid var(--acento); outline-offset: 2px;
  }

  @keyframes spin-slow { to { transform: rotate(360deg); } }
  .animate-spin-slow { animation: spin-slow .9s linear infinite; }

  /* overflow-hidden del contenedor pisaba el scroll horizontal: las tablas
     anchas quedaban CORTADAS en mobile en vez de scrollear. */
  .scrollbox {
    overflow-x: auto !important;
    overflow-y: hidden;
    -webkit-overflow-scrolling: touch;
    overscroll-behavior-x: contain;
  }

  /* Alturas de graficos por breakpoint */
  .chart-box { position: relative; width: 100%; height: 520px; }
  .chart-box.is-md { height: 420px; }
  .chart-box.is-sm { height: 380px; }
  @media screen and (max-width: 1023px) {
    .chart-box { height: 440px; }
    .chart-box.is-md { height: 380px; }
    .chart-box.is-sm { height: 340px; }
  }
  @media screen and (max-width: 767px) {
    .chart-box { height: 400px; }
    .chart-box.is-md { height: 320px; }
    .chart-box.is-sm { height: 300px; }
  }
  @media screen and (max-width: 479px) {
    .chart-box { height: 360px; }
    .chart-box.is-md { height: 280px; }
    .chart-box.is-sm { height: 260px; }
  }

  /* Primera columna fija: sin esto perdes de vista que jugador estas mirando
     apenas scrolleas la tabla a lo ancho.

     VA EN `screen` Y NO A SECAS, y esto costó una tarde: al imprimir, Chrome
     evalua las media queries contra el ANCHO DE HOJA del dialogo —A4 vertical
     con margenes por defecto da ~717px, o sea MENOS de 767— asi que la regla
     se activaba en el papel. Ahi no hay scroll horizontal que justifique la
     columna fija, y su `background: #141414` pintaba la primera columna de
     NEGRO: los nombres, ya aplanados a #111 por el papel blanco, quedaban
     invisibles. Se veia en la tabla de marcas del scouting y en los dos box
     scores del post-partido, en cualquier club.

     Los PDF que se auditaron antes no lo mostraban porque se generaban con
     `printToPDF` y margenes en 0, que da una hoja mas ancha que 767px y nunca
     entraba en esta rama. Auditar con el papel del dialogo, no con el de la
     automatizacion. */
  @media screen and (max-width: 767px) {
    .scrollbox table th:first-child,
    .scrollbox table td:first-child {
      position: sticky; left: 0; z-index: 2;
      background: #141414;
      box-shadow: 1px 0 0 #282828;
    }
    .scrollbox table thead th:first-child { z-index: 3; }
    .scrollbox tbody tr:hover td:first-child { background: #1b1b1b; }
    .scrollbox table th, .scrollbox table td { padding-left: .625rem; padding-right: .625rem; }
  }

  /* Targets tactiles: 44px es el minimo comodo con el dedo */
  @media (pointer: coarse) {
    button, select, [role="button"] { min-height: 44px; }
    .legend-chip { min-height: 0; }
  }

  /* Panel de logos faltantes: a lo ancho abajo en telefono */
  @media screen and (max-width: 639px) {
    #logosFaltantesPanel {

<script>
/* ============ CONFIGURACIÓN DE HOJAS ============ */

   aca, asi que cambiar de categoria cambia el dashboard entero. */
let SHEET_ID = '1Zi2cBd0WGUTks-S0XCxR0hoGpB9KZGuqisFhzdtJl4s';

const SHEETS_CONFIG = [
  { name: 'ACUMULADO J',   key: 'acumuladoJ'   },
  { name: 'PROMEDIOS J',   key: 'promediosJ'   },
